<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow14" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad14)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow14)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    GABARITO FECHADO DAS 5 PERGUNTAS DE PROVA DA PROFª DRA. PAULA (SLIDE 35)
  </text>

  <!-- 5 Cartões de Perguntas & Respostas Oficiais -->

  <!-- P1 -->
  <g transform="translate(45, 85)" filter="url(#shadow14)">
    <rect width="395" height="105" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="395" height="28" rx="8" fill="#2563eb"/>
    <text x="15" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PERGUNTA 1: QUAL O TIPO DE INFLAMAÇÃO?</text>
    
    <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">Resposta Oficial:</text>
    <text x="15" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#047857">→ Inflamatória Crônica</text>
    <text x="15" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Sinovite proliferativa e não supurativa com pannus e infiltrado mononuclear.</text>
  </g>

  <!-- P2 -->
  <g transform="translate(460, 85)" filter="url(#shadow14)">
    <rect width="395" height="105" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="395" height="28" rx="8" fill="#d97706"/>
    <text x="15" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PERGUNTA 2: POR QUE A RIGIDEZ MELHORA COM MOVIMENTO?</text>

    <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">Resposta Oficial:</text>
    <text x="15" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#047857">→ O movimento reduz mediadores inflamatórios</text>
    <text x="15" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Durante o repouso há acúmulo de citocinas (TNF, IL-1, IL-6) e edema sinovial ("gel").</text>
  </g>

  <!-- P3 -->
  <g transform="translate(45, 205)" filter="url(#shadow14)">
    <rect width="395" height="110" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="395" height="28" rx="8" fill="#059669"/>
    <text x="15" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PERGUNTA 3: QUAL A IMPORTÂNCIA DO ANTI-CCP?</text>

    <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">Resposta Oficial:</text>
    <text x="15" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#047857">→ Alta especificidade (~95%) para AR</text>
    <text x="15" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Quando positivo é forte evidência que confirma a doença e indica prognóstico erosivo.</text>
  </g>

  <!-- P4 -->
  <g transform="translate(460, 205)" filter="url(#shadow14)">
    <rect width="395" height="110" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="0" y="0" width="395" height="28" rx="8" fill="#0891b2"/>
    <text x="15" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PERGUNTA 4: QUAL CITOCINA É ALVO TERAPÊUTICO?</text>

    <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#0e7490">Resposta Oficial:</text>
    <text x="15" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#047857">→ Fator de Necrose Tumoral (TNF-α)</text>
    <text x="15" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Bloqueado por imunobiológicos anti-TNF: Infliximabe e Adalimumabe.</text>
  </g>

  <!-- P5: Pergunta 5 em Largura Total -->
  <g transform="translate(45, 330)" filter="url(#shadow14)">
    <rect width="810" height="120" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="810" height="30" rx="10" fill="#dc2626"/>
    <text x="25" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">PERGUNTA 5: QUAL O MECANISMO QUE LEVA À EROSÃO ÓSSEA?</text>

    <text x="25" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">Resposta Oficial de Síntese:</text>
    <text x="25" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#047857">
      → Eixo RANKL → Ativação de Osteoclastos multinucleados
    </text>
    <text x="25" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      Expressão de RANKL por células T ativadas e sinoviócitos estimula os osteoclastos a secretar ácido (dissolvendo hidroxiapatita) e catepsinas (digerindo o colágeno ósseo).
    </text>
  </g>
</svg>