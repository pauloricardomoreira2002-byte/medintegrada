<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad7)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow7)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    PROGRESSÃO HISTOPATOLÓGICA: SINOVITE, PANNUS E ANQUILOSE
  </text>

  <!-- 3 Painéis Comparativos -->

  <!-- 1. Articulação Normal -->
  <g transform="translate(45, 90)" filter="url(#shadow7)">
    <rect width="255" height="360" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="35" rx="10" fill="#059669"/>
    <text x="127" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. ARTICULAÇÃO NORMAL</text>

    <!-- Desenho esquemático normal -->
    <!-- Osso Superior -->
    <path d="M 60 50 L 195 50 L 195 90 Q 127 105 60 90 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="127" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Epífise Óssea</text>
    <!-- Cartilagem Superior -->
    <path d="M 65 92 Q 127 107 190 92 L 190 100 Q 127 115 65 100 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>

    <!-- Espaço Articular -->
    <rect x="70" y="103" width="115" height="14" fill="#eff6ff"/>
    <text x="127" y="113" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#1e40af" text-anchor="middle">Líquido Sinovial Límpido</text>

    <!-- Cartilagem Inferior -->
    <path d="M 65 125 Q 127 110 190 125 L 190 118 Q 127 103 65 118 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>
    <!-- Osso Inferior -->
    <path d="M 60 127 Q 127 112 195 127 L 195 167 L 60 167 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="127" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Epífise Óssea</text>

    <!-- Cápsula / Sinóvia Lisa -->
    <path d="M 55 70 C 40 100, 40 120, 55 150" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <path d="M 200 70 C 215 100, 215 120, 200 150" fill="none" stroke="#10b981" stroke-width="2.5"/>

    <!-- Descrição -->
    <rect x="15" y="180" width="225" height="165" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="25" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Membrana Sinovial:</text>
    <text x="25" y="216" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">Delgada, 1 a 3 camadas de células</text>
    <text x="25" y="236" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Cartilagem Hialina:</text>
    <text x="25" y="252" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">Superfície lisa, lubrificada, avascular</text>
    <text x="25" y="272" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Espaço Articular:</text>
    <text x="25" y="288" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">Amplo, sem aderências</text>
    <text x="25" y="308" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#059669">• Mobilidade Completa</text>
    <text x="25" y="324" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">Sem dor ou limitação funcional</text>
  </g>

  <!-- 2. Pannus Reumatoide (Fase Ativa) -->
  <g transform="translate(325, 90)" filter="url(#shadow7)">
    <rect width="255" height="360" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="0" y="0" width="255" height="35" rx="10" fill="#dc2626"/>
    <text x="127" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. PANNUS &amp; SINOVITE ATIVA</text>

    <!-- Desenho esquemático com pannus -->
    <!-- Osso Superior com erosão -->
    <path d="M 60 50 L 195 50 L 195 85 Q 127 100 85 85 Q 75 95 60 85 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <!-- Cartilagem comida -->
    <path d="M 85 88 Q 127 102 170 88 L 170 95 Q 127 108 85 95 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>

    <!-- PANNUS Invasivo (vermelho/rosa invadindo os cantos) -->
    <path d="M 45 65 C 75 60, 90 95, 75 110 C 60 125, 80 145, 50 155 Z" fill="#f87171" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="62" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">Pannus</text>

    <path d="M 210 65 C 180 60, 165 95, 180 110 C 195 125, 175 145, 205 155 Z" fill="#f87171" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="180" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">Pannus</text>

    <!-- Osso Inferior com erosão marginal -->
    <path d="M 60 135 Q 75 125 90 135 Q 127 120 195 135 L 195 167 L 60 167 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>

    <!-- Descrição -->
    <rect x="15" y="180" width="225" height="165" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="25" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">• Pannus Sinovial:</text>
    <text x="25" y="216" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">Tecido inflamatório com padrão tumoral</text>
    <text x="25" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">• Sinoviócitos hiperplásicos + vasos</text>
    <text x="25" y="250" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">• Destruição Ativa:</text>
    <text x="25" y="266" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">Proteases digerem a cartilagem</text>
    <text x="25" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">RANKL ativa osteoclastos marginais</text>
    <text x="25" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">• Estreitamento da rima articular</text>
    <text x="25" y="318" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">• Erosões ósseas marginais</text>
  </g>

  <!-- 3. Fase Terminal: Anquilose -->
  <g transform="translate(605, 90)" filter="url(#shadow7)">
    <rect width="255" height="360" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="35" rx="10" fill="#4b5563"/>
    <text x="127" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. ANQUILOSE (Fase Final)</text>

    <!-- Desenho esquemático com anquilose -->
    <!-- Osso fundido sólido -->
    <path d="M 60 50 L 195 50 L 195 167 L 60 167 Z" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
    <line x1="60" y1="108" x2="195" y2="108" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="127" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#374151" text-anchor="middle">FUSÃO ÓSSEA COMPLETA</text>
    <text x="127" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Perda do espaço articular)</text>

    <!-- Descrição -->
    <rect x="15" y="180" width="225" height="165" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="25" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#374151">• Anquilose Fibrosa:</text>
    <text x="25" y="216" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">Tecido cicatricial preenche a cavidade</text>
    <text x="25" y="236" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#374151">• Anquilose Óssea:</text>
    <text x="25" y="252" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">Ossificação das pontes fibrosas</text>
    <text x="25" y="266" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">Fusão anatômica permanente</text>
    <text x="25" y="288" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">• Rigidez Total / Perda Funcional</text>
    <text x="25" y="306" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#4b5563">• Deformidades irreversíveis</text>
    <text x="25" y="324" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#1f2937">Estágio prevenível com Anti-TNF precoce</text>
  </g>
</svg>