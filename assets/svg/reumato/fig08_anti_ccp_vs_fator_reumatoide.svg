<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440">
  <defs>
    <linearGradient id="bgGrad8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="440" rx="16" fill="url(#bgGrad8)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow8)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    DUELO SOROLÓGICO DE PROVA: ANTI-CCP vs. FATOR REUMATOIDE (FR)
  </text>

  <!-- Painel Esquerdo: Anti-CCP (Padrão Ouro de Especificidade) -->
  <g transform="translate(45, 90)" filter="url(#shadow8)">
    <rect width="385" height="325" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="385" height="45" rx="12" fill="#059669"/>
    <text x="192" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ANTICORPO ANTI-CCP (ACPA)
    </text>

    <!-- Indicadores -->
    <rect x="25" y="60" width="160" height="70" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="105" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">SENSIBILIDADE</text>
    <text x="105" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">60 - 80%</text>

    <rect x="200" y="60" width="160" height="70" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="280" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">ESPECIFICIDADE</text>
    <text x="280" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">~95% (ALTA!)</text>

    <!-- Características -->
    <rect x="25" y="145" width="335" height="155" rx="8" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
    <text x="35" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#065f46">Alvo Molecular:</text>
    <text x="35" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Peptídeos com resíduos de citrulina (neoantígenos)</text>

    <text x="35" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#065f46">Valor Clínico de Prova:</text>
    <text x="35" y="227" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Forte evidência confirmatória de AR</text>
    <text x="35" y="244" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Preditivo de doença erosiva mais agressiva</text>
    <text x="35" y="261" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Pode surgir anos antes dos primeiros sintomas</text>
    <text x="35" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">• Não aparece em 100% dos casos (AR Soronegativa)</text>
  </g>

  <!-- Painel Direito: Fator Reumatoide -->
  <g transform="translate(470, 90)" filter="url(#shadow8)">
    <rect width="385" height="325" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="385" height="45" rx="12" fill="#d97706"/>
    <text x="192" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      FATOR REUMATOIDE (FR)
    </text>

    <!-- Indicadores -->
    <rect x="25" y="60" width="160" height="70" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <text x="105" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">SENSIBILIDADE</text>
    <text x="105" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#92400e" text-anchor="middle">~80%</text>

    <rect x="200" y="60" width="160" height="70" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="280" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">ESPECIFICIDADE</text>
    <text x="280" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ea580c" text-anchor="middle">BAIXA</text>

    <!-- Características -->
    <rect x="25" y="145" width="335" height="155" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="35" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Definição Imunológica:</text>
    <text x="35" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Autoanticorpo (IgM/IgA) contra a porção <tspan font-weight="bold">Fc da IgG</tspan></text>

    <text x="35" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Pegadinha Clássica de Prova:</text>
    <text x="35" y="227" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• <tspan font-weight="bold" fill="#dc2626">FR POSITIVO NÃO FECHA DIAGNÓSTICO!</tspan></text>
    <text x="35" y="244" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• Falsos positivos: LES, Sjögren, Hepatite C,</text>
    <text x="35" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">  Tuberculose, Endocardite, Idosos hígidos (5-10%)</text>
    <text x="35" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">• Forma imunocomplexos com a IgG</text>
  </g>
</svg>