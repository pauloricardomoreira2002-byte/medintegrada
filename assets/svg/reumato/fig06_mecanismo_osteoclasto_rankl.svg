<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad6)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow6)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    FISIOPATOLOGIA DA EROSÃO ÓSSEA: EIXO RANKL - OSTEOCLASTO
  </text>

  <!-- Matriz Óssea Subjacente -->
  <rect x="45" y="340" width="810" height="115" rx="10" fill="url(#boneGrad)" stroke="#d97706" stroke-width="2"/>
  <text x="75" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#92400e">MATRIZ ÓSSEA MINERALIZADA</text>
  <text x="75" y="398" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#b45309">Composta por Cristais de Hidroxiapatita de Cálcio + Arcabouço de Colágeno Tipo I</text>
  <text x="75" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">Local de formação das EROSÕES ÓSSEAS JUSTA-ARTICULARES (visíveis na radiografia)</text>

  <!-- Escavação / Lacuna de Howship -->
  <path d="M 400 340 Q 560 380 720 340 Z" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="560" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">LACUNA DE HOWSHIP (Área de Reabsorção Ácida)</text>

  <!-- Corpo do Osteoclasto Multinucleado -->
  <g transform="translate(380, 100)" filter="url(#shadow6)">
    <path d="M 40 40 C 20 80, 20 180, 30 230 C 50 235, 70 230, 90 235 C 110 230, 130 235, 150 230 C 170 235, 190 230, 210 235 C 230 230, 250 235, 270 230 C 290 235, 310 230, 330 235 C 340 180, 340 80, 320 40 C 280 10, 100 10, 40 40 Z" 
          fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
    
    <text x="180" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#9d174d" text-anchor="middle">
      OSTEOCLASTO ATIVADO (Multinucleado)
    </text>

    <!-- Núcleos múltiplos -->
    <ellipse cx="90" cy="70" rx="16" ry="12" fill="#be185d"/>
    <ellipse cx="140" cy="65" rx="16" ry="12" fill="#be185d"/>
    <ellipse cx="190" cy="70" rx="16" ry="12" fill="#be185d"/>
    <ellipse cx="240" cy="65" rx="16" ry="12" fill="#be185d"/>

    <!-- Receptores RANK na membrana basolateral -->
    <rect x="70" y="10" width="16" height="12" fill="#3b82f6"/>
    <text x="78" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8" text-anchor="middle">RANK</text>
    <text x="40" y="-10" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">RANKL (de Célula T)</text>
    <line x1="78" y1="-2" x2="78" y2="10" stroke="#dc2626" stroke-width="2"/>

    <!-- Reação Bioquímica Interna -->
    <rect x="50" y="100" width="260" height="75" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
    <text x="180" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#9d174d" text-anchor="middle">
      CO2 + H2O ↔ [Anidrase Carbônica II] ↔ H⁺ + HCO3⁻
    </text>
    <text x="180" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle">
      • HCO3⁻ trocado por Cl⁻ basolateral
    </text>
    <text x="180" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#be185d" text-anchor="middle">
      • Bomba H⁺-ATPase apical ejeta prótons na matriz
    </text>

    <!-- Borda Pregueada e Secreções -->
    <text x="180" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      ↓↓ Bomba H⁺ (pH ~4,5) &amp; Enzimas (Catepsina K) ↓↓
    </text>
  </g>

  <!-- Painel Explicativo à Esquerda -->
  <g transform="translate(45, 90)" filter="url(#shadow6)">
    <rect width="310" height="235" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="35" rx="10" fill="#2563eb"/>
    <text x="155" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ETAPAS DA EROSÃO ÓSSEA NA AR
    </text>
    
    <text x="15" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">1. Estímulo por RANKL:</text>
    <text x="15" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">Linfócitos T ativados e fibroblastos sinoviais</text>
    <text x="15" y="87" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">expressam RANKL em resposta a TNF e IL-1.</text>

    <text x="15" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">2. Diferenciação de Osteoclastos:</text>
    <text x="15" y="127" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">Precursores monocíticos fundem-se em</text>
    <text x="15" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">células gigantes multinucleadas ativas.</text>

    <text x="15" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">3. Desmineralização e Proteólise:</text>
    <text x="15" y="182" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">• Prótons (H⁺) dissolvem a hidroxiapatita.</text>
    <text x="15" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">• Catepsina K digere a trama de colágeno.</text>
    <text x="15" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">→ Causa a perda óssea irreversível!</text>
  </g>
</svg>