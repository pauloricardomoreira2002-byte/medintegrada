<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
  </defs>

  <rect width="900" height="500" rx="16" fill="url(#bgGrad3)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow3)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    CASCATA PATOGENÉTICA INTEGRADA DA ARTRITE REUMATOIDE
  </text>

  <!-- Bloco 1: Genética -->
  <g transform="translate(50, 90)" filter="url(#shadow3)">
    <rect width="360" height="75" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="180" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1. INDIVÍDUO GENETICAMENTE SUSCEPTÍVEL</text>
    <text x="180" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• 50% do risco atribuível à hereditariedade</text>
    <text x="180" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">• HLA-DRB1 (Epítopo Compartilhado) / Alelo HLA-DR4 (RR: 4-12)</text>
  </g>

  <!-- Bloco 2: Gatilhos Ambientais -->
  <g transform="translate(490, 90)" filter="url(#shadow3)">
    <rect width="360" height="75" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="180" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">2. AGENTES ARTRITOGÊNICOS / GATILHOS</text>
    <text x="180" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• Tabagismo (estresse oxidativo e ativação pulmonar de PAD)</text>
    <text x="180" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• Infecções (ex: Porphyromonas gingivalis / periodontite), Obesidade</text>
  </g>

  <!-- Linhas convergentes para o Bloco 3 -->
  <path d="M 230 165 L 230 185 L 440 185 L 440 200" fill="none" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 670 165 L 670 185 L 460 185 L 460 200" fill="none" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Bloco 3: Citrulinização & Neoantígenos -->
  <g transform="translate(200, 205)" filter="url(#shadow3)">
    <rect width="500" height="65" rx="10" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
    <text x="250" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="middle">3. CITRULINIZAÇÃO DE PROTEÍNAS (Enzimas PADs)</text>
    <text x="250" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Arginina → Citrulina gerando NEOANTÍGENOS apresentados pelo MHC-II</text>
  </g>

  <!-- Seta 3 para 4 -->
  <path d="M 450 270 L 450 290" fill="none" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Bloco 4: Quebra da Autotolerância e Autoanticorpos -->
  <g transform="translate(180, 295)" filter="url(#shadow3)">
    <rect width="540" height="70" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="270" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">4. QUEBRA DA AUTOTOLERÂNCIA E SÍNTESE DE AUTOANTICORPOS</text>
    <text x="270" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Ativação de Células B e T autorreativas → Produção de Anti-CCP e Fator Reumatoide (FR)</text>
    <text x="270" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b" text-anchor="middle">Formação de imunocomplexos que se depositam na membrana sinovial</text>
  </g>

  <!-- Seta 4 para 5 -->
  <path d="M 450 365 L 450 385" fill="none" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Bloco 5: Resposta Celular, Pannus e Destruição -->
  <g transform="translate(100, 390)" filter="url(#shadow3)">
    <rect width="700" height="85" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/>
    <text x="350" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="bold" fill="#991b1b" text-anchor="middle">5. SINOVITE CRÔNICA PROLIFERATIVA, PANNUS E EROSÃO</text>
    <text x="350" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• Citocinas: Th1 (IFN-γ) + Th17 (IL-17) + Macrófagos (TNF-α, IL-1, IL-6)</text>
    <text x="350" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• Proliferação sinovial invasiva (Pannus) com hipertrofia vilositária e angiogênese</text>
    <text x="350" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">• Secreção de Proteases (MMPs) e ativação de Osteoclastos via RANKL → Destruição Articular</text>
  </g>
</svg>