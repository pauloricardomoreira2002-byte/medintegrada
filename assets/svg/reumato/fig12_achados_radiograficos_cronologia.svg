<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="bgGrad12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow12" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="460" rx="16" fill="url(#bgGrad12)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow12)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    SEQUÊNCIA RADIOGRÁFICA EVOLUTIVA DA ARTRITE REUMATOIDE
  </text>

  <!-- 4 Estágios Radiográficos (Slides 33 e 34) -->

  <!-- Estágio 1: Edema de Partes Moles -->
  <g transform="translate(45, 90)" filter="url(#shadow12)">
    <rect width="185" height="260" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="35" rx="10" fill="#2563eb"/>
    <text x="92" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1. FASE PRECOCE</text>

    <circle cx="92" cy="80" r="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="92" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">EDEMA</text>

    <text x="92" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Edema de Partes</text>
    <text x="92" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Moles Periarticular</text>

    <rect x="15" y="165" width="155" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="92" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">• Aumento fusiforme</text>
    <text x="92" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">radiodenso ao redor</text>
    <text x="92" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">das IFP e MCFs</text>
    <text x="92" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">(Sinal das setas - Slide 34)</text>
  </g>

  <!-- Estágio 2: Osteopenia Justarticular -->
  <g transform="translate(255, 90)" filter="url(#shadow12)">
    <rect width="185" height="260" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="35" rx="10" fill="#d97706"/>
    <text x="92" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2. DESMINERALIZAÇÃO</text>

    <circle cx="92" cy="80" r="30" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="92" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">OSTEOPENIA</text>

    <text x="92" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Osteopenia</text>
    <text x="92" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Justarticular</text>

    <rect x="15" y="165" width="155" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="92" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">• Clareamento da</text>
    <text x="92" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">densidade óssea</text>
    <text x="92" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">próximo à articulação</text>
    <text x="92" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">Hiperemia + Citocinas</text>
  </g>

  <!-- Estágio 3: Estreitamento Articular -->
  <g transform="translate(465, 90)" filter="url(#shadow12)">
    <rect width="185" height="260" rx="10" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="35" rx="10" fill="#9333ea"/>
    <text x="92" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3. CARTILAGEM</text>

    <circle cx="92" cy="80" r="30" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="92" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#7e22ce" text-anchor="middle">ESPAÇO ↓</text>

    <text x="92" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Estreitamento do</text>
    <text x="92" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Espaço Articular</text>

    <rect x="15" y="165" width="155" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="92" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">• Perda simétrica e</text>
    <text x="92" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">uniforme da cartilagem</text>
    <text x="92" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">digerida por colagenases</text>
    <text x="92" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7e22ce" text-anchor="middle">(Diferente da artrose!)</text>
  </g>

  <!-- Estágio 4: Erosões Marginais -->
  <g transform="translate(675, 90)" filter="url(#shadow12)">
    <rect width="185" height="260" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="0" y="0" width="185" height="35" rx="10" fill="#dc2626"/>
    <text x="92" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4. DESTRUIÇÃO</text>

    <circle cx="92" cy="80" r="30" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="92" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">EROSÕES</text>

    <text x="92" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">Erosões Ósseas</text>
    <text x="92" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">Justarticulares</text>

    <rect x="15" y="165" width="155" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="92" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">• Lesões marginais</text>
    <text x="92" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">em "saca-bocado"</text>
    <text x="92" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">• Ação do Pannus</text>
    <text x="92" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">+ RANKL / Osteoclastos</text>
  </g>

  <!-- Banner Inferior com Desvio Ulnar e Anquilose -->
  <rect x="45" y="370" width="815" height="65" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="65" y="392" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">
    Fases Tardias / Sequelas Estruturais (Slide 33):
  </text>
  <text x="65" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
    • <tspan font-weight="bold">Desvio Ulnar:</tspan> Desalinhamento progressivo por destruição ligamentar e desbalanço tendíneo extensor/flexor.
  </text>
  <text x="65" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
    • <tspan font-weight="bold">Anquilose Óssea:</tspan> Fusão óssea completa com desaparecimento definitivo do espaço articular radiográfico.
  </text>
</svg>