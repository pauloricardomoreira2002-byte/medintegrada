<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="440" rx="16" fill="url(#bgGrad4)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow4)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    MECANISMO MOLECULAR DA CITRULINIZAÇÃO DE PROTEÍNAS
  </text>

  <!-- Lado Esquerdo: L-Arginina -->
  <g transform="translate(45, 90)" filter="url(#shadow4)">
    <rect width="320" height="220" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#2563eb"/>
    <text x="160" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">L-ARGININA (Fisiológico)</text>

    <!-- Desenho esquemático da cadeia química -->
    <rect x="30" y="55" width="260" height="100" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="160" y="78" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">R — CH2 — CH2 — CH2</text>
    <text x="160" y="100" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">|</text>
    <text x="160" y="122" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">NH — C(=NH2+) — NH2</text>
    <text x="160" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">[ Grupo Guanidino Positivo (+) ]</text>

    <!-- Propriedades -->
    <text x="160" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• Carga elétrica positiva líquida</text>
    <text x="160" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• Reconhecido como próprio (autotolerado)</text>
  </g>

  <!-- Centro: Enzima PAD -->
  <g transform="translate(390, 110)">
    <!-- Seta e Círculo da Enzima -->
    <circle cx="60" cy="50" r="42" fill="#f59e0b" filter="url(#shadow4)"/>
    <text x="60" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">PAD</text>
    <text x="60" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#fffbeb" text-anchor="middle">+ Ca²⁺</text>

    <path d="M 10 110 L 110 110" fill="none" stroke="#d97706" stroke-width="4"/>
    <polygon points="105,103 118,110 105,117" fill="#d97706"/>

    <text x="60" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">Peptidil-Arginina</text>
    <text x="60" y="148" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">Deiminase</text>
    <text x="60" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#78350f" text-anchor="middle">+ H2O → libera NH4⁺</text>
  </g>

  <!-- Lado Direito: L-Citrulina -->
  <g transform="translate(535, 90)" filter="url(#shadow4)">
    <rect width="320" height="220" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#dc2626"/>
    <text x="160" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">L-CITRULINA (Modificado)</text>

    <!-- Desenho esquemático da cadeia química -->
    <rect x="30" y="55" width="260" height="100" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <text x="160" y="78" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">R — CH2 — CH2 — CH2</text>
    <text x="160" y="100" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">|</text>
    <text x="160" y="122" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">NH — C(=O) — NH2</text>
    <text x="160" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">[ Grupo Ureído Neutro (0) ]</text>

    <!-- Propriedades -->
    <text x="160" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">• Perda da carga positiva</text>
    <text x="160" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">• Formação de NEOANTÍGENO</text>
  </g>

  <!-- Caixa de Consequência Imunológica -->
  <rect x="45" y="325" width="810" height="95" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#shadow4)"/>
  <text x="65" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#4338ca">
    Impacto Imunológico Central (Foco de Avaliação):
  </text>
  <text x="65" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">
    1. A alteração na carga elétrica altera o dobramento conformacional terciário da proteína (ex: fibrinogênio, vimentina).
  </text>
  <text x="65" y="390" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">
    2. O peptídeo citrulinado se liga com alta afinidade à fenda do <tspan font-weight="bold" fill="#4338ca">HLA-DRB1</tspan> contendo o epítopo compartilhado.
  </text>
  <text x="65" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">
    3. Células B e plasmócitos geram <tspan font-weight="bold" fill="#b91c1c">Anticorpos Anti-Proteína Citrulinada (Anti-CCP / ACPA)</tspan> com especificidade de ~95%.
  </text>
</svg>