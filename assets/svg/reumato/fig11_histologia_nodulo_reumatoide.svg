<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="bgGrad11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow11" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="460" rx="16" fill="url(#bgGrad11)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow11)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    HISTOPATOLOGIA DO NÓDULO REUMATOIDE (TRÍADE DE ROBBINS)
  </text>

  <!-- Lado Esquerdo: Esquema Concêntrico do Nódulo -->
  <g transform="translate(50, 95)" filter="url(#shadow11)">
    <rect width="380" height="330" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Camada Externa: Infiltrado Linfoplasmocitário -->
    <ellipse cx="190" cy="165" rx="160" ry="135" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="190" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#3730a3" text-anchor="middle">3. MANTO FIBROVASCULAR &amp; LINFOPLASMOCITÁRIO</text>

    <!-- Camada Intermediária: Paliçada de Histiócitos -->
    <ellipse cx="190" cy="165" rx="115" ry="95" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="190" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">2. BORDA EM PALIÇADA</text>
    <text x="190" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">(Macrófagos / Histiócitos Epitelioides)</text>

    <!-- Zona Central: Necrose Fibrinoide -->
    <ellipse cx="190" cy="165" rx="65" ry="48" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="190" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">1. ZONA CENTRAL</text>
    <text x="190" y="176" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">NECROSE</text>
    <text x="190" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">FIBRINOIDE</text>

    <text x="190" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="middle">
      Corte esquemático mostrando a disposição concêntrica
    </text>
  </g>

  <!-- Lado Direito: Detalhamento Textual de Prova -->
  <g transform="translate(460, 95)" filter="url(#shadow11)">
    <rect width="395" height="330" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="395" height="40" rx="12" fill="#2563eb"/>
    <text x="197" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CARACTERÍSTICAS CLÍNICAS E HISTOLÓGICAS
    </text>

    <!-- Card 1: Clínica -->
    <rect x="20" y="55" width="355" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="30" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">Apresentação Clínica (Slide 26):</text>
    <text x="30" y="93" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• Pequenas massas firmes, indolores, redondas a ovais.</text>
    <text x="30" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• Sítios de pressão: cotovelos, antebraço, occipital e sacro.</text>

    <!-- Card 2: Histopatologia Robbins -->
    <rect x="20" y="135" width="355" height="110" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="30" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">Tríade Histológica (Robbins - Slide 26-27):</text>
    <text x="30" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">1. <tspan font-weight="bold" fill="#991b1b">Centro de necrose fibrinoide:</tspan> fibrina e colágeno digerido.</text>
    <text x="30" y="194" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">2. <tspan font-weight="bold" fill="#d97706">Borda proeminente em paliçada:</tspan> macrófagos ativados.</text>
    <text x="30" y="214" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">3. <tspan font-weight="bold" fill="#4338ca">Envoltório fibroso:</tspan> numerosos linfócitos e plasmócitos.</text>
    <text x="30" y="233" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">Lembram morfologicamente granulomas necrosantes.</text>

    <!-- Card 3: Correlação Sorológica -->
    <rect x="20" y="255" width="355" height="55" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="197" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Associação com Gravidade:</text>
    <text x="197" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">Surge em ~20-25% dos casos, quase sempre com FR e Anti-CCP elevados.</text>
  </g>
</svg>