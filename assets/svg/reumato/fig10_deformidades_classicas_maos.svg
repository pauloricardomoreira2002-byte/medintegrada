<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="bgGrad10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow10" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="460" rx="16" fill="url(#bgGrad10)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow10)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    DEFORMIDADES TÍPICAS DAS MÃOS NA ARTRITE REUMATOIDE
  </text>

  <!-- 4 Painéis de Deformidades + Túnel do Carpo -->
  
  <!-- 1. Dedo em Botoeira -->
  <g transform="translate(45, 90)" filter="url(#shadow10)">
    <rect width="255" height="160" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="32" rx="10" fill="#2563eb"/>
    <text x="127" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DEDO EM BOTOEIRA (Boutonnière)</text>
    
    <path d="M 30 75 L 90 75 L 140 110 L 220 90" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="90" cy="75" r="5" fill="#1d4ed8"/>
    <circle cx="140" cy="110" r="5" fill="#dc2626"/>
    <circle cx="220" cy="90" r="5" fill="#1d4ed8"/>

    <text x="127" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Hiperflexão da IFP</text>
    <text x="127" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle">+ Hiperextensão da IFD</text>
  </g>

  <!-- 2. Pescoço de Cisne -->
  <g transform="translate(325, 90)" filter="url(#shadow10)">
    <rect width="255" height="160" rx="10" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="32" rx="10" fill="#9333ea"/>
    <text x="127" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PESCOÇO DE CISNE</text>

    <path d="M 30 100 L 90 100 L 150 65 L 220 95" fill="none" stroke="#9333ea" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="90" cy="100" r="5" fill="#6b21a8"/>
    <circle cx="150" cy="65" r="5" fill="#dc2626"/>
    <circle cx="220" cy="95" r="5" fill="#6b21a8"/>

    <text x="127" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Hiperextensão da IFP</text>
    <text x="127" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle">+ Hiperflexão da IFD</text>
  </g>

  <!-- 3. Desvio Ulnar dos Dedos -->
  <g transform="translate(605, 90)" filter="url(#shadow10)">
    <rect width="255" height="160" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="32" rx="10" fill="#d97706"/>
    <text x="127" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DESVIO ULNAR DOS DEDOS</text>

    <path d="M 60 110 L 110 80 L 190 60" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="110" cy="80" r="5" fill="#b45309"/>
    <path d="M 60 125 L 115 95 L 205 78" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>

    <text x="127" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Subluxação nas MCFs</text>
    <text x="127" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle">Desvio das falanges em direção à ulna</text>
  </g>

  <!-- 4. Polegar em Z & 5. Túnel do Carpo (Linha Inferior) -->
  <g transform="translate(45, 270)" filter="url(#shadow10)">
    <rect width="385" height="165" rx="10" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
    <rect x="0" y="0" width="385" height="32" rx="10" fill="#0891b2"/>
    <text x="192" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">POLEGAR EM Z (Abotoadura do Polegar)</text>
    
    <text x="25" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0e7490">• Alteração Funcional Grave:</text>
    <text x="25" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">Hiperflexão da articulação metacarpofalangeana do polegar</text>
    <text x="25" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">associada à hiperextensão da articulação interfalangeana.</text>
    <text x="25" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0891b2">• Consequência:</text>
    <text x="25" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">Perda do movimento de oponência e pinça fina digital.</text>
  </g>

  <g transform="translate(470, 270)" filter="url(#shadow10)">
    <rect width="390" height="165" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="32" rx="10" fill="#dc2626"/>
    <text x="195" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SÍNDROME DO TÚNEL DO CARPO (Slide 30)</text>

    <text x="25" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Compressão do Nervo Mediano:</text>
    <text x="25" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">Pulsos inflamados e tenossinovite dos tendões flexores</text>
    <text x="25" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">aumentam a pressão dentro do túnel sob o retináculo.</text>
    <text x="25" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">• Manifestações:</text>
    <text x="25" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">Parestesias, dormência nos 3 primeiros dedos e dor noturna.</text>
    <text x="25" y="153" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">*Comum na fase inicial com edema volumoso de punho.</text>
  </g>
</svg>