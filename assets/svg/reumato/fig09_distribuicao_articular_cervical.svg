<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow9" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad9)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="#1e3a8a" filter="url(#shadow9)"/>
  <text x="450" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    DISTRIBUIÇÃO TOPOGRÁFICA DO ACOMETIMENTO ARTICULAR
  </text>

  <!-- Coluna 1: Acometimento Clássico -->
  <g transform="translate(45, 90)" filter="url(#shadow9)">
    <rect width="255" height="360" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="35" rx="10" fill="#dc2626"/>
    <text x="127" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PADRÃO CLÁSSICO DE AR</text>

    <rect x="15" y="50" width="225" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="127" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">POLIARTRITE SIMÉTRICA</text>
    <text x="127" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#7f1d1d" text-anchor="middle">&gt; 4 articulações bilaterais</text>

    <text x="20" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Pequenas Articulações (Início):</text>
    <text x="25" y="148" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#dc2626">• Metacarpofalangeanas (MCF)</text>
    <text x="25" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#dc2626">• Interfalangeanas Proximais (IFP)</text>
    <text x="25" y="182" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#dc2626">• Punhos (quase 100% dos casos)</text>
    <text x="25" y="199" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#dc2626">• Metatarsofalangeanas (MTF - Pés)</text>

    <text x="20" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Grandes Articulações (Evolução):</text>
    <text x="25" y="243" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• Joelhos e Tornozelos</text>
    <text x="25" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• Cotovelos e Ombros</text>

    <rect x="15" y="280" width="225" height="65" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
    <text x="127" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#be123c" text-anchor="middle">Rigidez Matinal &gt; 1 hora</text>
    <text x="127" y="318" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#9f1239" text-anchor="middle">Melhora com a movimentação</text>
    <text x="127" y="333" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#9f1239" text-anchor="middle">por drenagem do edema/citocinas</text>
  </g>

  <!-- Coluna 2: Articulações POUPADAS (Pegadinhas de Prova) -->
  <g transform="translate(325, 90)" filter="url(#shadow9)">
    <rect width="255" height="360" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="35" rx="10" fill="#059669"/>
    <text x="127" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ARTICULAÇÕES POUPADAS</text>

    <rect x="15" y="50" width="225" height="70" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="127" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">POUPA AS IFD!</text>
    <text x="127" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#065f46" text-anchor="middle">Interfalangeanas Distais</text>
    <text x="127" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#047857" text-anchor="middle">(Nódulos de Heberden = ARTROSE)</text>

    <text x="20" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Outras Regiões Poupadas:</text>
    <text x="25" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#047857">• Coluna Dorsal / Torácica (Poupada)</text>
    <text x="25" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#047857">• Coluna Lombar e Sacroilíacas</text>
    <text x="35" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">(Sacroileíte = Espondiloartrites!)</text>

    <!-- Quadro de Diferencial -->
    <rect x="15" y="220" width="225" height="125" rx="6" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
    <text x="127" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">DIFERENCIAL CLÍNICO</text>
    <text x="25" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b"><tspan font-weight="bold">AR:</tspan> Dor inflamatória, pior no</text>
    <text x="25" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">repouso, rigidez &gt; 1h, MCF/IFP.</text>
    <text x="25" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b"><tspan font-weight="bold">Osteoartrite:</tspan> Mecânica, pior com</text>
    <text x="25" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">o uso, rigidez &lt; 30 min, IFD.</text>
    <text x="25" y="330" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#059669" text-anchor="middle">*Pegadinha clássica de prova!</text>
  </g>

  <!-- Coluna 3: Acometimento Cervical (C1-C2) -->
  <g transform="translate(605, 90)" filter="url(#shadow9)">
    <rect width="255" height="360" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="255" height="35" rx="10" fill="#d97706"/>
    <text x="127" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">COLUNA CERVICAL (C1 - C2)</text>

    <rect x="15" y="50" width="225" height="60" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="127" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#b45309" text-anchor="middle">ÚNICO SEGMENTO DA COLUNA</text>
    <text x="127" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Articulação Atlantoaxial (C1-C2)</text>

    <text x="20" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Mecanismo Patológico:</text>
    <text x="25" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">• Sinovite na bursa do dente do áxis</text>
    <text x="25" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">• Frouxidão / ruptura do ligamento</text>
    <text x="30" y="183" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b45309">transverso do atlas</text>

    <rect x="15" y="200" width="225" height="145" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="127" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">RISCO VITAL GRAVE</text>
    <text x="127" y="242" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b" text-anchor="middle">SUBLUXAÇÃO ATLANTOAXIAL</text>
    <text x="25" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">• Compressão medular cervical alta</text>
    <text x="25" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">• Tetraplegia ou parada respiratória</text>
    <text x="25" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#7f1d1d">• CUIDADO ANESTÉSICO:</text>
    <text x="25" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#1e293b">Exige RX cervical pré-intubação</text>
    <text x="25" y="330" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#1e293b">em pacientes com AR de longa data!</text>
  </g>
</svg>