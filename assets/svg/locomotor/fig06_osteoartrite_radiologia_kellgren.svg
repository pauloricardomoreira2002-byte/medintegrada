<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh6" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="480" rx="16" fill="url(#bg6)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh6)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">OS 4 SINAIS RADIOLÓGICOS CARDINAIS, KELLGREN-LAWRENCE E TOPOGRAFIA</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Diferenciação precisa da artrite reumatoide e o padrão de articulações poupadas nas mãos</text>

  <!-- Coluna 1: 4 Sinais Cardinais -->
  <g transform="translate(35, 95)" filter="url(#sh6)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#2563eb"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">OS 4 SINAIS RADIOLÓGICOS</text>
    
    <rect x="12" y="48" width="240" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="22" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">1. Redução ASSIMÉTRICA do Espaço</text>
    <text x="22" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Perda focal de cartilagem no compartimento</text>
    <text x="22" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#dc2626">• Na Artrite Reumatoide a redução é SIMÉTRICA!</text>

    <rect x="12" y="112" width="240" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="22" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">2. Esclerose Óssea Subcondral</text>
    <text x="22" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Espessamento ósseo e densidade aumentada</text>
    <text x="22" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Área branca radiopaca sob a cartilagem gasta.</text>

    <rect x="12" y="176" width="240" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="22" y="194" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">3. Osteófitos Marginais</text>
    <text x="22" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#15803d">• O achado MAIS ESPECÍFICO da osteoartrite!</text>
    <text x="22" y="224" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Projeções ósseas de reforço nas bordas.</text>

    <rect x="12" y="240" width="240" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="22" y="258" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">4. Geodos / Cistos Subcondrais</text>
    <text x="22" y="274" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Áreas radiotransparentes redondas no osso</text>
    <text x="22" y="288" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Transudação de líquido sinovial sob pressão.</text>

    <rect x="12" y="304" width="240" height="46" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="22" y="322" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">O que a OA NÃO APRESENTA:</text>
    <text x="22" y="338" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7f1d1d">NÃO há osteopenia periarticular nem erosões!</text>
  </g>

  <!-- Coluna 2: Kellgren-Lawrence -->
  <g transform="translate(318, 95)" filter="url(#sh6)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#d97706"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">KELLGREN-LAWRENCE (0 A IV)</text>

    <rect x="12" y="48" width="240" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="22" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Grau 0: Normal</text>
    <text x="22" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Sem alterações radiológicas de artrose.</text>

    <rect x="12" y="104" width="240" height="54" rx="6" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
    <text x="22" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Grau I: Duvidoso</text>
    <text x="22" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Osteófito incipiente/duvidoso.</text>
    <text x="22" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#15803d">• Espaço articular totalmente preservado.</text>

    <rect x="12" y="164" width="240" height="58" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="22" y="182" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Grau II: Mínimo / Definido</text>
    <text x="22" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• <tspan font-weight="bold">Osteófito definido claro</tspan>.</text>
    <text x="22" y="212" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Espaço articular possivelmente reduzido.</text>

    <rect x="12" y="228" width="240" height="58" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="22" y="246" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Grau III: Moderado</text>
    <text x="22" y="262" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Múltiplos osteófitos moderados.</text>
    <text x="22" y="276" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#b91c1c">• Redução NÍTIDA do espaço articular + esclerose.</text>

    <rect x="12" y="292" width="240" height="58" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="22" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Grau IV: Grave</text>
    <text x="22" y="326" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Grandes osteófitos exuberantes.</text>
    <text x="22" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Espaço muito reduzido / contato osso-osso / deformidade.</text>
  </g>

  <!-- Coluna 3: Topografia e "O que a Doença Poupa" -->
  <g transform="translate(600, 95)" filter="url(#sh6)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#059669"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TOPOGRAFIA: O QUE A OA POUPA?</text>

    <rect x="12" y="48" width="240" height="90" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Mãos: Sítios Cardinais da OA</text>
    <text x="20" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1f2937">• <tspan font-weight="bold">IFD:</tspan> Nódulos de <tspan font-weight="bold" fill="#047857">HEBERDEN</tspan></text>
    <text x="20" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1f2937">• <tspan font-weight="bold">IFP:</tspan> Nódulos de <tspan font-weight="bold" fill="#047857">BOUCHARD</tspan></text>
    <text x="20" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1f2937">• <tspan font-weight="bold">1ª CMC:</tspan> Rizartrose (ombro quadrado)</text>
    <text x="20" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#065f46">Aumento ÓSSEO DURO (não de partes moles!)</text>

    <rect x="12" y="146" width="240" height="90" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="20" y="166" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">⚠️ O QUE A OA POUPA NAS MÃOS:</text>
    <text x="20" y="184" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">• <tspan font-weight="bold">POUPA AS METACARPOFALANGIANAS (MCF)</tspan></text>
    <text x="20" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">• <tspan font-weight="bold">POUPA OS PUNHOS!</tspan></text>
    <text x="20" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">Acometimento de MCF e punho define</text>
    <text x="20" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155"><tspan font-weight="bold">Artrite Reumatoide</tspan> (que por sua vez poupa IFD)!</text>

    <rect x="12" y="244" width="240" height="106" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="264" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">Outros Sítios Típicos da OA:</text>
    <text x="20" y="282" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Joelho:</tspan> Compartimento medial (varo).</text>
    <text x="20" y="298" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Quadril:</tspan> Dor inguinal com irradiação</text>
    <text x="25" y="312" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">ao joelho; perde rotação interna primeiro.</text>
    <text x="20" y="330" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Coluna:</tspan> Claudicação neurogênica.</text>
    <text x="20" y="344" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#15803d">• <tspan font-weight="bold">Pé:</tspan> 1ª MTF (hálux rígido).</text>
  </g>
</svg>