<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh8" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="460" rx="16" fill="url(#bg8)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh8)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">DO RICE AO NOVO PROTOCOLO: PEACE &amp; LOVE (2019/2026)</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Por que a supressão inflamatória cega (AINE/Gelo) foi superada pela carga ótima e propriocepção</text>

  <!-- Lado Esquerdo: PEACE (Primeiros Dias) -->
  <g transform="translate(35, 95)" filter="url(#sh8)">
    <rect width="400" height="340" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect width="400" height="35" rx="10" fill="#0284c7"/>
    <text x="200" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PEACE — FASE AGUDA IMEDIATA (DIAS 1 A 3)</text>

    <text x="20" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">P</text>
    <text x="40" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Protect (Proteger):</text>
    <text x="40" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Descarga de peso apenas nos primeiros dias; evitar dor intensa.</text>

    <text x="20" y="104" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">E</text>
    <text x="40" y="104" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Elevate (Elevar):</text>
    <text x="40" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Membro acima do nível cardíaco para facilitar a drenagem intersticial.</text>

    <text x="20" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">A</text>
    <text x="40" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Avoid Anti-inflammatories &amp; Ice Excess:</text>
    <text x="40" y="162" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#991b1b">• <tspan font-weight="bold">EVITAR AINEs e gelo contínuo!</tspan> A resposta inflamatória</text>
    <text x="40" y="176" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#991b1b">  inicial é pré-requisito biológico para a angiogênese e colagênese.</text>

    <text x="20" y="204" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">C</text>
    <text x="40" y="204" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Compress (Comprimir):</text>
    <text x="40" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Enfaixamento ou meia elástica para conter hemartrose e edema.</text>

    <text x="20" y="246" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">E</text>
    <text x="40" y="246" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Educate (Educar):</text>
    <text x="40" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Orientar sobre autocuidado ativo e evitar passividade ou imobilismo prolongado.</text>

    <rect x="15" y="280" width="370" height="48" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="195" y="298" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Mudança Crítica:</text>
    <text x="195" y="314" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">AINEs retardam a reparação tecidual ligamentar e muscular!</text>
  </g>

  <!-- Lado Direito: & LOVE (Dias Subsequentes) -->
  <g transform="translate(455, 95)" filter="url(#sh8)">
    <rect width="410" height="340" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="410" height="35" rx="10" fill="#059669"/>
    <text x="205" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">&amp; LOVE — REABILITAÇÃO ATIVA (A PARTIR DO DIA 3-4)</text>

    <text x="20" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#059669">L</text>
    <text x="40" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Load (Carga Precoce):</text>
    <text x="40" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Carga mecânica axial progressiva estimula mecanotransdução celular e realinha fibras de colágeno.</text>

    <text x="20" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#059669">O</text>
    <text x="40" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Optimism (Otimismo):</text>
    <text x="40" y="126" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Fatores psicológicos (catastrofização) influenciam a cronificação e percepção central da dor.</text>

    <text x="20" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#059669">V</text>
    <text x="40" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Vascularisation (Vascularização):</text>
    <text x="40" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Exercício aeróbio precoce indolor (ergômetro/caminhada) para aumentar perfusão tecidual e remodelamento.</text>

    <text x="20" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#059669">E</text>
    <text x="40" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Exercise &amp; Proprioception (Exercício):</text>
    <text x="40" y="224" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0f766e">• <tspan font-weight="bold">TREINO PROPRIOCEPTIVO É OBRIGATÓRIO!</tspan></text>
    <text x="40" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">A entorse rompe mecanorreceptores articulares;</text>
    <text x="40" y="252" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803d">exercícios de equilíbrio previnem a <tspan font-weight="bold">INSTABILIDADE CRÔNICA</tspan>.</text>

    <rect x="15" y="275" width="380" height="52" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="205" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46" text-anchor="middle">Por que a Imobilização Gessada Rígida é Erro?</text>
    <text x="205" y="312" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#047857" text-anchor="middle">Gera atrofia muscular rápida, rigidez capsular e atrasa o retorno funcional!</text>
  </g>
</svg>