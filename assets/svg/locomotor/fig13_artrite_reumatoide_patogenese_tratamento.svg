<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh13" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="480" rx="16" fill="url(#bg13)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh13)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">ARTRITE REUMATOIDE: CITRULINAÇÃO, JANELA DE OPORTUNIDADE E ACR 2021</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Do tabagismo e periodontite ao Anti-CCP, critérios ACR/EULAR 2010 e o papel âncora do Metotrexato</text>

  <!-- Coluna 1: Patogênese e Citrulinação -->
  <g transform="translate(35, 95)" filter="url(#sh13)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#b91c1c"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">A CASCATA DE CITRULINAÇÃO</text>

    <text x="15" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">1. Genética + Ambiente Multiplicativo:</text>
    <text x="25" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">HLA-DRB1</tspan> (Epítopo Compartilhado na cadeia β)</text>
    <text x="25" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Tabagismo:</tspan> Principal fator de risco ambiental!</text>
    <text x="25" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Periodontite por <tspan font-style="italic">Porphyromonas gingivalis</tspan>.</text>

    <text x="15" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">2. Enzima PAD (Peptidil-Arginina-Deiminase):</text>
    <text x="25" y="148" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Converte resíduos de <tspan font-weight="bold">Arginina</tspan> em <tspan font-weight="bold">Citrulina</tspan>.</text>
    <text x="25" y="164" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Proteínas citrulinadas tornam-se <tspan font-weight="bold">Neoantígenos</tspan>.</text>

    <text x="15" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">3. Quebra de Tolerância &amp; Anti-CCP:</text>
    <text x="25" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Produção de <tspan font-weight="bold" fill="#b91c1c">Anti-CCP (ACPA)</tspan> e Fator Reumatoide</text>
    <text x="25" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#059669">anos antes dos primeiros sintomas articulares!</text>

    <rect x="12" y="240" width="240" height="104" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="20" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">Janela de Oportunidade (3-6m):</text>
    <text x="20" y="278" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">Instituir DMARD nos primeiros 3 a 6 meses</text>
    <text x="20" y="292" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">previne erosões irreversíveis e altera o curso</text>
    <text x="20" y="306" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">natural da doença com altas taxas de remissão!</text>
    <text x="20" y="324" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b91c1c">Atraso de encaminhamento = falha assistencial grave.</text>
  </g>

  <!-- Coluna 2: Clínica e Radiologia -->
  <g transform="translate(318, 95)" filter="url(#sh13)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#d97706"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CLÍNICA &amp; DEFORMIDADES</text>

    <text x="15" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">• Padrão Clínico Clássico:</text>
    <text x="25" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Poliartrite simétrica e aditiva de pequenas articulações;</text>
    <text x="25" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155"><tspan font-weight="bold">Rigidez matinal &gt; 1 hora</tspan> que melhora ao mover.</text>
    <text x="25" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c"><tspan font-weight="bold">POUPA Interfalangianas Distais (IFD)!</tspan></text>

    <text x="15" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">• Deformidades Tardias Típicas:</text>
    <text x="25" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">- Desvio ulnar dos dedos ("em rajada de vento")</text>
    <text x="25" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">- <tspan font-weight="bold">Pescoço de cisne:</tspan> Hiperextensão IFP + flexão IFD</text>
    <text x="25" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">- <tspan font-weight="bold">Botoeira (Boutonnière):</tspan> Flexão IFP + hiperextensão IFD</text>
    <text x="25" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">- Polegar em Z e Mão em dorso de camelo</text>

    <rect x="12" y="215" width="240" height="130" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="20" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">⚠️ SUBLUXAÇÃO ATLANTOAXIAL:</text>
    <text x="20" y="253" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Acometimento C1-C2 com erosão do ligamento</text>
    <text x="25" y="267" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">transverso do atlas pela sinovite odontoide.</text>
    <text x="20" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#b91c1c">• Risco de compressão bulbo-medular e óbito!</text>
    <text x="20" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#b91c1c">• <tspan font-weight="bold">Exame Obrigatório:</tspan> RX cervical dinâmico em</text>
    <text x="25" y="317" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b91c1c">flexão/extensão antes de qualquer intubação orotraqueal!</text>
    <text x="20" y="335" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569">• Extra-articular: Aterosclerose (morte #1), DPI e Felty.</text>
  </g>

  <!-- Coluna 3: Tratamento ACR 2021 -->
  <g transform="translate(600, 95)" filter="url(#sh13)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#059669"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DIRETRIZ ACR 2021: TERAPIA</text>

    <rect x="12" y="48" width="240" height="95" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">TREAT-TO-TARGET &amp; METOTREXATO:</text>
    <text x="20" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Alvo: Remissão (DAS28 &lt; 2.6) ou baixa atividade.</text>
    <text x="20" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#047857">• <tspan font-weight="bold">METOTREXATO EM MONOTERAPIA:</tspan></text>
    <text x="25" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#065f46">Forte recomendação inicial na atividade moderada a alta,</text>
    <text x="25" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#047857">preferido a biológicos e inibidores de JAK!</text>

    <rect x="12" y="152" width="240" height="85" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="20" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">O Pulo do Gato do MTX Subcutâneo:</text>
    <text x="20" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• A absorção oral satura acima de 15 a 20 mg/sem.</text>
    <text x="20" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#b45309">• Antes de trocar de droga ou associar biológico:</text>
    <text x="25" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#15803d"><tspan font-weight="bold">MUDAR PARA VIA SUBCUTÂNEA!</tspan> Aumenta eficácia.</text>

    <rect x="12" y="246" width="240" height="100" rx="6" fill="#1e293b"/>
    <text x="132" y="266" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">Falha Terapêutica ao MTX:</text>
    <text x="20" y="286" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#f1f5f9">• <tspan font-weight="bold" fill="#4ade80">Terapia Tripla:</tspan> MTX + Sulfassalazina + HCQ</text>
    <text x="25" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#cbd5e1">(tão eficaz quanto biológico a uma fração do custo!).</text>
    <text x="20" y="318" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#f1f5f9">• <tspan font-weight="bold" fill="#38bdf8">bDMARD:</tspan> anti-TNF, anti-IL-6 (Tocilizumabe), CTLA-4.</text>
    <text x="20" y="334" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#f1f5f9">• <tspan font-weight="bold" fill="#f87171">Minimizar corticoide:</tspan> Menor dose/tempo possível!</text>
  </g>
</svg>