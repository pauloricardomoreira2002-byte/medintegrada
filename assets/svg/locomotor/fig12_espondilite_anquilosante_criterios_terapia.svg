<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh12" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="480" rx="16" fill="url(#bg12)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh12)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">ESPONDILOARTRITE AXIAL (axSpA) E DIRETRIZ ASAS-EULAR 2022</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">axSpA Radiográfica vs Não Radiográfica, Critérios ASAS de Dor Lombar e Tratamento Escalonado</text>

  <!-- Coluna 1: O Espectro axSpA -->
  <g transform="translate(35, 95)" filter="url(#sh12)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#2563eb"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">NOMENCLATURA &amp; DIAGNÓSTICO</text>

    <rect x="12" y="48" width="240" height="90" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">axSpA NÃO Radiográfica (nr-axSpA):</text>
    <text x="20" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Raio-X convencional ainda NORMAL.</text>
    <text x="20" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803d">• <tspan font-weight="bold">Ressonância Magnética (RNM):</tspan> Detecta</text>
    <text x="25" y="116" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857"><tspan font-weight="bold">EDEMA ÓSSEO SUBCONDRAL (Osteíte)</tspan></text>
    <text x="25" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">em sequências STIR ou T2 Fat-Sat.</text>

    <rect x="12" y="146" width="240" height="90" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="166" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">axSpA Radiográfica (EA Clássica):</text>
    <text x="20" y="184" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Sacroileíte definitiva ao RX (Graus II-IV).</text>
    <text x="20" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Lesões de Romanus (cantos brilhantes).</text>
    <text x="20" y="216" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e40af">• Quadratura vertebral e sindesmófitos.</text>
    <text x="20" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#dc2626">Leva de 7 a 10 anos para aparecer no RX!</text>

    <rect x="12" y="244" width="240" height="100" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="20" y="264" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">Epidemiologia &amp; Genética:</text>
    <text x="20" y="282" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Homens jovens (15 a 45 anos).</text>
    <text x="20" y="298" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#b91c1c">• <tspan font-weight="bold">HLA-B27 positivo em 85-95%!</tspan></text>
    <text x="20" y="314" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Nota: apenas 5% dos B27+ adoecem (necessário,</text>
    <text x="20" y="326" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">mas não suficiente; fatores microbianos/IL-23).</text>
  </g>

  <!-- Coluna 2: Critérios ASAS de Dor Lombar Inflamatória -->
  <g transform="translate(318, 95)" filter="url(#sh12)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#d97706"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DOR LOMBAR INFLAMATÓRIA</text>

    <text x="15" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">Os 5 Critérios ASAS (Rastreio):</text>
    <text x="20" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1f2937">1. Início antes dos 45 anos</text>
    <text x="20" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1f2937">2. Instalação insidiosa (não abrupta)</text>
    <text x="20" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#047857">3. <tspan font-weight="bold">MELHORA com o exercício</tspan></text>
    <text x="20" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#b91c1c">4. <tspan font-weight="bold">PIORA com o repouso</tspan></text>
    <text x="20" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1f2937">5. Dor noturna (acorda 2ª metade da noite)</text>

    <rect x="12" y="180" width="240" height="75" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="20" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">Sinais Semiológicos de Redução:</text>
    <text x="20" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Schober Modificado:</tspan> expansão &lt; 5 cm.</text>
    <text x="20" y="234" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Expansibilidade torácica:</tspan> &lt; 5 cm no 4º EIC.</text>
    <text x="20" y="248" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569">• Postura avançada do "esquiador".</text>

    <rect x="12" y="265" width="240" height="80" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="20" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">Manifestações Extra-articulares:</text>
    <text x="20" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• <tspan font-weight="bold" fill="#991b1b">Uveíte Anterior Aguda (30-40%):</tspan> unilateral,</text>
    <text x="25" y="317" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7f1d1d">dor e fotofobia súbitas (emergência oftálmica!).</text>
    <text x="20" y="333" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• DII (Crohn/RCU 5-10%) • Psoríase.</text>
  </g>

  <!-- Coluna 3: Tratamento ASAS-EULAR 2022 -->
  <g transform="translate(600, 95)" filter="url(#sh12)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#059669"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ASAS-EULAR 2022: CONDUTA</text>

    <rect x="12" y="48" width="240" height="60" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">1ª Linha: AINE Dose Plena + Físio</text>
    <text x="20" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Exercício supervisionado regular.</text>
    <text x="20" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">Excelente resposta álgica em 24-48h.</text>

    <rect x="12" y="116" width="240" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="20" y="136" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">⚠️ O QUE NÃO FUNCIONA NO AXIAL:</text>
    <text x="20" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#7f1d1d"><tspan font-weight="bold">csDMARDs (Metotrexato, Sulfassalazina)</tspan></text>
    <text x="20" y="166" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">NÃO têm eficácia na coluna/sacroilíaca!</text>

    <rect x="12" y="184" width="240" height="160" rx="6" fill="#1e293b"/>
    <text x="132" y="204" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">2ª Linha: bDMARDs / tsDMARDs</text>
    <text x="20" y="224" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#f1f5f9">• <tspan font-weight="bold">Indicação:</tspan> ASDAS ≥ 2.1 + falha de ≥ 2 AINEs</text>
    <text x="20" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">+ PCR alta ou RNM com sacroileíte ativa.</text>
    <text x="20" y="258" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#4ade80">• Seleção Personalizada:</text>
    <text x="20" y="274" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f1f5f9">- Se Uveíte ou DII: preferir <tspan font-weight="bold">Ac Monoclonais</tspan></text>
    <text x="25" y="288" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8">  anti-TNF (Infliximabe, Adalimumabe).</text>
    <text x="20" y="304" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f1f5f9">- Se Psoríase: preferir <tspan font-weight="bold">anti-IL-17</tspan> (Secuquinumabe).</text>
    <text x="20" y="320" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f1f5f9">- Inibidores de JAK (Upadacitinibe/Tofacitinibe).</text>
    <text x="20" y="336" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">• Etanercepte NÃO trata DII nem previne uveíte!</text>
  </g>
</svg>