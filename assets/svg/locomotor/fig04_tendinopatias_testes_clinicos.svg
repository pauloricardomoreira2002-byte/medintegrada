<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh4" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="480" rx="16" fill="url(#bg4)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh4)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">MANOBRAS SEMIOLÓGICAS ESSENCIAIS DAS TENDINOPATIAS</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Manguito rotador, bíceps braquial, epicondilites, De Quervain e tendão de Aquiles</text>

  <!-- Card 1: Ombro - Manguito -->
  <g transform="translate(35, 95)" filter="url(#sh4)">
    <rect width="265" height="170" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="265" height="30" rx="10" fill="#2563eb"/>
    <text x="132" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MANGUITO ROTADOR (OMBRO)</text>
    <text x="12" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">• Jobe (Lata Vazia):</text>
    <text x="20" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Supraespinal (abdução 90°, flexão 30°, polegares para baixo contra resistência).</text>
    <text x="12" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">• Patte:</text>
    <text x="20" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Infraespinal e redondo menor (rotação externa).</text>
    <text x="12" y="124" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">• Gerber (Lift-Off):</text>
    <text x="20" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Subescapular (afastar mão das costas).</text>
    <text x="12" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#dc2626"><tspan font-weight="bold">Drop Arm (Braço caindo):</tspan> Ruptura total.</text>
  </g>

  <!-- Card 2: Bíceps e Cotovelo -->
  <g transform="translate(318, 95)" filter="url(#sh4)">
    <rect width="265" height="170" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="265" height="30" rx="10" fill="#d97706"/>
    <text x="132" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">BÍCEPS &amp; EPICONDILITES</text>
    <text x="12" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">• Speed &amp; Yergason (Bíceps):</text>
    <text x="20" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Speed: flexão do braço com cotovelo reto.</text>
    <text x="20" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Yergason: supinação resistida com cotovelo 90°.</text>
    <text x="12" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">• Epicondilite Lateral (Tenista):</text>
    <text x="20" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Extensor radial curto do carpo; dor à extensão do punho contra resistência.</text>
    <text x="12" y="136" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">• Epicondilite Medial (Golfista):</text>
    <text x="20" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Flexores/pronadores; atenção ao nervo ulnar.</text>
  </g>

  <!-- Card 3: Punho e Mão -->
  <g transform="translate(600, 95)" filter="url(#sh4)">
    <rect width="265" height="170" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="265" height="30" rx="10" fill="#059669"/>
    <text x="132" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DE QUERVAIN &amp; DEDO GATILHO</text>
    <text x="12" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Teste de Finkelstein (De Quervain):</text>
    <text x="20" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Polegar fletido na palma + desvio ulnar forçado.</text>
    <text x="20" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803d">Reproduz dor intensa no 1º compartimento extensor (abdutor longo e extensor curto).</text>
    <text x="20" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">Clássico: puerpério (amamentação) e smartphones.</text>
    <text x="12" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Dedo em Gatilho:</text>
    <text x="20" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Estenose da polia A1; travamento em flexão.</text>
    <text x="20" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">Associação forte com Diabetes e Hipotireoidismo.</text>
  </g>

  <!-- Card 4: Membros Inferiores (Aquiles, Joelho, Tibial Posterior) -->
  <g transform="translate(35, 280)" filter="url(#sh4)">
    <rect width="830" height="180" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect width="830" height="30" rx="10" fill="#334155"/>
    <text x="415" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MEMBROS INFERIORES: TENDÃO DE AQUILES, PATELAR E TIBIAL POSTERIOR</text>
    
    <!-- Subcoluna 1 -->
    <text x="25" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Tendinopatia do Aquiles:</text>
    <text x="35" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Do Corpo (2 a 6 cm):</tspan> Zona de hipovascularização relativa crítica.</text>
    <text x="35" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Insercional:</tspan> Junto ao calcâneo; pode associar bursite retrocalcânea.</text>
    <text x="35" y="104" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">• <tspan font-weight="bold">Teste de Thompson:</tspan> Compressão da panturrilha em decúbito ventral.</text>
    <text x="45" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#b91c1c">Ausência de flexão plantar = RUPTURA COMPLETA do tendão!</text>

    <!-- Subcoluna 2 -->
    <text x="430" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Patelar &amp; Tibial Posterior:</text>
    <text x="440" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Tendinopatia Patelar ("Joelho do Saltador"):</tspan> Dor no polo inferior da patela;</text>
    <text x="450" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">típica em basquete e vôlei (desaceleração brusca).</text>
    <text x="440" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Tendinopatia do Tibial Posterior:</tspan> Dor retromaleolar medial;</text>
    <text x="450" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">Insuficiência gera o PÉ PLANO ADQUIRIDO DO ADULTO!</text>
    <text x="450" y="136" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">Teste: incapacidade de ficar na ponta de um pé só (single heel raise).</text>

    <rect x="25" y="146" width="780" height="24" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="415" y="162" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">
      ⚠️ ALERTA: Fluoroquinolonas (Cipro/Levo) e Corticoides multiplicam risco de ruptura bilateral do Aquiles em idosos!
    </text>
  </g>
</svg>