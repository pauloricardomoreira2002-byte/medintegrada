<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh5" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="460" rx="16" fill="url(#bg5)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh5)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">OSTEOARTRITE: A FALÊNCIA DA ARTICULAÇÃO COMO ÓRGÃO</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Condrócito hiperativo catabólico, MMP-13, inflamação de baixo grau e de onde REALMENTE vem a dor</text>

  <!-- Bloco 1: Cartilagem Avascular e Aneural -->
  <g transform="translate(35, 95)" filter="url(#sh5)">
    <rect width="265" height="340" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#2563eb"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">A CARTILAGEM ARTICULAR</text>
    <text x="15" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">• Propriedades Fisiológicas:</text>
    <text x="25" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">- <tspan font-weight="bold">AVASCULAR:</tspan> Nutrição só por difusão.</text>
    <text x="25" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">- <tspan font-weight="bold">ALINFÁTICA:</tspan> Sem drenagem própria.</text>
    <text x="25" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#b91c1c">- <tspan font-weight="bold">ANEURAL: NÃO POSSUI NERVOS!</tspan></text>
    <text x="15" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">• Composição Macromolecular:</text>
    <text x="25" y="153" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">- Colágeno Tipo II (tração e rede)</text>
    <text x="25" y="169" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">- Agrecano / Proteoglicanos (água/carga)</text>
    <text x="25" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">- Condrócitos (&lt; 5% do volume total)</text>
    <rect x="12" y="210" width="240" height="115" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="20" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">⚠️ A Cartilagem NÃO Dói!</text>
    <text x="20" y="248" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Como não possui nociceptores, sua</text>
    <text x="20" y="264" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">erosão é silenciosa. A dor vem do</text>
    <text x="20" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e40af"><tspan font-weight="bold">osso subcondral</tspan>, da <tspan font-weight="bold">sinóvia</tspan>, da</text>
    <text x="20" y="296" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">cápsula e de espasmos musculares.</text>
    <text x="20" y="312" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">→ Discrepância clínico-radiológica clássica!</text>
  </g>

  <!-- Bloco 2: Cascata Molecular Catabólica -->
  <g transform="translate(318, 95)" filter="url(#sh5)">
    <rect width="265" height="340" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#d97706"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CASCATA PATOGÊNICA ATIVA</text>
    <text x="15" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">• Estresse Biomecânico / DAMPs:</text>
    <text x="25" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Microtrauma + Adipocinas (obesidade)</text>
    <text x="25" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">estimulam mecanorreceptores celulares.</text>
    <text x="15" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">• Mudança de Fenótipo do Condrócito:</text>
    <text x="25" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#dc2626"><tspan font-weight="bold">MMP-13:</tspan> Degradação colágeno II (irreversível)</text>
    <text x="25" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d97706"><tspan font-weight="bold">ADAMTS-4 e 5:</tspan> Clivagem do agrecano</text>
    <text x="25" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">IL-1β, TNF-α, IL-6 e Óxido Nítrico (NO)</text>
    <text x="15" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">• Sinovite de Baixo Grau:</text>
    <text x="25" y="216" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Fragmentos de cartilagem ativam TLRs e o</text>
    <text x="25" y="232" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">inflamassoma sinovial → dor e derrame.</text>
    <rect x="12" y="255" width="240" height="70" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="20" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">Reação do Osso Subcondral:</text>
    <text x="20" y="293" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Esclerose óssea por hiperremodelamento.</text>
    <text x="20" y="309" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Lesões de medula óssea (BMLs) na RNM.</text>
  </g>

  <!-- Bloco 3: Adaptação e Formação de Osteófitos -->
  <g transform="translate(600, 95)" filter="url(#sh5)">
    <rect width="265" height="340" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#059669"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TENTATIVA DE ESTABILIZAÇÃO</text>
    <text x="15" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Formação de Osteófitos:</text>
    <text x="25" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Neoformação óssea nas bordas articulares</text>
    <text x="25" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803d">→ Tentativa de aumentar a área de carga</text>
    <text x="25" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803d">   e estabilizar o movimento instável.</text>
    <text x="15" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Geodos / Cistos Subcondrais:</text>
    <text x="25" y="153" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Microfraturas trabeculares + entrada de</text>
    <text x="25" y="169" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">líquido sinovial sob pressão no osso.</text>
    <text x="15" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Fraqueza Muscular Periarticular:</text>
    <text x="25" y="213" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Inibição artrogênica do quadríceps agrava</text>
    <text x="25" y="229" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">o impacto mecânico sobre a articulação.</text>
    <rect x="12" y="255" width="240" height="70" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">Conceito Central Moderno:</text>
    <text x="20" y="293" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">A OA é um processo dinâmico e bioativo</text>
    <text x="20" y="309" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#065f46">de reparo e remodelamento, não mero "desgaste"!</text>
  </g>
</svg>