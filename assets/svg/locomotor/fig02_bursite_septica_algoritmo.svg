<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff1f2"/><stop offset="100%" stop-color="#fee2e2"/></linearGradient>
    <filter id="sh2" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#991b1b" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="900" height="460" rx="16" fill="url(#bg2)" stroke="#f87171" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#991b1b" filter="url(#sh2)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">🚨 ALERTA VERMELHO: BURSITE SÉPTICA (SITUAÇÃO DE EMERGÊNCIA)</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fecaca" text-anchor="middle">Reconhecimento imediato, diagnóstico diferencial com gota e erro iatrogênico fatal do corticoide</text>

  <!-- Coluna 1: Suspeita Clínica -->
  <g transform="translate(35, 95)" filter="url(#sh2)">
    <rect width="265" height="340" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="265" height="38" rx="12" fill="#b91c1c"/>
    <text x="132" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. QUANDO SUSPEITAR</text>
    <text x="15" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">• Sítios Típicos Superficiais:</text>
    <text x="25" y="83" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">- Olecraniana (cotovelo): > 70% dos casos</text>
    <text x="25" y="99" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">- Pré-patelar (joelho da empregada)</text>
    <text x="15" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">• Sinais Cardinais Locais:</text>
    <text x="25" y="143" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">- Calor e rubor intensos peri-bursa</text>
    <text x="25" y="159" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">- Dor desproporcional à tumefação</text>
    <text x="25" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">- Porta de entrada (escoriação, picada)</text>
    <text x="15" y="205" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">• Etiologia Microbiológica:</text>
    <text x="25" y="223" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#b91c1c"><tspan font-weight="bold">Staphylococcus aureus (80%)</tspan></text>
    <text x="25" y="239" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Streptococcus spp. (15%)</text>
    <rect x="12" y="260" width="240" height="65" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="20" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">⚠️ Coexistência Crítica:</text>
    <text x="20" y="296" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">A gota pode coexistir com sepse na</text>
    <text x="20" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">bursa olecraniana! Pesquise cristais e cultura.</text>
  </g>

  <!-- Coluna 2: Conduta Diagnóstica -->
  <g transform="translate(318, 95)" filter="url(#sh2)">
    <rect width="265" height="340" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="265" height="38" rx="12" fill="#d97706"/>
    <text x="132" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. CONDUTA MANDATÓRIA</text>
    <text x="15" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#b45309">💉 PUNCIONAR SEMPRE:</text>
    <text x="25" y="83" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">Fazer punção aspirativa ANTES de</text>
    <text x="25" y="99" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">iniciar qualquer antimicrobiano.</text>
    <text x="15" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#b45309">🔬 Análise do Líquido:</text>
    <text x="25" y="143" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">• Leucócitos > 2.000 a 50.000/mm³</text>
    <text x="25" y="159" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">• Predomínio de Neutrófilos (> 75%)</text>
    <text x="25" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">• Bacterioscopia por Gram</text>
    <text x="25" y="191" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">• Cultura com antibiograma</text>
    <text x="25" y="207" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1f2937">• Luz polarizada (excluir urato)</text>
    <rect x="12" y="235" width="240" height="90" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="20" y="255" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">Tratamento Antimicrobiano:</text>
    <text x="20" y="273" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Oxacilina / Cefazolina (IV) ou</text>
    <text x="20" y="289" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">  Cefalexina / Clindamicina (VO leves).</text>
    <text x="20" y="307" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">• Se risco de MRSA: Vancomicina.</text>
  </g>

  <!-- Coluna 3: O Erro Iatrogênico Fatal -->
  <g transform="translate(600, 95)" filter="url(#sh2)">
    <rect width="265" height="340" rx="12" fill="#fff5f5" stroke="#dc2626" stroke-width="2"/>
    <rect width="265" height="38" rx="12" fill="#991b1b"/>
    <text x="132" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3. CONTRAINDICAÇÃO ABSOLUTA</text>
    <circle cx="132" cy="90" r="32" fill="#ef4444"/>
    <text x="132" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">✕</text>
    <text x="132" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">NUNCA INFILTRAR CORTICOIDE!</text>
    <text x="15" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">• Injeção de glicocorticoide na sepse:</text>
    <text x="20" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#991b1b">- Suprime fagocitose de macrófagos</text>
    <text x="20" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#991b1b">- Disseminação bacteriana para fáscia</text>
    <text x="20" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#991b1b">- Risco de fasceíte necrosante e sepse</text>
    <text x="20" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#991b1b">- Fistulização crônica da bursa</text>
    <rect x="12" y="260" width="240" height="65" rx="6" fill="#ffffff" stroke="#991b1b" stroke-width="1"/>
    <text x="20" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">Falha do Tratamento Clínico:</text>
    <text x="20" y="298" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Drenagem cirúrgica ou Bursectomia</text>
    <text x="20" y="314" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">  indicada se sem melhora em 48-72h.</text>
  </g>
</svg>