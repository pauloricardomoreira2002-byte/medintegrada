<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="emeraldCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad1)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título Principal -->
  <rect x="30" y="20" width="840" height="58" rx="10" fill="#1e3a8a" filter="url(#shadow1)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">
    BURSOPATIAS: ANATOMIA FUNCIONAL E PRINCIPAIS SÍTIOS CLÍNICOS
  </text>
  <text x="450" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    Redução de atrito intertecidual, classificação e diferenciação entre bursas superficiais e profundas
  </text>

  <!-- Painel Esquerdo: Conceito e Tipos -->
  <g transform="translate(35, 95)" filter="url(#shadow1)">
    <rect width="265" height="360" rx="12" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="265" height="40" rx="12" fill="#1d4ed8"/>
    <text x="132" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CONCEITO &amp; ANATOMIA</text>
    
    <rect x="15" y="52" width="235" height="85" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="25" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">O que é a Bursa?</text>
    <text x="25" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">• Bolsa de tecido conjuntivo com</text>
    <text x="25" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">  fina membrana e líquido sinovial.</text>
    <text x="25" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">• Reduz atrito osso-tendão/pele.</text>

    <rect x="15" y="147" width="235" height="95" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="25" y="167" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Classificação das Bursas:</text>
    <text x="25" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#15803d"><tspan font-weight="bold">1. Constantes:</tspan> Embrionárias</text>
    <text x="35" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">(ex.: subacromial, olecraniana).</text>
    <text x="25" y="217" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d97706"><tspan font-weight="bold">2. Adventícias:</tspan> Adquiridas por atrito</text>
    <text x="35" y="232" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">(ex.: sobre hálux valgo / joanete).</text>

    <rect x="15" y="252" width="235" height="90" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="25" y="272" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">⚠️ Comunicação Articular:</text>
    <text x="25" y="290" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Suprapatelar</tspan> comunica com o joelho.</text>
    <text x="25" y="306" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Iliopsoas</tspan> comunica com o quadril (15%).</text>
    <text x="25" y="324" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">Artrite pode se expressar como bursite!</text>
  </g>

  <!-- Painel Central: Topografia das Bursites Mais Comuns -->
  <g transform="translate(318, 95)" filter="url(#shadow1)">
    <rect width="290" height="360" rx="12" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="290" height="40" rx="12" fill="#d97706"/>
    <text x="145" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SÍTIOS TOPOGRÁFICOS CLÁSSICOS</text>

    <rect x="12" y="50" width="266" height="56" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="22" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Ombro (Subacromial / Subdeltóidea)</text>
    <text x="22" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Síndrome do impacto; dor no arco 60-120°.</text>
    <text x="22" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">• Dor noturna ao deitar sobre o ombro.</text>

    <rect x="12" y="112" width="266" height="56" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="22" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Cotovelo (Olecraniana / Estudante)</text>
    <text x="22" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Superficial; principal sítio de bursite séptica.</text>
    <text x="22" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803d">• ADM articular do cotovelo PRESERVADA!</text>

    <rect x="12" y="174" width="266" height="56" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="22" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Quadril (Grande Trocânter - SDGT)</text>
    <text x="22" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Tendinopatia glúteo médio/mínimo prevalece.</text>
    <text x="22" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">• Dor lateral (não inguinal) ao deitar de lado.</text>

    <rect x="12" y="236" width="266" height="56" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="22" y="254" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Joelho (Anserina / Pata de Ganso)</text>
    <text x="22" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Sartório, Grácil e Semitendíneo.</text>
    <text x="22" y="284" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803d">• Ponto doloroso 5 cm ABAIXO da interlinha!</text>

    <rect x="12" y="298" width="266" height="52" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="22" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Tornozelo (Retrocalcânea e Aquileana)</text>
    <text x="22" y="331" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">• Se bilateral em jovem: pensar em ESPONDILOARTRITE!</text>
    <text x="22" y="344" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569">• Retrocalcânea + exostose = Deformidade de Haglund.</text>
  </g>

  <!-- Painel Direito: Semiologia & Conduta -->
  <g transform="translate(625, 95)" filter="url(#shadow1)">
    <rect width="240" height="360" rx="12" fill="url(#emeraldCard)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="240" height="40" rx="12" fill="#059669"/>
    <text x="120" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SEMIOLOGIA &amp; MANEJO</text>

    <rect x="12" y="52" width="216" height="110" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Assinatura Semiológica:</text>
    <text x="20" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Dor à palpação bem localizada.</text>
    <text x="20" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803d">• <tspan font-weight="bold">Dor na contração ATIVA / resistida</tspan>.</text>
    <text x="20" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803d">• <tspan font-weight="bold">Mobilização PASSIVA preservada!</tspan></text>
    <text x="20" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Sem derrame intra-articular difuso.</text>
    <text x="20" y="153" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0284c7">• USG: exame dinâmico de escolha.</text>

    <rect x="12" y="172" width="216" height="175" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Protocolo Terapêutico:</text>
    <text x="20" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Repouso RELATIVO</tspan> (não imobilizar!).</text>
    <text x="20" y="226" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Crioterapia na fase aguda (15-20 min).</text>
    <text x="20" y="242" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• AINE por curto prazo (5 a 7 dias).</text>
    <text x="20" y="258" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Fisioterapia: reeducação funcional.</text>
    <text x="20" y="278" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">⚠️ Infiltração com Corticoide:</text>
    <text x="20" y="294" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Alívio rápido, porém de curto prazo.</text>
    <text x="20" y="308" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b91c1c">• <tspan font-weight="bold">PROIBIDA</tspan> se suspeita de infecção!</text>
    <text x="20" y="322" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569">• Risco de despigmentação/atrofia local.</text>
    <text x="20" y="337" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Bursectomia: refratários ou sepse.</text>
  </g>
</svg>