<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh9" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="470" rx="16" fill="url(#bg9)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh9)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">LUXAÇÃO TRAUMÁTICA: OMBRO, QUADRIL E RISCO VASCULAR</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Sinal da dragona, lesões de Bankart/Hill-Sachs, luxação posterior e a regra das 6 horas no quadril</text>

  <!-- Lado Esquerdo: Ombro (Glenoumeral) -->
  <g transform="translate(35, 95)" filter="url(#sh9)">
    <rect width="400" height="350" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="400" height="35" rx="10" fill="#2563eb"/>
    <text x="200" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LUXAÇÃO GLENOUMERAL (OMBRO) — 50% DOS CASOS</text>

    <!-- Anterior -->
    <rect x="15" y="45" width="370" height="135" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="25" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">1. Luxação ANTERIOR (95 a 98% das luxações):</text>
    <text x="25" y="81" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Mecanismo:</tspan> Abdução + Rotação Externa + Extensão forçada.</text>
    <text x="25" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e40af">• <tspan font-weight="bold">Sinal da Dragona (Charreteira):</tspan> Achatamento do deltoide com</text>
    <text x="35" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">proeminência do acrômio e vazio na cavidade glenoidal.</text>
    <text x="25" y="124" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">• <tspan font-weight="bold">Nervo Axilar (Circunflexo):</tspan> Avaliar sensibilidade no deltoide!</text>
    <text x="25" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Lesões:</tspan> Bankart (lábio anterior) e Hill-Sachs (osso umeral).</text>
    <text x="25" y="156" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#15803d">Taxa de recidiva &gt; 80% em jovens atletas &lt; 20 anos.</text>

    <!-- Posterior -->
    <rect x="15" y="190" width="370" height="140" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="25" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">2. Luxação POSTERIOR (2 a 4% - Armadilha Diagnóstica!):</text>
    <text x="25" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• <tspan font-weight="bold">Os 'Três E':</tspan> Eletricidade (choque), Epilepsia (convulsão), Etilismo.</text>
    <text x="25" y="244" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Braço travado em rotação interna rígida; não roda externamente.</text>
    <text x="25" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">• <tspan font-weight="bold">Sinal da Lâmpada (Lightbulb sign):</tspan> Cabeça umeral simétrica no AP.</text>
    <text x="25" y="278" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e40af">• <tspan font-weight="bold">Conduta Radiológica:</tspan> RX Perfil Axilar ou Perfil de Escápula (Y)</text>
    <text x="35" y="292" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">é mandatório! Muitas vezes passa despercebida na AP isolada.</text>
  </g>

  <!-- Painel Direito: Quadril e Princípios de Redução -->
  <g transform="translate(455, 95)" filter="url(#sh9)">
    <rect width="410" height="350" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="410" height="35" rx="10" fill="#b91c1c"/>
    <text x="205" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LUXAÇÃO DO QUADRIL: EMERGÊNCIA MÁXIMA (&lt; 6 HORAS)</text>

    <rect x="15" y="45" width="380" height="135" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="25" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">• Luxação POSTERIOR do Quadril (90% dos casos):</text>
    <text x="35" y="83" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">- Trauma de alta energia: impacto do joelho no painel do carro.</text>
    <text x="35" y="99" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#991b1b">- <tspan font-weight="bold">Postura Típica:</tspan> FLEXÃO + ADUÇÃO + ROTAÇÃO INTERNA</text>
    <text x="45" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">(Atitude de "banhista púdico" com encurtamento do membro).</text>
    <text x="35" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">- <tspan font-weight="bold">Nervo Ciático:</tspan> Lesado em até 10% (déficit de dorsiflexão do pé).</text>
    <text x="35" y="144" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">- <tspan font-weight="bold">Janela das 6 horas:</tspan> Risco exponencial de NECROSE AVASCULAR</text>
    <text x="45" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b91c1c">da cabeça femoral por torção dos vasos circunflexos!</text>

    <!-- Regras Vitais de Redução -->
    <rect x="15" y="190" width="380" height="140" rx="6" fill="#1e293b"/>
    <text x="205" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">AS 3 REGRAS DE OURO NO MANEJO DA LUXAÇÃO</text>
    <text x="25" y="232" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ffffff">1. <tspan font-weight="bold" fill="#4ade80">Avaliação Neurovascular ANTES e DEPOIS:</tspan> Pulsos distais e nervos.</text>
    <text x="25" y="250" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ffffff">2. <tspan font-weight="bold" fill="#fbbf24">Radiografia ANTES e DEPOIS:</tspan> Afastar fratura antes de manobrar!</text>
    <text x="25" y="268" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ffffff">3. <tspan font-weight="bold" fill="#f87171">Sedação Profunda / Relaxamento Muscular:</tspan> Reduzir com dor gera</text>
    <text x="35" y="282" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#cbd5e1">espasmo reflexo e FRATURA IATROGÊNICA do colo umeral/femoral.</text>
    <text x="25" y="304" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#38bdf8">• Técnicas ombro: Stimson, Kocher, tração-contratração, FARES.</text>
  </g>
</svg>