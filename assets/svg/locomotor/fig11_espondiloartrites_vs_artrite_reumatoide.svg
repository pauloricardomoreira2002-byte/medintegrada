<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh11" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="470" rx="16" fill="url(#bg11)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh11)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">ESPONDILOARTRITES vs. ARTRITE REUMATOIDE</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">A distinção mestra da reumatologia: uma destrói o osso (pannus/erosão); a outra forma osso (entese/anquilose)</text>

  <!-- Lado Esquerdo: Artrite Reumatoide (Destruição) -->
  <g transform="translate(35, 95)" filter="url(#sh11)">
    <rect width="400" height="350" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect width="400" height="38" rx="10" fill="#b91c1c"/>
    <text x="200" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ARTRITE REUMATOIDE (AR) — DESTRÓI OSSO</text>

    <text x="20" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Lesão Primária:</text>
    <text x="30" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1f2937">Membrana <tspan font-weight="bold" fill="#b91c1c">SINOVIAL</tspan> das diartroses.</text>
    <text x="20" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Mecanismo Patológico:</text>
    <text x="30" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Hiperplasia sinovial invasiva → formação do <tspan font-weight="bold">PANNUS</tspan>;</text>
    <text x="30" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">ativação osteoclástica via RANKL/TNF-α.</text>
    <text x="20" y="162" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Desfecho Estrutural Radiográfico:</text>
    <text x="30" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#dc2626"><tspan font-weight="bold">EROSÕES MARGINAIS + OSTEOPENIA PERIARTICULAR</tspan></text>
    <text x="30" y="196" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Redução uniforme e simétrica do espaço articular.</text>
    <text x="20" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">• Padrão Clínico Articular:</text>
    <text x="30" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Poliartrite SIMÉTRICA de pequenas articulações (MCF, IFP, punhos);</text>
    <text x="30" y="256" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c"><tspan font-weight="bold">POUPA as Interfalangianas Distais (IFD) e sacroilíacas!</tspan></text>
    <rect x="15" y="275" width="370" height="60" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="195" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">SOROPOSITIVIDADE &amp; HLA</text>
    <text x="195" y="312" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Fator Reumatoide (70-80%) • Anti-CCP (95-98%) • HLA-DRB1</text>
    <text x="195" y="326" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Metotrexato é o fármaco âncora; csDMARDs funcionam bem.</text>
  </g>

  <!-- Lado Direito: Espondiloartrites (Neoformação) -->
  <g transform="translate(455, 95)" filter="url(#sh11)">
    <rect width="410" height="350" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="410" height="38" rx="10" fill="#1d4ed8"/>
    <text x="205" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ESPONDILOARTRITES (SpA) — FORMA OSSO</text>

    <text x="20" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">• Lesão Primária:</text>
    <text x="30" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1f2937">A <tspan font-weight="bold" fill="#1d4ed8">ÊNTESE</tspan> (inserção óssea de tendão, ligamento e cápsula).</text>
    <text x="20" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">• Mecanismo Patológico:</text>
    <text x="30" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Entesite com osteíte seguida de reparo anômalo com</text>
    <text x="30" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1d4ed8"><tspan font-weight="bold">NEOFORMAÇÃO ÓSSEA EXUBERANTE (Metaplasia condróide)</tspan>.</text>
    <text x="20" y="162" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">• Desfecho Estrutural Radiográfico:</text>
    <text x="30" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1d4ed8"><tspan font-weight="bold">SINDESMÓFITOS + ANQUILOSE ÓSSEA COMPLETA</tspan></text>
    <text x="30" y="196" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Aspecto clássico de "COLUNA EM BAMBU"; fusão articular.</text>
    <text x="20" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">• Padrão Clínico Articular:</text>
    <text x="30" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Acometimento AXIAL (sacroilíacas e coluna) + Oligoartrite</text>
    <text x="30" y="256" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1d4ed8"><tspan font-weight="bold">ASSIMÉTRICA de grandes articulações de MMII + Dactilite!</tspan></text>
    <rect x="15" y="275" width="380" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="205" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">SORONEGATIVIDADE &amp; HLA</text>
    <text x="205" y="312" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">FR e Anti-CCP NEGATIVOS • Forte ligação ao HLA-B27</text>
    <text x="205" y="326" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle">csDMARDs NÃO funcionam no esqueleto axial; exige anti-TNF/anti-IL-17.</text>
  </g>
</svg>