<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh3" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="460" rx="16" fill="url(#bg3)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh3)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">O CONTÍNUO DA TENDINOPATIA (COOK &amp; PURDAM) E A TENDINOSE</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Por que 'tendinite' foi abandonado: degeneração sem inflamação e a superioridade da contração excêntrica</text>

  <!-- Estágio 1: Reativa -->
  <g transform="translate(35, 95)" filter="url(#sh3)">
    <rect width="265" height="230" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <rect width="265" height="35" rx="10" fill="#059669"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. TENDINOPATIA REATIVA</text>
    <text x="15" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Gatilho:</text>
    <text x="25" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Sobrecarga mecânica aguda e rápida.</text>
    <text x="15" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Fisiopatologia:</text>
    <text x="25" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Resposta proliferativa celular NÃO inflamatória;</text>
    <text x="25" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">aumento de proteoglicanos e retenção hídrica.</text>
    <text x="15" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Prognóstico:</text>
    <text x="25" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#047857">TOTALMENTE REVERSÍVEL!</text>
    <text x="25" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Basta manejo e modulação de carga.</text>
    <rect x="15" y="202" width="235" height="18" rx="4" fill="#10b981"/>
    <text x="132" y="214" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Adaptação Fisiológica Aguda</text>
  </g>

  <!-- Estágio 2: Desarranjo -->
  <g transform="translate(318, 95)" filter="url(#sh3)">
    <rect width="265" height="230" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <rect width="265" height="35" rx="10" fill="#d97706"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. DESARRANJO (DYREPAIR)</text>
    <text x="15" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">• Gatilho:</text>
    <text x="25" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Sobrecarga mantida sem intervalo de repouso.</text>
    <text x="15" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">• Fisiopatologia:</text>
    <text x="25" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Tentativa desorganizada de cicatrização;</text>
    <text x="25" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">separação de fibras de colágeno tipo I;</text>
    <text x="25" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">início da neovascularização com nervos.</text>
    <text x="15" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">• Prognóstico:</text>
    <text x="25" y="188" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#d97706">POTENCIALMENTE REVERSÍVEL</text>
    <text x="25" y="204" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Exige estímulo mecânico direcionado.</text>
  </g>

  <!-- Estágio 3: Degenerativa -->
  <g transform="translate(600, 95)" filter="url(#sh3)">
    <rect width="265" height="230" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <rect width="265" height="35" rx="10" fill="#b91c1c"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. TENDINOPATIA DEGENERATIVA</text>
    <text x="15" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">• Gatilho:</text>
    <text x="25" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Anos de estresse cumulativo crônico.</text>
    <text x="15" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">• Fisiopatologia (Tendinose):</text>
    <text x="25" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">Apoptose celular focal, matriz mucoide amorfa,</text>
    <text x="25" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">neovasos caóticos e hiperinervação dolorosa.</text>
    <text x="15" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">• Desfecho Clínico:</text>
    <text x="25" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">RISCO IMINENTE DE RUPTURA!</text>
    <text x="25" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Áreas acelulares sem capacidade de regeneração.</text>
    <rect x="15" y="202" width="235" height="18" rx="4" fill="#b91c1c"/>
    <text x="132" y="214" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Sem Infiltrado Inflamatório Neutrofílico</text>
  </g>

  <!-- Rodapé: Por que Exercício Excêntrico Funciona -->
  <g transform="translate(35, 340)" filter="url(#sh3)">
    <rect width="830" height="100" rx="10" fill="#1e293b"/>
    <text x="415" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      IMPLICAÇÃO PRÁTICA: POR QUE O EXERCÍCIO EXCÊNTRICO É SUPERIOR AO AINE E AO REPOUSO?
    </text>
    <text x="25" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f1f5f9">
      • <tspan font-weight="bold" fill="#fbbf24">AINEs e Corticoides:</tspan> Não revertem a degeneração tecidual; corticoide intratendíneo enfraquece a matriz e induz ruptura direta.
    </text>
    <text x="25" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f1f5f9">
      • <tspan font-weight="bold" fill="#4ade80">Contração Excêntrica (Protocolo de Alfredson / Heavy Slow Resistance):</tspan> O alongamento sob tensão mecânica estimula os tenócitos
    </text>
    <text x="25" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
      a sintetizar colágeno tipo I alinhado, obliterando a neovascularização caótica e restaurando a capacidade de suporte de carga do tendão.
    </text>
  </g>
</svg>