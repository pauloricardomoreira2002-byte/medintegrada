<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="sh14" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#475569" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="900" height="480" rx="16" fill="url(#bg14)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="20" width="840" height="55" rx="10" fill="#1e3a8a" filter="url(#sh14)"/>
  <text x="450" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">OSTEOPOROSE: REMODELAMENTO, DXA/FRAX E ADVERTÊNCIAS CRÍTICAS</text>
  <text x="450" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Eixo RANK-RANKL-Osteoprotegerina, critérios densitométricos da OMS e os 3 erros terapêuticos graves</text>

  <!-- Coluna 1: Fisiopatologia e Eixo RANKL -->
  <g transform="translate(35, 95)" filter="url(#sh14)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#2563eb"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FISIOPATOLOGIA &amp; REMODELAMENTO</text>

    <text x="15" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">• Ciclo de Remodelamento Desbalanceado:</text>
    <text x="25" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">- Osteoclasto reabsorve osso em 2 a 3 semanas.</text>
    <text x="25" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">- Osteoblasto forma osso em 3 a 4 meses.</text>
    <text x="25" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">Taxa alta de remodelamento = perda óssea líquida!</text>

    <text x="15" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">• O Eixo Molecular Regulador:</text>
    <text x="25" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155"><tspan font-weight="bold">RANKL:</tspan> Produzido por osteoblastos/osteócitos;</text>
    <text x="25" y="164" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">liga-se ao RANK e ativa diferenciação de osteoclastos.</text>
    <text x="25" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#059669"><tspan font-weight="bold">Osteoprotegerina (OPG):</tspan> Receptor-isca protetor</text>
    <text x="25" y="194" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#059669">que sequestra o RANKL e impede reabsorção.</text>

    <rect x="12" y="210" width="240" height="135" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">O Papel do Estrogênio:</text>
    <text x="20" y="248" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Estrogênio estimula OPG e inibe RANKL.</text>
    <text x="20" y="264" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#b91c1c">• <tspan font-weight="bold">Queda na Menopausa:</tspan> Desbloqueia o RANKL,</text>
    <text x="25" y="278" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#b91c1c">disparando perda trabecular de 2-3% ao ano</text>
    <text x="25" y="292" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">nos primeiros 5 a 10 anos pós-menopausa!</text>
    <text x="20" y="312" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#1e40af">• <tspan font-weight="bold">Esclerostina (osteócito):</tspan> Inibe formação óssea Wnt.</text>
    <text x="20" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b">Causa secundária #1: GLICOCORTICOIDE iatrogênico.</text>
  </g>

  <!-- Coluna 2: Diagnóstico DXA e FRAX -->
  <g transform="translate(318, 95)" filter="url(#sh14)">
    <rect width="265" height="360" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="265" height="35" rx="10" fill="#d97706"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DENSITOMETRIA &amp; CRITÉRIOS</text>

    <!-- Tabela OMS -->
    <rect x="12" y="48" width="240" height="115" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="20" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">Critérios da OMS (T-escore):</text>
    <text x="20" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#047857">• <tspan font-weight="bold">Normal:</tspan> T-escore ≥ -1,0 DP</text>
    <text x="20" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d97706">• <tspan font-weight="bold">Osteopenia:</tspan> entre -1,0 e -2,5 DP</text>
    <text x="20" y="116" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b91c1c">• <tspan font-weight="bold">Osteoporose:</tspan> T-escore ≤ -2,5 DP</text>
    <text x="20" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• <tspan font-weight="bold">Grave / Estabelecida:</tspan> ≤ -2,5 + fratura.</text>
    <text x="20" y="148" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Sítios: L1-L4, Fêmur Total e Colo Femoral.</text>

    <rect x="12" y="172" width="240" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af">T-escore vs. Z-escore:</text>
    <text x="20" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• <tspan font-weight="bold">T-escore:</tspan> Mulheres pós-menopausa e homens ≥ 50.</text>
    <text x="20" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• <tspan font-weight="bold">Z-escore:</tspan> Pré-menopausa, homens &lt; 50 e crianças.</text>
    <text x="25" y="236" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#1e40af">Se Z ≤ -2,0: obrigatório investigar CAUSA SECUNDÁRIA!</text>

    <rect x="12" y="265" width="240" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">FRAX &amp; Paradoxo da Prevenção:</text>
    <text x="20" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Maioria das fraturas ocorre em osteopênicos</text>
    <text x="25" y="317" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">(pelo grande contingente populacional absoluto).</text>
    <text x="20" y="333" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#059669">• O FRAX identifica alto risco na osteopenia!</text>
  </g>

  <!-- Coluna 3: As Três Advertências Terapêuticas Vitais -->
  <g transform="translate(600, 95)" filter="url(#sh14)">
    <rect width="265" height="360" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect width="265" height="35" rx="10" fill="#991b1b"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">AS 3 ADVERTÊNCIAS CRÍTICAS</text>

    <!-- Advertência 1 -->
    <rect x="10" y="45" width="245" height="90" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="18" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">1. SUSPENSÃO DO DENOSUMABE:</text>
    <text x="18" y="79" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• <tspan font-weight="bold" fill="#b91c1c">EFEITO REBOTE BRUTAL!</tspan> A interrupção</text>
    <text x="18" y="93" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">abrupta causa hiper-reabsorção maciça com</text>
    <text x="18" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b91c1c"><tspan font-weight="bold">SURTO DE FRATURAS VERTEBRAIS MÚLTIPLAS</tspan>.</text>
    <text x="18" y="123" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#15803d">→ Mandatório emendar bisfosfonato se for suspender!</text>

    <!-- Advertência 2 -->
    <rect x="10" y="142" width="245" height="90" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="18" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">2. SEQUENCIAMENTO PÓS-ANABÓLICO:</text>
    <text x="18" y="176" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Teriparatida / Abaloparatida (máx. 2 anos).</text>
    <text x="18" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b91c1c">• Ao finalizar o curso anabólico, é <tspan font-weight="bold">OBRIGATÓRIO</tspan></text>
    <text x="18" y="204" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b91c1c">  iniciar um ANTIRREABSORTIVO imediatamente!</text>
    <text x="18" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Sem isso, todo o ganho ósseo se dissipa rapidamente.</text>

    <!-- Advertência 3 -->
    <rect x="10" y="238" width="245" height="110" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="18" y="256" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">3. ROMOSOZUMABE (RISCO CV):</text>
    <text x="18" y="272" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Anti-esclerostina: ação dual (forma + reabsorve -).</text>
    <text x="18" y="286" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b91c1c">• <tspan font-weight="bold">CONTRAINDICADO ABSOLUTO</tspan> em mulheres com</text>
    <text x="18" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b91c1c">histórico prévio de INFARTO (IAM) ou AVC!</text>
    <text x="18" y="316" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#334155">• Bisfosfonatos orais: tomar em jejum com água</text>
    <text x="18" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#334155">  e permanecer 30 min em pé (evitar esofagite).</text>
    <text x="18" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#475569">• Férias terapêuticas após 3-5 anos (evita ONM/fratura atípica).</text>
  </g>
</svg>