<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect x="0" y="0" width="900" height="60" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="44" width="900" height="16" fill="#2563eb"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    TOPOGRAFIA CLÍNICA DA GOTA &amp; O PAPEL DETERMINANTE DA TEMPERATURA
  </text>

  <!-- Painel Esquerdo: Por que nas Articulações Frias? -->
  <g transform="translate(30, 80)">
    <rect width="380" height="375" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#dropShadow)"/>
    <rect width="380" height="38" rx="12" fill="#0284c7"/>
    <rect y="26" width="380" height="12" fill="#0284c7"/>
    <text x="190" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      POR QUE OS CRISTAIS PRECIPITAM NA PERIFERIA?
    </text>

    <!-- Fator 1: Temperatura -->
    <rect x="16" y="52" width="348" height="90" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="28" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">1. Queda Marcante da Solubilidade Térmica</text>
    <text x="28" y="90" font-family="Arial, sans-serif" font-size="10.5" fill="#0c4a6e">• No tronco (37°C), a solubilidade do urato é de ~6,8 mg/dL.</text>
    <text x="28" y="106" font-family="Arial, sans-serif" font-size="10.5" fill="#0c4a6e">• No hálux e tornozelo (30°C - 32°C), a solubilidade despenca</text>
    <text x="28" y="122" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0284c7">para cerca de 4,5 a 5,0 mg/dL, facilitando a cristalização!</text>

    <!-- Fator 2: Solvente Sinovial Inadequado -->
    <rect x="16" y="152" width="348" height="80" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="28" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">2. O Líquido Sinovial é um Solvente Fraco</text>
    <text x="28" y="190" font-family="Arial, sans-serif" font-size="10.5" fill="#0c4a6e">• Menor concentração de albumina carreadora.</text>
    <text x="28" y="206" font-family="Arial, sans-serif" font-size="10.5" fill="#0c4a6e">• Proteoglicanos da cartilagem favorecem a nucleação.</text>
    <text x="28" y="222" font-family="Arial, sans-serif" font-size="10.5" fill="#0c4a6e">• A reabsorção noturna de água intra-articular concentra o urato.</text>

    <!-- Fator 3: Microtrauma -->
    <rect x="16" y="242" width="348" height="80" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="28" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">3. Carga Mecânica &amp; Microtraumas</text>
    <text x="28" y="280" font-family="Arial, sans-serif" font-size="10.5" fill="#0c4a6e">• O peso corpóreo sobrecarrega a 1ª metatarsofalangeana.</text>
    <text x="28" y="296" font-family="Arial, sans-serif" font-size="10.5" fill="#0c4a6e">• Microtraumas de deambulação desprendem cristais</text>
    <text x="28" y="312" font-family="Arial, sans-serif" font-size="10.5" fill="#0c4a6e">para a cavidade sinovial, deflagrando a fagocitose.</text>

    <text x="190" y="352" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">👉 Explicação para as crises típicas de MADRUGADA!</text>
  </g>

  <!-- Painel Direito: Nomenclatura e Mapa Anatômico -->
  <g transform="translate(440, 80)">
    <rect width="430" height="375" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#dropShadow)"/>
    <rect width="430" height="38" rx="12" fill="#2563eb"/>
    <rect y="26" width="430" height="12" fill="#2563eb"/>
    <text x="215" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      NOMENCLATURA MÉDICA &amp; TOPOGRAFIA DAS CRISES
    </text>

    <!-- Podagra -->
    <rect x="18" y="52" width="394" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="30" y="74" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">PODAGRA (1ª Metatarsofalangeana do Pé)</text>
    <text x="30" y="92" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">• Sítio clássico e mais frequente: acometido em &gt; 50% das primeiras crises.</text>
    <text x="30" y="108" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">• Até 90% dos pacientes com gota terão podagra em algum momento.</text>

    <!-- Gonagra -->
    <rect x="18" y="126" width="394" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="30" y="146" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">GONAGRA (Articulação do Joelho)</text>
    <text x="30" y="164" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af">• Segundo sítio mais comum. Caso clássico do Joaquim (SP1).</text>
    <text x="30" y="178" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af">• Importante diagnóstico diferencial com Artrite Séptica e Pseudogota.</text>

    <!-- Quiragra -->
    <rect x="18" y="196" width="394" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="30" y="216" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">QUIRAGRA (Mãos e Punhos)</text>
    <text x="30" y="234" font-family="Arial, sans-serif" font-size="10.5" fill="#b45309">• Articulações interfalangeanas e metacarpofalangeanas.</text>
    <text x="30" y="246" font-family="Arial, sans-serif" font-size="10" fill="#b45309">• Mais comum em fases avançadas ou mulheres idosas.</text>

    <!-- Outros sítios e Tofos -->
    <rect x="18" y="262" width="394" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="30" y="282" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">Outros Sítios Articulares &amp; Tofos em Partes Moles:</text>
    <text x="30" y="300" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Tornozelos, tendão calcâneo (de Aquiles) e articulações társicas.</text>
    <text x="30" y="316" font-family="Arial, sans-serif" font-size="10" fill="#475569">• <tspan font-weight="bold" fill="#d97706">Bursite Olecraniana</tspan> (cotovelo): nódulo gotoso ou bursite inflamatória aguda.</text>
    <text x="30" y="334" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">• Pavilhões Auriculares (Hélice da orelha):</text>
    <text x="30" y="350" font-family="Arial, sans-serif" font-size="10" fill="#6d28d9">Sítio clássico de tofos gotosos indolores na inspeção dermatológica.</text>
  </g>
</svg>