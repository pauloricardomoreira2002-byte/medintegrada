<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Fundo Principal -->
  <rect width="900" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect x="0" y="0" width="900" height="60" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="44" width="900" height="16" fill="#2563eb"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    METABOLISMO DAS PURINAS: CASCATA ENZIMÁTICA &amp; O GARGALO DA URICASE
  </text>

  <!-- Painel Esquerdo: Cascata Bioquímica Hepática -->
  <g transform="translate(30, 80)">
    <rect width="520" height="375" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect width="520" height="38" rx="12" fill="#2563eb"/>
    <rect y="26" width="520" height="12" fill="#2563eb"/>
    <text x="260" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      VIA HEPÁTICA DO CATABOLISMO DAS PURINAS
    </text>

    <!-- Etapa 1: Fontes de Purinas -->
    <rect x="20" y="52" width="225" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="132" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Fontes Dietéticas &amp; Endógenas</text>
    <text x="132" y="90" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Carnes, Frutos do Mar, DNA/RNA celular</text>

    <rect x="275" y="52" width="225" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="387" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Nucleotídeos Livres</text>
    <text x="387" y="90" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">AMP (Adenina) e GMP (Guanina)</text>

    <!-- Setas convergindo -->
    <path d="M 132 104 L 132 118 L 260 118" stroke="#64748b" stroke-width="1.8" fill="none"/>
    <path d="M 387 104 L 387 118 L 260 118" stroke="#64748b" stroke-width="1.8" fill="none"/>
    <path d="M 260 118 L 260 132" stroke="#64748b" stroke-width="1.8" fill="none"/>
    <polygon points="256,130 260,138 264,130" fill="#64748b"/>

    <!-- Etapa 2: Intermediários Hipoxantina e Guanina -->
    <rect x="140" y="140" width="240" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="260" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">HIPOXANTINA &amp; GUANINA</text>
    <text x="260" y="176" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Intermediários da degradação dos nucleosídeos</text>

    <!-- Seta para Xantina com enzima XO -->
    <path d="M 260 186 L 260 216" stroke="#d97706" stroke-width="2.5" fill="none"/>
    <polygon points="255,214 260,222 265,214" fill="#d97706"/>
    <rect x="290" y="192" width="180" height="24" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="380" y="208" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">Xantina Oxidase (XO)</text>

    <!-- Etapa 3: Xantina -->
    <rect x="140" y="224" width="240" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="260" y="244" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">XANTINA</text>
    <text x="260" y="259" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Ponto central de convergência oxidativa</text>

    <!-- Seta para Ácido Úrico com enzima XO -->
    <path d="M 260 268 L 260 298" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <polygon points="255,296 260,304 265,296" fill="#dc2626"/>
    <rect x="290" y="274" width="210" height="24" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="395" y="290" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Xantina Oxidase (Alvo Alopurinol)</text>

    <!-- Etapa 4: Ácido Úrico -->
    <rect x="100" y="306" width="320" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="260" y="328" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">ÁCIDO ÚRICO (PRODUTO FINAL)</text>
    <text x="260" y="347" font-family="Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Limite plasmático de solubilidade: 6,8 mg/dL</text>
  </g>

  <!-- Painel Direito: Ausência de Uricase e Impacto Evolutivo -->
  <g transform="translate(570, 80)">
    <rect width="300" height="375" rx="12" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect width="300" height="38" rx="12" fill="#d97706"/>
    <rect y="26" width="300" height="12" fill="#d97706"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      O DILEMA DA URICASE HUMANA
    </text>

    <!-- Outros Mamíferos -->
    <rect x="15" y="50" width="270" height="85" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
    <text x="25" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Em Outros Mamíferos:</text>
    <text x="25" y="88" font-family="Arial, sans-serif" font-size="10" fill="#047857">Possuem a enzima funcional URICASE.</text>
    <text x="25" y="104" font-family="Arial, sans-serif" font-size="10" fill="#047857">Ácido Úrico ➔ ALANTOÍNA (hidrossolúvel).</text>
    <text x="25" y="120" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#059669">Níveis séricos baixos: 1 a 2 mg/dL.</text>

    <!-- Humanos e Primatas -->
    <rect x="15" y="148" width="270" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="25" y="168" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9a3412">Em Humanos e Grandes Primatas:</text>
    <text x="25" y="186" font-family="Arial, sans-serif" font-size="10" fill="#c2410c">Mutações inativaram o gene da Uricase.</text>
    <text x="25" y="202" font-family="Arial, sans-serif" font-size="10" fill="#c2410c">O ácido úrico é o produto terminal.</text>
    <text x="25" y="218" font-family="Arial, sans-serif" font-size="10" fill="#7c2d12">Vantagem ancestral: manteve PA e perfusão</text>
    <text x="25" y="234" font-family="Arial, sans-serif" font-size="10" fill="#7c2d12">cerebral em épocas de escassez alimentar.</text>
    <text x="25" y="248" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ea580c">Preço moderno: risco de gota e nefrolitíase.</text>

    <!-- Foco de Prova -->
    <rect x="15" y="270" width="270" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="25" y="290" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">📌 Foco de Prova Docente:</text>
    <text x="25" y="308" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">• A Xantina Oxidase catalisa 2 etapas:</text>
    <text x="35" y="324" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">1) Hipoxantina ➔ Xantina</text>
    <text x="35" y="338" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">2) Xantina ➔ Ácido Úrico</text>
    <text x="25" y="354" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">• O Alopurinol bloqueia ambas as etapas!</text>
  </g>
</svg>