<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect x="0" y="0" width="900" height="60" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="44" width="900" height="16" fill="#2563eb"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    DIAGNÓSTICO DEFINITIVO (PADRÃO-OURO): GOTA vs. PSEUDOGOTA (CPPD)
  </text>

  <!-- Painel Esquerdo: GOTA (Urato Monossódico) -->
  <g transform="translate(30, 80)">
    <rect width="405" height="375" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#1e3a8a"/>
    <rect y="26" width="405" height="12" fill="#1e3a8a"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      GOTA (URATO MONOSSÓDICO - MSU)
    </text>

    <!-- Campo Visual Microscópio -->
    <rect x="20" y="52" width="365" height="110" rx="8" fill="#0f172a"/>
    <!-- Compensador Vermelho de 1ª Ordem -->
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Luz Polarizada Compensada</text>
    <!-- Cristal Amarelo Paralelo -->
    <line x1="60" y1="120" x2="160" y2="80" stroke="#facc15" stroke-width="4.5" stroke-linecap="round"/>
    <text x="110" y="138" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#facc15" text-anchor="middle">Paralelo = AMARELO</text>
    <!-- Cristal Azul Perpendicular -->
    <line x1="240" y1="75" x2="280" y2="135" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <text x="280" y="138" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">Perpendicular = AZUL</text>

    <!-- Dados Microscópicos -->
    <rect x="20" y="172" width="365" height="185" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="32" y="194" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">• Morfologia:</text>
    <text x="125" y="194" font-family="Arial, sans-serif" font-size="11" fill="#334155">Agulhas finas com pontas afiladas</text>

    <text x="32" y="216" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">• Birrefringência:</text>
    <text x="145" y="216" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">FORTEMENTE NEGATIVA</text>

    <text x="32" y="238" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">• Localização:</text>
    <text x="125" y="238" font-family="Arial, sans-serif" font-size="11" fill="#334155">Intra e extracelular (neutrófilos &gt; 80%)</text>

    <text x="32" y="260" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">• Articulação:</text>
    <text x="125" y="260" font-family="Arial, sans-serif" font-size="11" fill="#334155">1ª MTF (Podagra), tornozelo, joelho</text>

    <text x="32" y="282" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">• Faixa Etária:</text>
    <text x="125" y="282" font-family="Arial, sans-serif" font-size="11" fill="#334155">30 a 60 anos (Homens 7–9 : 1)</text>

    <rect x="30" y="300" width="345" height="48" rx="6" fill="#dbeafe"/>
    <text x="202" y="320" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af" text-anchor="middle">★ PONTO CRÍTICO DE PROVA:</text>
    <text x="202" y="336" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">O ácido úrico sérico pode estar NORMAL na crise!</text>
  </g>

  <!-- Painel Direito: PSEUDOGOTA (Pirofosfato de Cálcio - CPPD) -->
  <g transform="translate(465, 80)">
    <rect width="405" height="375" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#b45309"/>
    <rect y="26" width="405" height="12" fill="#b45309"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      PSEUDOGOTA (PIROFOSFATO DE CÁLCIO - CPPD)
    </text>

    <!-- Campo Visual Microscópio -->
    <rect x="20" y="52" width="365" height="110" rx="8" fill="#0f172a"/>
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Luz Polarizada Compensada</text>
    <!-- Cristal Azul Paralelo -->
    <polygon points="70,95 110,80 140,110 100,125" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <text x="105" y="142" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">Paralelo = AZUL</text>
    <!-- Cristal Amarelo Perpendicular -->
    <polygon points="250,75 285,90 270,130 235,115" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <text x="260" y="142" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#facc15" text-anchor="middle">Perpendicular = AMARELO</text>

    <!-- Dados Microscópicos -->
    <rect x="20" y="172" width="365" height="185" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="32" y="194" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">• Morfologia:</text>
    <text x="125" y="194" font-family="Arial, sans-serif" font-size="11" fill="#334155">Romboides, prismáticos ou retangulares</text>

    <text x="32" y="216" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">• Birrefringência:</text>
    <text x="145" y="216" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b45309">FRACAMENTE POSITIVA</text>

    <text x="32" y="238" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">• Articulação:</text>
    <text x="125" y="238" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">JOELHO (&gt; 50%) — hálux é muito raro!</text>

    <text x="32" y="260" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">• Faixa Etária:</text>
    <text x="125" y="260" font-family="Arial, sans-serif" font-size="11" fill="#334155">Idosos &gt; 60 - 65 anos (rara em jovens)</text>

    <text x="32" y="282" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">• Radiografia:</text>
    <text x="125" y="282" font-family="Arial, sans-serif" font-size="11" fill="#334155">Condrocalcinose (meniscos/fibrocartilagem)</text>

    <rect x="30" y="300" width="345" height="48" rx="6" fill="#fef3c7"/>
    <text x="202" y="320" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">DOENÇAS METABÓLICAS ASSOCIADAS:</text>
    <text x="202" y="336" font-family="Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">Hemocromatose, Hiperpara, Hipomagnesemia</text>
  </g>
</svg>