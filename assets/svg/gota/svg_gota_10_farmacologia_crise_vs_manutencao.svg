<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect x="0" y="0" width="900" height="60" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="44" width="900" height="16" fill="#2563eb"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    MANEJO FARMACOLÓGICO: CRISE AGUDA vs. TERAPIA DE MANUTENÇÃO (ULT)
  </text>

  <!-- Painel Esquerdo: Tratamento da Crise Aguda -->
  <g transform="translate(30, 80)">
    <rect width="405" height="375" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#dc2626"/>
    <rect y="26" width="405" height="12" fill="#dc2626"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      1. TRATAMENTO DA CRISE AGUDA (FLARE)
    </text>

    <!-- Meta da Crise -->
    <rect x="16" y="50" width="373" height="36" rx="6" fill="#fee2e2"/>
    <text x="202" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">
      Objetivo: Cortar a inflamação (NÃO alterar o ácido úrico!)
    </text>

    <!-- Fármaco 1: Colchicina -->
    <rect x="16" y="94" width="373" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="28" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">COLCHICINA (1ª Opção Precoce)</text>
    <text x="28" y="130" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">• Liga-se à β-tubulina e inibe os microtúbulos celulares.</text>
    <text x="28" y="146" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">• Bloqueia a quimiotaxia neutrofílica e o inflamassoma NLRP3.</text>
    <text x="28" y="162" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">• Dose moderna: 1,0 mg inicial + 0,5 mg após 1h (evitar diarreia tóxica).</text>

    <!-- Fármaco 2: AINEs e Corticoides -->
    <rect x="16" y="180" width="373" height="84" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="28" y="198" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">AINEs &amp; GLICOCORTICOIDES</text>
    <text x="28" y="216" font-family="Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold">• AINEs potentes:</tspan> Naproxeno, Indometacina, Celecoxibe.</text>
    <text x="28" y="232" font-family="Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold">• Corticoides (Prednisona 30-40mg/dia):</tspan> Droga de escolha</text>
    <text x="38" y="248" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">em idosos, DRC, anticoagulados ou transplante!</text>

    <!-- Alerta de Prova -->
    <rect x="16" y="272" width="373" height="88" rx="8" fill="#7f1d1d"/>
    <text x="202" y="294" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">🚨 AVISO CAPITAL DE PROVA:</text>
    <text x="202" y="314" font-family="Arial, sans-serif" font-size="10.5" fill="#fecaca" text-anchor="middle">NÃO iniciar nem suspender Alopurinol na crise!</text>
    <text x="202" y="332" font-family="Arial, sans-serif" font-size="9.5" fill="#fca5a5" text-anchor="middle">A queda rápida do urato causa "crise de mobilização"</text>
    <text x="202" y="346" font-family="Arial, sans-serif" font-size="9.5" fill="#fca5a5" text-anchor="middle">por desestabilização dos cristais já depositados.</text>
  </g>

  <!-- Painel Direito: Terapia de Manutenção a Longo Prazo -->
  <g transform="translate(465, 80)">
    <rect width="405" height="375" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.8" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#059669"/>
    <rect y="26" width="405" height="12" fill="#059669"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      2. TERAPIA HIPOURICEMIANTE CRÔNICA (ULT)
    </text>

    <!-- Meta da Manutenção -->
    <rect x="16" y="50" width="373" height="36" rx="6" fill="#ecfdf5"/>
    <text x="202" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">
      Alvo: Urato &lt; 6,0 mg/dL (ou &lt; 5,0 mg/dL se gota tofácea)
    </text>

    <!-- Inibidores da XO -->
    <rect x="16" y="94" width="373" height="88" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="28" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">INIBIDORES DA XANTINA OXIDASE</text>
    <text x="28" y="130" font-family="Arial, sans-serif" font-size="10.5" fill="#14532d"><tspan font-weight="bold">• ALOPURINOL (1ª Escolha Geral):</tspan> Análogo da hipoxantina.</text>
    <text x="38" y="146" font-family="Arial, sans-serif" font-size="10" fill="#14532d">Inibe síntese sem afetar via de salvamento. Iniciar com 100mg/d.</text>
    <text x="38" y="162" font-family="Arial, sans-serif" font-size="10" fill="#14532d">Atenção para HLA-B*5801 (risco de Síndrome de Stevens-Johnson).</text>
    <text x="28" y="176" font-family="Arial, sans-serif" font-size="10.5" fill="#14532d"><tspan font-weight="bold">• FEBUXOSTATE:</tspan> Inibidor não-purínico potente (ajuste em DRC).</text>

    <!-- Uricosúricos -->
    <rect x="16" y="190" width="373" height="74" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="28" y="208" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">URICOSÚRICOS (Inibidores do URAT1)</text>
    <text x="28" y="226" font-family="Arial, sans-serif" font-size="10.5" fill="#14532d">• Benzbromarona, Probenecide e Sulfinpirazona.</text>
    <text x="28" y="242" font-family="Arial, sans-serif" font-size="10.5" fill="#14532d">• Indicados apenas para <tspan font-weight="bold">HIPOEXCRETORES</tspan> (&lt; 800 mg/24h).</text>
    <text x="28" y="258" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">⚠️ Contraindicados se história de cálculo renal (litíase)!</text>

    <!-- Profilaxia anti-flare -->
    <rect x="16" y="272" width="373" height="88" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="202" y="294" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">PROTEÇÃO OBRIGATÓRIA CONTRA RECAÍDAS:</text>
    <text x="202" y="314" font-family="Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">Ao introduzir o Alopurinol, SEMPRE associar</text>
    <text x="202" y="330" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#2563eb" text-anchor="middle">Colchicina em baixa dose (0,5 mg 1 a 2x/dia)</text>
    <text x="202" y="346" font-family="Arial, sans-serif" font-size="9.5" fill="#1e40af" text-anchor="middle">por pelo menos 3 a 6 meses de profilaxia contínua.</text>
  </g>
</svg>