<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect x="0" y="0" width="900" height="60" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="44" width="900" height="16" fill="#2563eb"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    ETIOLOGIA DA HIPERURICEMIA: HIPOEXCREÇÃO (90%) vs. HIPERPRODUÇÃO (10%)
  </text>

  <!-- Painel Esquerdo: Hipoexcreção Renal (90% dos Casos) -->
  <g transform="translate(30, 80)">
    <rect width="405" height="375" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#1e3a8a"/>
    <rect y="26" width="405" height="12" fill="#1e3a8a"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      HIPOEXCREÇÃO RENAL (~90% DOS CASOS)
    </text>

    <!-- Subtipo Primário -->
    <rect x="16" y="52" width="373" height="86" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="28" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">1. Primária / Genética Idiopática</text>
    <text x="28" y="90" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af">• Menor filtração ou menor secreção tubular inerente.</text>
    <text x="28" y="106" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af">• Polimorfismos com ganho de função em URAT1 / GLUT9.</text>
    <text x="28" y="122" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af">• Perda de função no transportador secretor ABCG2.</text>

    <!-- Subtipo Secundário -->
    <rect x="16" y="148" width="373" height="135" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="28" y="168" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">2. Secundária (Doenças e Medicamentos)</text>
    <text x="28" y="186" font-family="Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#dc2626">• Medicamentos:</tspan> Diuréticos (HCTZ, clortalidona, furosemida),</text>
    <text x="38" y="202" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">AAS baixa dose (75-100mg), ciclosporina, tacrolimo,</text>
    <text x="38" y="218" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">tuberculostáticos (pirazinamida, etambutol) e niacina.</text>
    <text x="28" y="236" font-family="Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#1e3a8a">• Condições Clínicas:</tspan> Insuficiência Renal Crônica (DRC),</text>
    <text x="38" y="252" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">depleção de volume (desidratação), hipotireoidismo,</text>
    <text x="38" y="268" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">cetoacidose diabética e acidose láctica (lactato compete com urato).</text>

    <!-- Perfil Laboratorial -->
    <rect x="16" y="293" width="373" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="202" y="315" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">PERFIL NA URINA DE 24 HORAS:</text>
    <text x="202" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">Uricosúria &lt; 600 - 800 mg/dia (Hipoexcretor)</text>
    <text x="202" y="350" font-family="Arial, sans-serif" font-size="9.5" fill="#1e40af" text-anchor="middle">Candidato ideal para drogas Uricosúricas (se sem litíase)</text>
  </g>

  <!-- Painel Direito: Hiperprodução de Ácido Úrico (10% dos Casos) -->
  <g transform="translate(465, 80)">
    <rect width="405" height="375" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.8" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#dc2626"/>
    <rect y="26" width="405" height="12" fill="#dc2626"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      HIPERPRODUÇÃO METABÓLICA (~10% DOS CASOS)
    </text>

    <!-- Subtipo Primário -->
    <rect x="16" y="52" width="373" height="86" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="28" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">1. Primária / Erros Inatos do Metabolismo</text>
    <text x="28" y="90" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">• Deficiência de HGPRT (Síndrome de Lesch-Nyhan - ligada ao X).</text>
    <text x="28" y="106" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">• Hiperatividade da PRPP sintetase (produção desregulada).</text>
    <text x="28" y="122" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">• Gota grave em idade jovem com nefrolitíase precoce.</text>

    <!-- Subtipo Secundário -->
    <rect x="16" y="148" width="373" height="135" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="28" y="168" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">2. Secundária (Turnover Celular e Dieta)</text>
    <text x="28" y="186" font-family="Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#dc2626">• Alto Turnover Celular:</tspan> Neoplasias hematológicas (linfomas,</text>
    <text x="38" y="202" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">leucemias, mieloma), Síndrome de Lise Tumoral (SLT),</text>
    <text x="38" y="218" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">psoríase extensa, anemias hemolíticas, rabdomiólise.</text>
    <text x="28" y="236" font-family="Arial, sans-serif" font-size="10.5" fill="#334155"><tspan font-weight="bold" fill="#b45309">• Fatores Dietéticos:</tspan> Carnes vermelhas, vísceras (fígado),</text>
    <text x="38" y="252" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">crustáceos (camarão), bebidas com frutose e cerveja</text>
    <text x="38" y="268" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">(levedura rica em purinas + álcool consome ATP em AMP).</text>

    <!-- Perfil Laboratorial -->
    <rect x="16" y="293" width="373" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="202" y="315" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">PERFIL NA URINA DE 24 HORAS:</text>
    <text x="202" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Uricosúria &gt; 800 - 1000 mg/dia (Hiperprodutor)</text>
    <text x="202" y="350" font-family="Arial, sans-serif" font-size="9.5" fill="#7f1d1d" text-anchor="middle">CONTRAINDICA URICOSÚRICOS (Risco de Litíase Úrica Aguda)</text>
  </g>
</svg>