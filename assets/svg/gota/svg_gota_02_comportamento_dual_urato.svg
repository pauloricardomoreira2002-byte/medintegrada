<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Fundo Principal -->
  <rect width="900" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect x="0" y="0" width="900" height="60" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="44" width="900" height="16" fill="#2563eb"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    O COMPORTAMENTO DUAL DO ÁCIDO ÚRICO: DO PROTETOR AO LESIVO
  </text>

  <!-- Painel Esquerdo: Efeitos Fisiológicos / Benéficos -->
  <g transform="translate(30, 80)">
    <rect width="405" height="375" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.8" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#10b981"/>
    <rect y="26" width="405" height="12" fill="#10b981"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      EM NÍVEIS FISIOLÓGICOS (≤ 6,8 mg/dL)
    </text>

    <!-- Card 1 -->
    <rect x="18" y="55" width="369" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="30" y="76" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">1. Antioxidante Extracelular Potente</text>
    <text x="30" y="94" font-family="Arial, sans-serif" font-size="10.5" fill="#166534">Responsável por &gt; 50% da capacidade antioxidante plasmática.</text>
    <text x="30" y="110" font-family="Arial, sans-serif" font-size="10.5" fill="#166534">Neutraliza radicais livres de oxigênio (ROS) e peroxinitrito.</text>

    <!-- Card 2 -->
    <rect x="18" y="133" width="369" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="30" y="154" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">2. Preservação da Biodisponibilidade de NO</text>
    <text x="30" y="172" font-family="Arial, sans-serif" font-size="10.5" fill="#166534">Protege a enzima eNOS e favorece a síntese de óxido nítrico.</text>
    <text x="30" y="188" font-family="Arial, sans-serif" font-size="10.5" fill="#166534">Promove vasodilatação fisiológica e regulação tensional.</text>

    <!-- Card 3 -->
    <rect x="18" y="211" width="369" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="30" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">3. Efeitos Neuroprotetores</text>
    <text x="30" y="250" font-family="Arial, sans-serif" font-size="10.5" fill="#166534">Protege neurônios contra o estresse oxidativo agudo.</text>
    <text x="30" y="266" font-family="Arial, sans-serif" font-size="10.5" fill="#166534">Associado epidemiologicamente a menor risco de Parkinson.</text>

    <!-- Conclusão Verde -->
    <rect x="18" y="292" width="369" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="202" y="316" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#065f46" text-anchor="middle">✔ RESULTADO SISTÊMICO POSITIVO:</text>
    <text x="202" y="336" font-family="Arial, sans-serif" font-size="10.5" fill="#047857" text-anchor="middle">Proteção vascular endotelial e controle oxidativo fisiológico</text>
  </g>

  <!-- Painel Direito: Efeitos Patológicos / Lesivos -->
  <g transform="translate(465, 80)">
    <rect width="405" height="375" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.8" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#dc2626"/>
    <rect y="26" width="405" height="12" fill="#dc2626"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      NA HIPERURICEMIA (&gt; 6,8 mg/dL)
    </text>

    <!-- Card 1 -->
    <rect x="18" y="55" width="369" height="68" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="30" y="76" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">1. Ação Pró-Oxidante Intracelular</text>
    <text x="30" y="94" font-family="Arial, sans-serif" font-size="10.5" fill="#b91c1c">Ativa a NADPH oxidase gerando excesso de radicais intracelulares.</text>
    <text x="30" y="110" font-family="Arial, sans-serif" font-size="10.5" fill="#b91c1c">Inibe eNOS e destrói o NO ➔ vasoconstrição e rigidez vascular.</text>

    <!-- Card 2 -->
    <rect x="18" y="133" width="369" height="68" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="30" y="154" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">2. Ativação Inflamatória e Imune Inata</text>
    <text x="30" y="172" font-family="Arial, sans-serif" font-size="10.5" fill="#b91c1c">Microcristais ativam receptores TLR2/TLR4 e o inflamassoma NLRP3.</text>
    <text x="30" y="188" font-family="Arial, sans-serif" font-size="10.5" fill="#b91c1c">Liberação maciça de citocinas pirogênicas IL-1β e IL-18.</text>

    <!-- Card 3 -->
    <rect x="18" y="211" width="369" height="68" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="30" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">3. Hiperativação do SRAA Renal e Sistêmico</text>
    <text x="30" y="250" font-family="Arial, sans-serif" font-size="10.5" fill="#b91c1c">Estimula síntese intrarrenal de renina e angiotensina II.</text>
    <text x="30" y="266" font-family="Arial, sans-serif" font-size="10.5" fill="#b91c1c">Gera arteriolopatia aferente, hipertensão e progressão de DRC.</text>

    <!-- Conclusão Vermelha -->
    <rect x="18" y="292" width="369" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="202" y="316" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">🚨 IMPACTO CLÍNICO CRÔNICO:</text>
    <text x="202" y="336" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d" text-anchor="middle">Aterosclerose, HAS, Síndrome Metabólica, Nefropatia e Gota</text>
  </g>
</svg>