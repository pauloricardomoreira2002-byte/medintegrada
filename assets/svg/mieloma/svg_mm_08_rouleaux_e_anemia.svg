<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad8)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect width="900" height="60" rx="16" fill="#1e3a8a"/>
  <rect y="44" width="900" height="16" fill="#2563eb"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">
    ANEMIA MULTIFATORIAL E O FENÔMENO DE ROULEAUX NO SANGUE PERIFÉRICO
  </text>

  <!-- Lado Esquerdo: Causas da Anemia -->
  <g transform="translate(30, 80)">
    <rect width="405" height="310" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow8)"/>
    <rect width="405" height="36" rx="12" fill="#1e3a8a"/>
    <rect y="24" width="405" height="12" fill="#1e3a8a"/>
    <text x="202" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      MECANISMOS DA ANEMIA (NORMO/NORMO EM 80%)
    </text>

    <rect x="20" y="55" width="365" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="35" y="75" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">1. Infiltração e Ocupação Medular</text>
    <text x="35" y="93" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">Os plasmócitos neoplásicos invadem a medula óssea, expulsando os</text>
    <text x="35" y="107" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">precursores eritroides normais (falência de produção).</text>

    <rect x="20" y="125" width="365" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="35" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">2. Queda da Eritropoetina (EPO)</text>
    <text x="35" y="163" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">A nefropatia do mieloma lesa o interstício peritubular renal,</text>
    <text x="35" y="177" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">reduzindo drasticamente a síntese de eritropoetina.</text>

    <rect x="20" y="195" width="365" height="85" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="35" y="215" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">3. Anemia de Doença Crônica (Eixo Hepcidina)</text>
    <text x="35" y="233" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• IL-6 tumoral estimula a síntese hepática de <tspan font-weight="bold">HEPCIDINA</tspan>.</text>
    <text x="35" y="249" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Hepcidina degrada a ferroportina ➔ ferro preso nos macrófagos.</text>
    <text x="35" y="265" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">Perfil: Ferritina Alta ↑ | Ferro Sérico Baixo ↓ | TIBC Baixo ↓</text>
  </g>

  <!-- Lado Direito: Fenômeno de Rouleaux -->
  <g transform="translate(465, 80)">
    <rect width="405" height="310" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow8)"/>
    <rect width="405" height="36" rx="12" fill="#dc2626"/>
    <rect y="24" width="405" height="12" fill="#dc2626"/>
    <text x="202" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ROULEAUX: EMPILHAMENTO DE HEMÁCIAS
    </text>

    <!-- Desenho de Moedas Empilhadas -->
    <g transform="translate(70, 50)">
      <!-- Pilha de Hemácias -->
      <ellipse cx="60" cy="120" rx="45" ry="12" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
      <ellipse cx="60" cy="105" rx="45" ry="12" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
      <ellipse cx="60" cy="90" rx="45" ry="12" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
      <ellipse cx="60" cy="75" rx="45" ry="12" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
      <ellipse cx="60" cy="60" rx="45" ry="12" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>

      <text x="140" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">"Empilhamento</text>
      <text x="140" y="98" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">em Moedas"</text>
      <text x="140" y="118" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">(3 a 12 hemácias)</text>
    </g>

    <!-- Fisiopatologia Biofísica -->
    <rect x="20" y="175" width="365" height="115" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="35" y="196" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">MECANISMO BIOFÍSICO:</text>
    <text x="35" y="214" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">• Normalmente, as hemácias têm carga negativa (<tspan font-weight="bold">potencial zeta</tspan>)</text>
    <text x="35" y="229" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">  que as faz repelir umas às outras na corrente sanguínea.</text>
    <text x="35" y="247" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">• O mar de <tspan font-weight="bold">Proteína M catiônica</tspan> neutraliza o potencial zeta,</text>
    <text x="35" y="262" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d">  fazendo as hemácias grudarem umas nas outras como moedas.</text>
    <text x="35" y="280" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">➔ Explica a elevação colossal do VHS (&gt; 100 mm/h)!</text>
  </g>

  <!-- Rodapé -->
  <rect x="30" y="405" width="840" height="58" rx="10" fill="#1e293b"/>
  <text x="45" y="428" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">RESUMO PRÁTICO PARA A PROVA:</text>
  <text x="45" y="446" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">
    Anemia normocítica normocrômica com Rouleaux no esfregaço e VHS acima de 100 mm/h em paciente com dor óssea ou insuficiência renal é achado cardeal de Mieloma!
  </text>
</svg>