<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad2)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect width="900" height="60" rx="16" fill="url(#headGrad2)"/>
  <rect y="44" width="900" height="16" fill="#1d4ed8"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">
    HISTÓRIA NATURAL: TRANSIÇÃO DE MGUS PARA MIELOMA ATIVO
  </text>

  <!-- 3 Cartões Sequenciais -->
  <!-- Estágio 1: MGUS -->
  <g transform="translate(30, 85)">
    <rect width="265" height="300" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow2)"/>
    <rect width="265" height="40" rx="12" fill="#3b82f6"/>
    <rect y="28" width="265" height="12" fill="#3b82f6"/>
    <text x="132" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. MGUS</text>
    
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Gamopatia Monoclonal de</text>
    <text x="15" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Significado Indeterminado</text>

    <line x1="15" y1="92" x2="250" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <text x="15" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">• Plasmócitos MO: &lt; 10%</text>
    <text x="15" y="132" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">• Proteína M Sérica: &lt; 3 g/dL</text>
    <text x="15" y="152" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">• Sintomas CRAB: AUSENTES</text>
    <text x="15" y="172" font-family="Arial, sans-serif" font-size="11" fill="#475569">• Alterações primárias:</text>
    <text x="25" y="190" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b">t(14q32) ou hiperdiploidia</text>

    <rect x="15" y="215" width="235" height="65" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="132" y="235" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Risco de Progressão</text>
    <text x="132" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">~1% ao ano</text>
    <text x="132" y="270" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">(10 anos ≈ 10% | 20 anos ≈ 20%)</text>
  </g>

  <!-- Seta 1 para 2 -->
  <g transform="translate(305, 220)">
    <path d="M 0 0 L 15 0" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="13,-5 23,0 13,5" fill="#f59e0b"/>
  </g>

  <!-- Estágio 2: Mieloma Indolente (Smoldering) -->
  <g transform="translate(335, 85)">
    <rect width="250" height="300" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow2)"/>
    <rect width="250" height="40" rx="12" fill="#f59e0b"/>
    <rect y="28" width="250" height="12" fill="#f59e0b"/>
    <text x="125" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. MIELOMA INDOLENTE</text>
    
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b45309">Smoldering (Assintomático)</text>
    <text x="15" y="80" font-family="Arial, sans-serif" font-size="11" fill="#78350f">Estágio intermediário avançado</text>

    <line x1="15" y1="92" x2="235" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <text x="15" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">• Plasmócitos MO: 10% a 59%</text>
    <text x="15" y="132" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">• Proteína M Sérica: ≥ 3 g/dL</text>
    <text x="15" y="152" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">• Ou Bence Jones: ≥ 500mg/24h</text>
    <text x="15" y="172" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">• Critérios CRAB: AUSENTES</text>
    <text x="15" y="190" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">• Biomarcadores SLiM: NÃO</text>

    <rect x="15" y="215" width="220" height="65" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="125" y="235" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Risco de Progressão</text>
    <text x="125" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">~10% ao ano</text>
    <text x="125" y="270" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">(Conduta: Observação rigorosa)</text>
  </g>

  <!-- Seta 2 para 3 -->
  <g transform="translate(595, 220)">
    <path d="M 0 0 L 15 0" stroke="#dc2626" stroke-width="3"/>
    <polygon points="13,-5 23,0 13,5" fill="#dc2626"/>
  </g>

  <!-- Estágio 3: Mieloma Múltiplo Ativo -->
  <g transform="translate(625, 85)">
    <rect width="245" height="300" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow2)"/>
    <rect width="245" height="40" rx="12" fill="#dc2626"/>
    <rect y="28" width="245" height="12" fill="#dc2626"/>
    <text x="122" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. MIELOMA ATIVO</text>
    
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Mieloma Múltiplo Sintomático</text>
    <text x="15" y="80" font-family="Arial, sans-serif" font-size="11" fill="#7f1d1d">Requer intervenção terapêutica</text>

    <line x1="15" y1="92" x2="230" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <text x="15" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">• Plasmócitos MO: ≥ 10%</text>
    <text x="15" y="132" font-family="Arial, sans-serif" font-size="11" fill="#475569">associados obrigatoriamente a:</text>
    
    <rect x="15" y="142" width="215" height="58" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="25" y="160" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Dano de Órgão-Alvo (CRAB):</text>
    <text x="25" y="176" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">• Hipercalcemia / Rim (Cr &gt; 2)</text>
    <text x="25" y="191" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">• Anemia / Lesões Ósseas Líticas</text>

    <rect x="15" y="215" width="215" height="65" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="107" y="235" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">OU Critérios SLiM (IMWG 2014):</text>
    <text x="107" y="253" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">MO ≥60% | FLC ≥100 | &gt;1 Lesão RM</text>
    <text x="107" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">➔ TRATAMENTO IMEDIATO</text>
  </g>

  <!-- Rodapé didático -->
  <rect x="30" y="405" width="840" height="55" rx="10" fill="#1e293b"/>
  <text x="45" y="428" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">FOCO DE PROVA (PEGADINHA FREQUENTE):</text>
  <text x="45" y="446" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">
    A presença de componente monoclonal isolado NÃO diagnostica Mieloma Ativo. Sem CRAB ou critérios SLiM, trata-se de MGUS ou Smoldering!
  </text>
</svg>