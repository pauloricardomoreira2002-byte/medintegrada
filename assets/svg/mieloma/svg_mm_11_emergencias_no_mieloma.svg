<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow11" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad11)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect width="900" height="60" rx="16" fill="#1e3a8a"/>
  <rect y="44" width="900" height="16" fill="#dc2626"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">
    AS 3 GRANDES EMERGÊNCIAS MÉDICAS NO MIELOMA MÚLTIPLO
  </text>

  <!-- 3 Blocos de Emergência -->
  <!-- 1. Compressão Medular Aguda -->
  <g transform="translate(30, 80)">
    <rect width="265" height="310" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shadow11)"/>
    <rect width="265" height="36" rx="12" fill="#dc2626"/>
    <rect y="24" width="265" height="12" fill="#dc2626"/>
    <text x="132" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      1. COMPRESSÃO MEDULAR
    </text>

    <text x="15" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Quadro Clínico Agudo:</text>
    <text x="15" y="78" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Colapso de corpo vertebral ou</text>
    <text x="15" y="94" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">  invasão por plasmocitoma.</text>
    <text x="15" y="112" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Dor dorsal em faixa + parestesia.</text>
    <text x="15" y="130" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Paraparesia / paraplegia súbita.</text>
    <text x="15" y="148" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Bexiga neurogênica e anestesia em sela.</text>

    <rect x="15" y="165" width="235" height="130" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="25" y="185" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">Conduta Imediata:</text>
    <text x="25" y="202" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• <tspan font-weight="bold">RM de Coluna Urgente</tspan>.</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• <tspan font-weight="bold">Dexametasona em alta dose</tspan></text>
    <text x="25" y="236" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">  (10 a 40 mg EV stat).</text>
    <text x="25" y="254" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• <tspan font-weight="bold">Radioterapia descompressiva</tspan> ou</text>
    <text x="25" y="270" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">  descompressão cirúrgica rápida!</text>
  </g>

  <!-- 2. Síndrome de Hiperviscosidade -->
  <g transform="translate(315, 80)">
    <rect width="265" height="310" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow11)"/>
    <rect width="265" height="36" rx="12" fill="#d97706"/>
    <rect y="24" width="265" height="12" fill="#d97706"/>
    <text x="132" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      2. HIPERVISCOSIDADE
    </text>

    <text x="15" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b45309">Proteína M Elevada (&gt; 5 g/dL):</text>
    <text x="15" y="78" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Mais comum em IgM, mas ocorre</text>
    <text x="15" y="94" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">  em IgA e IgG polimerizadas.</text>
    <text x="15" y="112" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Cefaleia, vertigem e zumbido.</text>
    <text x="15" y="130" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Visão turva (veias em salsicha e</text>
    <text x="15" y="148" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">  hemorragias em chama de vela).</text>

    <rect x="15" y="165" width="235" height="130" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="25" y="185" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">Conduta Imediata:</text>
    <text x="25" y="202" font-family="Arial, sans-serif" font-size="10" fill="#78350f">• <tspan font-weight="bold">PLASMAFÉRESE DE URGÊNCIA</tspan></text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="10" fill="#78350f">  Remove rapidamente a paraproteína.</text>
    <text x="25" y="238" font-family="Arial, sans-serif" font-size="10" fill="#78350f">• Hidratação cuidadosa (sem</text>
    <text x="25" y="254" font-family="Arial, sans-serif" font-size="10" fill="#78350f">  sobrecarga circulatória).</text>
    <text x="25" y="270" font-family="Arial, sans-serif" font-size="10" fill="#78350f">• Evitar transfusão de hemácias!</text>
  </g>

  <!-- 3. Crise de Hipercalcemia Grave -->
  <g transform="translate(600, 80)">
    <rect width="270" height="310" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow11)"/>
    <rect width="270" height="36" rx="12" fill="#2563eb"/>
    <rect y="24" width="270" height="12" fill="#2563eb"/>
    <text x="135" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      3. HIPERCALCEMIA GRAVE
    </text>

    <text x="15" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Cálcio &gt; 12-14 mg/dL:</text>
    <text x="15" y="78" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Desidratação profunda por poliúria.</text>
    <text x="15" y="94" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Confusão mental, letargia e coma.</text>
    <text x="15" y="112" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Arritmias e parada cardíaca.</text>
    <text x="15" y="130" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">• Piora fulminante da função renal</text>
    <text x="15" y="148" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">  por vasoconstrição afferente.</text>

    <rect x="15" y="165" width="240" height="130" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="25" y="185" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">Manejo Clínico Estruturado:</text>
    <text x="25" y="202" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">• <tspan font-weight="bold">1º Salina 0,9%</tspan> vigorosa (3-4L/dia).</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">• <tspan font-weight="bold">2º Bisfosfonato EV</tspan> (Zoledrônico 4mg)</text>
    <text x="25" y="236" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">  ou Denosumabe (se ClCr &lt; 30).</text>
    <text x="25" y="254" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">• <tspan font-weight="bold">3º Calcitonina SC/IM</tspan> (efeito rápido).</text>
    <text x="25" y="270" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">• Corticoide e Hemodiálise (se refratário).</text>
  </g>

  <!-- Rodapé -->
  <rect x="30" y="405" width="840" height="58" rx="10" fill="#0f172a"/>
  <text x="45" y="428" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">ATENÇÃO MÉDICA IMEDIATA:</text>
  <text x="45" y="446" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">
    Qualquer déficit neurológico motor novo em paciente com Mieloma Múltiplo deve ser tratado como COMPRESSÃO MEDULAR até prova em contrário (Janela terapêutica de 24-48h para salvar a função motora!).
  </text>
</svg>