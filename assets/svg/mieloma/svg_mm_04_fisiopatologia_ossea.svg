<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad4)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect width="900" height="60" rx="16" fill="#1e3a8a"/>
  <rect y="44" width="900" height="16" fill="#2563eb"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">
    FISIOPATOLOGIA DA LESÃO ÓSSEA: O DESACOPLAMENTO OSTEOCLASTO / OSTEOBLASTO
  </text>

  <!-- Diagrama Central de Fisiopatologia -->
  <!-- Centro: O Plasmócito Neoplásico -->
  <g transform="translate(330, 80)">
    <rect width="240" height="135" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow4)"/>
    <circle cx="50" cy="50" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="50" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">CD138+</text>
    <text x="95" y="45" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">PLASMÓCITO</text>
    <text x="95" y="62" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">MALIGNO</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">Adesão ao estroma medular via</text>
    <text x="20" y="118" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">VLA-4 / VCAM-1 ➔ Citocinas</text>
  </g>

  <!-- Lado Esquerdo: Ativação Osteoclástica -->
  <g transform="translate(30, 160)">
    <rect width="275" height="235" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect width="275" height="34" rx="12" fill="#ef4444"/>
    <rect y="22" width="275" height="12" fill="#ef4444"/>
    <text x="137" y="22" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      1. HIPERATIVAÇÃO OSTEOCLÁSTICA
    </text>

    <text x="15" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Vias Moleculares Ativadoras:</text>
    <text x="15" y="75" font-family="Arial, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold" fill="#dc2626">RANKL</tspan> aumentado (estroma)</text>
    <text x="15" y="93" font-family="Arial, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold" fill="#dc2626">IL-6 e TNF-α</tspan> secretados</text>
    <text x="15" y="111" font-family="Arial, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold" fill="#dc2626">MIP-1α (CCL3)</tspan> quimiotaxia</text>

    <rect x="15" y="125" width="245" height="95" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="122" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">OSTEOCLASTOS GIGANTES</text>
    <text x="122" y="163" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d" text-anchor="middle">Reabsorção óssea descontrolada</text>
    <text x="122" y="181" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d" text-anchor="middle">➔ Liberação maciça de Ca²⁺ no sangue</text>
    <text x="122" y="202" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">HIPERCALCEMIA SEVERA</text>
  </g>

  <!-- Lado Direito: Inibição Osteoblástica -->
  <g transform="translate(595, 160)">
    <rect width="275" height="235" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect width="275" height="34" rx="12" fill="#3b82f6"/>
    <rect y="22" width="275" height="12" fill="#3b82f6"/>
    <text x="137" y="22" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      2. BLOQUEIO OSTEOBLÁSTICO
    </text>

    <text x="15" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Mediadores de Supressão:</text>
    <text x="15" y="75" font-family="Arial, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold" fill="#2563eb">DKK-1</tspan> (Dickkopf-1) inibe Wnt</text>
    <text x="15" y="93" font-family="Arial, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold" fill="#2563eb">Esclerostina</tspan> antagonista Wnt</text>
    <text x="15" y="111" font-family="Arial, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold" fill="#2563eb">IL-7</tspan> inibe maturação celular</text>

    <rect x="15" y="125" width="245" height="95" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="122" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">OSTEOBLASTOS PARALISADOS</text>
    <text x="122" y="163" font-family="Arial, sans-serif" font-size="10.5" fill="#1e3a8a" text-anchor="middle">Nenhum osso novo é formado</text>
    <text x="122" y="181" font-family="Arial, sans-serif" font-size="10.5" fill="#1e3a8a" text-anchor="middle">➔ Sem esclerose reativa em torno</text>
    <text x="122" y="202" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">FOSFATASE ALCALINA NORMAL!</text>
  </g>

  <!-- Setas Conectando o Plasmócito aos Dois Polos -->
  <path d="M 345 150 L 290 195" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="296,188 285,199 299,200" fill="#ef4444"/>
  <text x="280" y="160" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">ESTÍMULO</text>

  <path d="M 555 150 L 610 195" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="601,200 615,199 604,188" fill="#3b82f6"/>
  <text x="575" y="160" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">BLOQUEIO</text>

  <!-- Bloco Inferior: Consequência Radiológica e Clínica -->
  <rect x="30" y="405" width="840" height="58" rx="10" fill="#0f172a"/>
  <text x="45" y="428" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">RESULTADO FINAL NA RADIOLOGIA (LESÕES EM "SACA-BOCADO" / PUNCHED-OUT):</text>
  <text x="45" y="448" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">
    Lesões puramente líticas com bordas finas e recortadas, SEM halo esclerótico reativo (crânio em "sal e pimenta", costelas, pelve e coluna vertebral).
  </text>
</svg>