<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="normGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="neoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
  </defs>

  <!-- Fundo Principal -->
  <rect width="900" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="898" height="478" rx="15" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <rect x="0" y="0" width="900" height="60" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="44" width="900" height="16" fill="#2563eb"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    ORIGEM DOS PLASMÓCITOS: FISIOLOGIA NORMAL vs. CLONE NEOPLÁSICO NO MIELOMA
  </text>

  <!-- Painel Esquerdo: Fisiologia Normal -->
  <g transform="translate(30, 80)">
    <rect width="405" height="375" rx="12" fill="url(#normGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#10b981"/>
    <rect y="26" width="405" height="12" fill="#10b981"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      RESPOSTA HUMORAL FISIOLÓGICA (POLICLONAL)
    </text>

    <!-- Etapa 1: Diferenciação -->
    <rect x="20" y="55" width="365" height="75" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="50" cy="92" r="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="50" y="97" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">LB</text>
    <text x="85" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Linfócito B no Centro Germinativo</text>
    <text x="85" y="96" font-family="Arial, sans-serif" font-size="11" fill="#475569">Sofre hipermutação somática e troca de classe</text>
    <text x="85" y="112" font-family="Arial, sans-serif" font-size="11" fill="#475569">(isótipos IgG, IgA, IgM, etc.) sob estímulo antigênico.</text>

    <!-- Seta para baixo -->
    <path d="M 202 135 L 202 150" stroke="#059669" stroke-width="2" marker-end="none"/>
    <polygon points="198,148 202,156 206,148" fill="#059669"/>

    <!-- Etapa 2: Plasmócitos Fisiológicos -->
    <rect x="20" y="160" width="365" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="50" cy="205" r="22" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="45" cy="205" r="11" fill="#059669" opacity="0.3"/>
    <text x="50" y="209" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#065f46" text-anchor="middle">Plasmó.</text>
    <text x="85" y="182" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Plasmócitos Fisiológicos (&lt; 5% na MO)</text>
    <text x="85" y="200" font-family="Arial, sans-serif" font-size="11" fill="#475569">Morfologia típica: núcleo excêntrico com cromatina em</text>
    <text x="85" y="216" font-family="Arial, sans-serif" font-size="11" fill="#475569">"roda de carroça", halo perinuclear claro (Golgi).</text>
    <text x="85" y="234" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">Fração controlada: vida média regulada por apoptose.</text>

    <!-- Seta para baixo -->
    <path d="M 202 255 L 202 270" stroke="#059669" stroke-width="2"/>
    <polygon points="198,268 202,276 206,268" fill="#059669"/>

    <!-- Etapa 3: Imunoglobulinas Diversas -->
    <rect x="20" y="280" width="365" height="75" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="35" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">Secreção Policlonall Variada (Anticorpos Protetores)</text>
    <text x="35" y="322" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Múltiplos clones secretando IgG, IgA, IgM, κ e λ.</text>
    <text x="35" y="340" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Eletroforese: banda gama de BASE LARGA (imunidade normal).</text>
  </g>

  <!-- Painel Direito: Clone Neoplásico (Mieloma Múltiplo) -->
  <g transform="translate(465, 80)">
    <rect width="405" height="375" rx="12" fill="url(#neoGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect width="405" height="38" rx="12" fill="#dc2626"/>
    <rect y="26" width="405" height="12" fill="#dc2626"/>
    <text x="202" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TRANSFORMAÇÃO MALIGNA: CLONE MONOCLONAL
    </text>

    <!-- Etapa 1: Mutação Primária -->
    <rect x="20" y="55" width="365" height="75" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <circle cx="50" cy="92" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="50" y="97" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">⚡</text>
    <text x="85" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Eventos Oncogenéticos Iniciais</text>
    <text x="85" y="96" font-family="Arial, sans-serif" font-size="11" fill="#475569">Translocações do locus 14q32 (IgH) ou hiperdiploidia.</text>
    <text x="85" y="112" font-family="Arial, sans-serif" font-size="11" fill="#475569">Perda do controle apoptótico: imortalização celular.</text>

    <!-- Seta para baixo -->
    <path d="M 202 135 L 202 150" stroke="#dc2626" stroke-width="2"/>
    <polygon points="198,148 202,156 206,148" fill="#dc2626"/>

    <!-- Etapa 2: Infiltração da Medula -->
    <rect x="20" y="160" width="365" height="90" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <circle cx="50" cy="205" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="50" y="210" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">CD138+</text>
    <text x="85" y="182" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Proliferação Clonal na Medula Óssea (≥ 10%)</text>
    <text x="85" y="200" font-family="Arial, sans-serif" font-size="11" fill="#475569">Expressão aberrante de CD138+ e restrição κ ou λ.</text>
    <text x="85" y="216" font-family="Arial, sans-serif" font-size="11" fill="#475569">Ocupa espaço hematopoético, suprimindo outras linhagens</text>
    <text x="85" y="234" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">Causa citopenias (anemia) e hipogamaglobulinemia normal.</text>

    <!-- Seta para baixo -->
    <path d="M 202 255 L 202 270" stroke="#dc2626" stroke-width="2"/>
    <polygon points="198,268 202,276 206,268" fill="#dc2626"/>

    <!-- Etapa 3: Proteína Monoclonal M -->
    <rect x="20" y="280" width="365" height="75" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="35" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Produção Exclusiva da Proteína Monoclonal (M)</text>
    <text x="35" y="322" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Todas as moléculas idênticas (mesmo isótipo, mesma cadeia leve).</text>
    <text x="35" y="340" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Eletroforese: PICO MONOCLONAL ESTREITO ("Spike" gama/beta).</text>
  </g>
</svg>