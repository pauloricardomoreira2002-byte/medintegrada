<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad7)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Cabeçalho -->
  <rect x="25" y="18" width="850" height="55" rx="10" fill="#1e3a8a" filter="url(#shadow7)"/>
  <text x="450" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    FISIOPATOLOGIA DA OSTEOMIELITE: DO ABSCESSO AO SEQUESTRO CRÔNICO
  </text>
  <text x="450" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#bfdbfe" text-anchor="middle">
    A transição aguda para crônica, biofilme bacteriano, sequestro ósseo, invólucro e fístula
  </text>

  <!-- 4 Fases Cronológicas -->
  <!-- Fase 1: Abscesso Intraósseo Inicial -->
  <g transform="translate(30, 92)" filter="url(#shadow7)">
    <rect width="195" height="255" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="35" rx="10" fill="#2563eb"/>
    <text x="97" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1. ABSCESSO AGUDO</text>

    <text x="12" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">Multiplicação e Edema:</text>
    <text x="12" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Inoculação bacteriana na medula</text>
    <text x="12" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Influxo de neutrófilos e exsudato</text>
    <text x="12" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Trombose dos microvasos sinusóides</text>

    <text x="12" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">Sintomas Clínicos:</text>
    <text x="12" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Dor óssea localizada progressiva</text>
    <text x="12" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• "One finger pain" na metáfise</text>
    <text x="12" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Febre e queda do estado geral</text>

    <rect x="10" y="195" width="175" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="97" y="212" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">⚠️ PEGADINHA DE IMAGEM:</text>
    <text x="97" y="226" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Radiografia NORMAL nas 1ªs</text>
    <text x="97" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#7f1d1d" text-anchor="middle">48h a 10 dias de infecção!</text>
  </g>

  <!-- Fase 2: Abscesso Subperiosteal -->
  <g transform="translate(250, 92)" filter="url(#shadow7)">
    <rect width="195" height="255" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="35" rx="10" fill="#d97706"/>
    <text x="97" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2. PUS SUBPERIOSTEAL</text>

    <text x="12" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#92400e">Drenagem Transcortical:</text>
    <text x="12" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Pus sob pressão perfura córtex</text>
    <text x="12" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Canais de Havers e Volkmann</text>
    <text x="12" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Acúmulo sob o periósteo</text>

    <text x="12" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#92400e">Descolamento do Periósteo:</text>
    <text x="12" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Na criança: periósteo é frouxo</text>
    <text x="12" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Forma grandes coleções</text>
    <text x="12" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#334155">• Rompe os vasos periosteais</text>

    <rect x="10" y="195" width="175" height="48" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="97" y="212" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#b45309" text-anchor="middle">ISQUEMIA DUPLA:</text>
    <text x="97" y="226" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#78350f" text-anchor="middle">Córtex perde sangue por dentro</text>
    <text x="97" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#78350f" text-anchor="middle">(medula) e por fora (periósteo)!</text>
  </g>

  <!-- Fase 3: Necrose e Sequestro Ósseo -->
  <g transform="translate(470, 92)" filter="url(#shadow7)">
    <rect width="195" height="255" rx="10" fill="#fef2f2" stroke="#ea580c" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="35" rx="10" fill="#ea580c"/>
    <text x="97" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3. SEQUESTRO ÓSSEO</text>

    <text x="12" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">Necrose Segmentar Isquêmica:</text>
    <text x="12" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7f1d1d">• Morte dos osteócitos em ~48h</text>
    <text x="12" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7f1d1d">• Fragmento ósseo desvitalizado</text>
    <text x="12" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7f1d1d">• Solta-se do osso são nativo</text>

    <text x="12" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">O Santuário Bacteriano:</text>
    <text x="12" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7f1d1d">• Não possui circulação sanguínea</text>
    <text x="12" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7f1d1d">• ATB não penetra no sequestro</text>
    <text x="12" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#7f1d1d">• Leucócitos não o alcançam</text>

    <rect x="10" y="195" width="175" height="48" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="97" y="212" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">CRONICIDADE DEFINIDA:</text>
    <text x="97" y="226" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Presença de osso necrótico</text>
    <text x="97" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#7f1d1d" text-anchor="middle">= Osteomielite Crônica!</text>
  </g>

  <!-- Fase 4: Invólucro, Cloaca e Fístula -->
  <g transform="translate(685, 92)" filter="url(#shadow7)">
    <rect width="185" height="255" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="35" rx="10" fill="#dc2626"/>
    <text x="92" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4. INVÓLUCRO &amp; CLOACA</text>

    <text x="10" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">O Invólucro (Involucrum):</text>
    <text x="10" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#334155">• Periósteo produz osso novo</text>
    <text x="10" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#334155">• Carcaça que cerca o sequestro</text>

    <text x="10" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">A Cloaca:</text>
    <text x="10" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#334155">• Orifício no invólucro por onde</text>
    <text x="10" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#334155">o pus e restos drenam</text>

    <text x="10" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">A Fístula (Sinus Tract):</text>
    <text x="10" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#334155">• Trajeto até a superfície da pele</text>
    <text x="10" y="182" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#334155">• Drenagem crônica purulenta</text>

    <rect x="8" y="198" width="168" height="45" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="92" y="214" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#991b1b" text-anchor="middle">CONDUTA OBRIGATÓRIA:</text>
    <text x="92" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Remoção Cirúrgica do Sequestro</text>
    <text x="92" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#7f1d1d" text-anchor="middle">+ Desbridamento + ATB Prolongado</text>
  </g>

  <!-- Painel Inferior: O Biofilme Bacteriano -->
  <g transform="translate(30, 360)" filter="url(#shadow7)">
    <rect width="840" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="15" width="400" height="70" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="25" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">O CASTELO PROTETOR: BIOFILME BACTERIANO</text>
    <text x="25" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Bactérias aderidas ao sequestro produzem matriz de polissacarídeos (slime).</text>
    <text x="25" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Bactérias reduzem o metabolismo (estado dormente / persisters).</text>
    <text x="25" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c">• Tornam-se até 1.000x mais resistentes aos antibióticos usuais!</text>

    <rect x="430" y="15" width="395" height="70" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="440" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">ARMA TERAPÊUTICA: RIFAMPICINA EM BIOFILMES</text>
    <text x="440" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• Excelente penetração óssea e capacidade de desestabilizar biofilmes.</text>
    <text x="440" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#065f46">• REGRA DE OURO: NUNCA USAR EM MONOTERAPIA (induz rápida resistência)!</text>
    <text x="440" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• Sempre associar a Quinolona (Levofloxacino) ou Cefalosporina/Vancomicina.</text>
  </g>
</svg>