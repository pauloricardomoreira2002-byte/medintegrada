<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad8)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Cabeçalho -->
  <rect x="25" y="18" width="850" height="55" rx="10" fill="#1e3a8a" filter="url(#shadow8)"/>
  <text x="450" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    CRONOLOGIA E RENDIMENTO DOS MÉTODOS DE IMAGEM NA OSTEOMIELITE
  </text>
  <text x="450" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#bfdbfe" text-anchor="middle">
    A linha do tempo radiológica: sensibilidade precoce da RM versus o falso-negativo inicial do RX
  </text>

  <!-- Tabela Visual de Métodos -->
  <!-- Linha 1: Ressonância Magnética (Exame de Escolha) -->
  <g transform="translate(30, 90)" filter="url(#shadow8)">
    <rect width="840" height="68" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="68" rx="8" fill="#059669"/>
    <text x="85" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RESSONÂNCIA (RM)</text>
    <text x="85" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#d1fae5" text-anchor="middle">EXAME DE ESCOLHA</text>

    <text x="185" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Janela de Alteração: PRECOCE (12 a 24 horas!)</text>
    <text x="185" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">• <tspan font-weight="bold">Mais sensível (90–95%) e mais específico</tspan> no início do quadro infeccioso.</text>
    <text x="185" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">• Mostra com máxima nitidez o edema medular (hipo T1, hiper T2/STIR), abscessos subperiosteais e coleções.</text>

    <rect x="710" y="14" width="115" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="767" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46" text-anchor="middle">PADRÃO-OURO</text>
    <text x="767" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#047857" text-anchor="middle">Sensib: 95% | Espec: 90%</text>
  </g>

  <!-- Linha 2: Cintilografia Óssea (Tecnécio-99m / Gálio) -->
  <g transform="translate(30, 168)" filter="url(#shadow8)">
    <rect width="840" height="68" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="68" rx="8" fill="#2563eb"/>
    <text x="85" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CINTILOGRAFIA</text>
    <text x="85" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#bfdbfe" text-anchor="middle">Tc-99m / Gálio-67</text>

    <text x="185" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Janela de Alteração: Precoce (24 a 48 horas)</text>
    <text x="185" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">• <tspan font-weight="bold">Altamente sensível, porém POUCO ESPECÍFICA</tspan> (qualquer trauma, cirurgia ou tumor capta).</text>
    <text x="185" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">• Indicação principal: Quando há contraindicação formal à RM (ex: próteses metálicas incompatíveis).</text>

    <rect x="710" y="14" width="115" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="767" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e40af" text-anchor="middle">MUITO SENSÍVEL</text>
    <text x="767" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#1d4ed8" text-anchor="middle">Baixa Especificidade</text>
  </g>

  <!-- Linha 3: Ultrassonografia (USG) -->
  <g transform="translate(30, 246)" filter="url(#shadow8)">
    <rect width="840" height="68" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="68" rx="8" fill="#d97706"/>
    <text x="85" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ULTRASSONOGRAFIA</text>
    <text x="85" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fde68a" text-anchor="middle">USG EM PEDIATRIA</text>

    <text x="185" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Janela de Alteração: Precoce (48 a 72 horas em crianças)</text>
    <text x="185" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">• <tspan font-weight="bold">Excelente para crianças e lactentes:</tspan> identifica derrame articular e abscesso subperiosteal.</text>
    <text x="185" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">• Papel crucial: Não emite radiação e permite guiar a agulha de punção e aspiração com segurança.</text>

    <rect x="710" y="14" width="115" height="40" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="767" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">GUIA DE PUNÇÃO</text>
    <text x="767" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#78350f" text-anchor="middle">Coleções fluidas</text>
  </g>

  <!-- Linha 4: Radiografia Simples (RX) e Tomografia (TC) -->
  <g transform="translate(30, 324)" filter="url(#shadow8)">
    <rect width="840" height="68" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="68" rx="8" fill="#dc2626"/>
    <text x="85" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RADIOGRAFIA (RX)</text>
    <text x="85" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fecaca" text-anchor="middle">FALSO-NEGATIVO AGUDO</text>

    <text x="185" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Janela de Alteração: TARDIA (10 a 14 dias de atraso!)</text>
    <text x="185" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e293b">• <tspan font-weight="bold">O osso precisa perder de 30 a 50% de cálcio</tspan> para que a lesão lítica apareça no RX comum.</text>
    <text x="185" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">• Sinais tardios: Reação periosteal (periostite), rarefação óssea e imagem do sequestro na fase crônica.</text>

    <rect x="710" y="14" width="115" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="767" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">NORMAL INICIAL</text>
    <text x="767" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#7f1d1d" text-anchor="middle">Não exclui osteomielite!</text>
  </g>

  <!-- Rodapé Resumo de Prova -->
  <g transform="translate(30, 402)" filter="url(#shadow8)">
    <rect width="840" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="420" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
      REGRA DE OURO PARA QUESTÕES DE PROVA:
    </text>
    <text x="420" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155" text-anchor="middle">
      Suspeita de Osteomielite Aguda + Radiografia Normal = <tspan font-weight="bold" fill="#059669">Solicitar IMEDIATAMENTE Ressonância Magnética (RM)!</tspan> Nunca aguardar 14 dias para confirmar no RX.
    </text>
  </g>
</svg>