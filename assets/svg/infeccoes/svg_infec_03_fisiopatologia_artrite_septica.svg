<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad3)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Cabeçalho -->
  <rect x="25" y="18" width="850" height="55" rx="10" fill="#1e3a8a" filter="url(#shadow3)"/>
  <text x="450" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    FISIOPATOLOGIA DA ARTRITE SÉPTICA: A CASCATA DESTRUTIVA EM 24-48 HORAS
  </text>
  <text x="450" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#bfdbfe" text-anchor="middle">
    Mecanismos moleculares, liberação enzimática neutrofílica, aumento de pressão e necrose condral
  </text>

  <!-- 4 Etapas Horizontais -->
  <!-- Etapa 1 -->
  <g transform="translate(30, 95)" filter="url(#shadow3)">
    <rect width="195" height="240" rx="10" fill="url(#stepGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="35" rx="10" fill="#2563eb"/>
    <text x="97" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1. INVASÃO &amp; COLONIZAÇÃO</text>
    
    <text x="12" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">Disseminação:</text>
    <text x="12" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Hematogênica (80%)</text>
    <text x="12" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Inoculação direta / trauma</text>
    <text x="12" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Contiguidade óssea</text>

    <text x="12" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">Depósito Sinovial:</text>
    <text x="12" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Adesão aos sinoviócitos</text>
    <text x="12" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Formação inicial de biofilme</text>
    <text x="12" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Proliferação no líquido</text>

    <rect x="10" y="185" width="175" height="45" rx="6" fill="#eff6ff"/>
    <text x="97" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle">FASE INICIAL</text>
    <text x="97" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle">0 a 6 horas</text>
  </g>

  <!-- Seta 1 -->
  <path d="M 230 215 L 245 215" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Etapa 2 -->
  <g transform="translate(250, 95)" filter="url(#shadow3)">
    <rect width="195" height="240" rx="10" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="35" rx="10" fill="#d97706"/>
    <text x="97" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2. RESPOSTA INFLAMATÓRIA</text>
    
    <text x="12" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">Quimiotaxia Brutal:</text>
    <text x="12" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Recrutamento neutrofílico</text>
    <text x="12" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• PMN &gt; 90% no líquido</text>
    <text x="12" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Fagocitose e lise bacteriana</text>

    <text x="12" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">Tempestade de Citocinas:</text>
    <text x="12" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• TNF-α, IL-1β e IL-6</text>
    <text x="12" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Aumento da perm. capilar</text>
    <text x="12" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Exsudato serofibrinoso</text>

    <rect x="10" y="185" width="175" height="45" rx="6" fill="#fffbeb"/>
    <text x="97" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#b45309" text-anchor="middle">INFLAMAÇÃO AGUDA</text>
    <text x="97" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#92400e" text-anchor="middle">6 a 12 horas</text>
  </g>

  <!-- Etapa 3 -->
  <g transform="translate(470, 95)" filter="url(#shadow3)">
    <rect width="195" height="240" rx="10" fill="url(#stepGrad)" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="35" rx="10" fill="#ea580c"/>
    <text x="97" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3. TAMPONAMENTO &amp; ENZIMAS</text>
    
    <text x="12" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#c2410c">Pressão Intra-articular:</text>
    <text x="12" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Acúmulo maciço de pus</text>
    <text x="12" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Colabamento dos capilares</text>
    <text x="12" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Isquemia sinovial e condral</text>

    <text x="12" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#c2410c">Liberação Enzimática:</text>
    <text x="12" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Elastase e Colagenases</text>
    <text x="12" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Metaloproteinases (MMPs)</text>
    <text x="12" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Digestão de proteoglicanos</text>

    <rect x="10" y="185" width="175" height="45" rx="6" fill="#fff7ed"/>
    <text x="97" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#c2410c" text-anchor="middle">FASE CRÍTICA</text>
    <text x="97" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9a3412" text-anchor="middle">12 a 24 horas</text>
  </g>

  <!-- Etapa 4 -->
  <g transform="translate(685, 95)" filter="url(#shadow3)">
    <rect width="185" height="240" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="35" rx="10" fill="#dc2626"/>
    <text x="92" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">4. DESTRUIÇÃO IRREVERSÍVEL</text>
    
    <text x="12" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">Perda Estrutural:</text>
    <text x="12" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Morte dos condrócitos (100%)</text>
    <text x="12" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Dano ao osso subcondral (80%)</text>
    <text x="12" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Fibrose e anquilose óssea</text>

    <text x="12" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">Desfechos Clínicos:</text>
    <text x="12" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Perda funcional permanente (60%)</text>
    <text x="12" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Artrodese / Prótese total</text>
    <text x="12" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Risco de choque séptico</text>

    <rect x="10" y="185" width="165" height="45" rx="6" fill="#fee2e2"/>
    <text x="82" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#b91c1c" text-anchor="middle">ESTÁGIO NÃO REVERSÍVEL</text>
    <text x="82" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#7f1d1d" text-anchor="middle">24 a 48 HORAS!</text>
  </g>

  <!-- Banner Inferior de Resumo Fisiopatológico -->
  <g transform="translate(30, 355)" filter="url(#shadow3)">
    <rect width="840" height="105" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <rect x="15" y="15" width="395" height="75" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="25" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">POR QUE A CARTILAGEM É DESTRUÍDA TÃO RÁPIDO?</text>
    <text x="25" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">1. Cartilagem é avascular: não recebe aporte imune nem se regenera.</text>
    <text x="25" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">2. Proteases lisossomais dos neutrófilos digerem colágeno e matriz.</text>
    <text x="25" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">3. Toxinas bacterianas (ex: α-hemolisina de S. aureus) lisam condrócitos.</text>

    <rect x="425" y="15" width="400" height="75" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="435" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">IMPLICAÇÃO CLÍNICA MANDATÓRIA (CONDUTA):</text>
    <text x="435" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#047857">• "Antibiótico sozinho NÃO basta": Drenagem articular imediata!</text>
    <text x="435" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• A artrocentese ou artroscopia reduz a pressão intra-articular e evacua</text>
    <text x="435" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">as proteases e restos necróticos antes do colapso tecidual.</text>
  </g>
</svg>