<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad5)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Cabeçalho -->
  <rect x="25" y="18" width="850" height="55" rx="10" fill="#1e3a8a" filter="url(#shadow5)"/>
  <text x="450" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    ARTRITE SÉPTICA PEDIÁTRICA: POSTURA DO QUADRIL &amp; CRITÉRIOS DE KOCHER
  </text>
  <text x="450" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#bfdbfe" text-anchor="middle">
    A biomecânica da posição antálgica ("foge da dor") e a estratificação preditiva de probabilidade
  </text>

  <!-- Lado Esquerdo: Biomecânica da Posição Antálgica -->
  <g transform="translate(30, 92)" filter="url(#shadow5)">
    <rect width="395" height="365" rx="12" fill="url(#cardGrad5)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="0" y="0" width="395" height="42" rx="12" fill="#1d4ed8"/>
    <text x="197" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      A POSTURA ANTÁLGICA DO QUADRIL
    </text>

    <!-- Posição Tríplice -->
    <g transform="translate(15, 55)">
      <rect width="365" height="95" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="12" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Posição Clássica ("Foge da Dor"):</text>
      <text x="25" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">1. FLEXÃO (~30° a 45°)</text>
      <text x="25" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">2. ABDUÇÃO</text>
      <text x="25" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">3. ROTAÇÃO EXTERNA</text>
    </g>

    <!-- Por que dessa posição exata? -->
    <g transform="translate(15, 160)">
      <rect width="365" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Por que essa posição exata? (Racional Anatômico):</text>
      <text x="12" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• É a postura em que a <tspan font-weight="bold">cápsula articular atinge seu volume máximo</tspan>.</text>
      <text x="12" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Nessa configuração geométrica, a <tspan font-weight="bold">pressão intra-articular é mínima</tspan>.</text>
      <text x="12" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Qualquer extensão, adução ou rotação interna comprime o pus</text>
      <text x="12" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">contra os nociceptores capsulares, gerando dor intolerável.</text>
      <text x="12" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#dc2626">• Choro vigoroso da criança a qualquer mobilização passiva!</text>
    </g>

    <!-- Apresentação na Criança -->
    <g transform="translate(15, 280)">
      <rect width="365" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">Sinais de Alerta no Lactente e Criança:</text>
      <text x="12" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Recusa completa de deambular ou claudicação súbita</text>
      <text x="12" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• "Pseudoparalisia" (o membro fica imóvel e fletido)</text>
      <text x="12" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Irritabilidade e choro incoercível à troca de fraldas</text>
    </g>
  </g>

  <!-- Lado Direito: Os Critérios de Kocher -->
  <g transform="translate(455, 92)" filter="url(#shadow5)">
    <rect width="415" height="365" rx="12" fill="url(#cardGrad5)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="415" height="42" rx="12" fill="#d97706"/>
    <text x="207" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CRITÉRIOS DE KOCHER (DIFERENCIAÇÃO CLÍNICA)
    </text>

    <!-- Os 4 Critérios Principais -->
    <g transform="translate(15, 52)">
      <rect width="385" height="105" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Os 4 Parâmetros Canônicos de Kocher:</text>
      <text x="12" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">1. <tspan font-weight="bold">Febre &gt; 38,5 °C</tspan> no início do quadro</text>
      <text x="12" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">2. <tspan font-weight="bold">Incapacidade de apoiar o membro</tspan> (não deambula)</text>
      <text x="12" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">3. <tspan font-weight="bold">VHS &gt; 40 mm/h</tspan></text>
      <text x="12" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">4. <tspan font-weight="bold">Leucócitos séricos &gt; 12.000 /mm³</tspan></text>
      <text x="12" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#059669">+ Refinador Moderno: <tspan font-weight="bold">PCR &gt; 20 mg/L</tspan> eleva a acurácia diagnóstica!</text>
    </g>

    <!-- Estratificação de Risco (Probabilidade) -->
    <g transform="translate(15, 165)">
      <rect width="385" height="185" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="192" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">ESTRATIFICAÇÃO E PROBABILIDADE DE ARTRITE SÉPTICA</text>

      <!-- Barra 0 Critérios -->
      <g transform="translate(15, 32)">
        <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#475569">0 Critérios:</text>
        <rect x="85" y="2" width="20" height="16" rx="3" fill="#10b981"/>
        <text x="115" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#059669">&lt; 0,2% (Sinovite Transitória muito provável)</text>
      </g>

      <!-- Barra 1 Critério -->
      <g transform="translate(15, 58)">
        <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#475569">1 Critério:</text>
        <rect x="85" y="2" width="35" height="16" rx="3" fill="#3b82f6"/>
        <text x="130" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">~ 3% de probabilidade</text>
      </g>

      <!-- Barra 2 Critérios -->
      <g transform="translate(15, 84)">
        <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#475569">2 Critérios:</text>
        <rect x="85" y="2" width="95" height="16" rx="3" fill="#f59e0b"/>
        <text x="190" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#d97706">~ 40% (Zona cinzenta / Investigar)</text>
      </g>

      <!-- Barra 3 Critérios -->
      <g transform="translate(15, 110)">
        <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#475569">3 Critérios:</text>
        <rect x="85" y="2" width="180" height="16" rx="3" fill="#ea580c"/>
        <text x="275" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">~ 93% (Artrocentese Urgente!)</text>
      </g>

      <!-- Barra 4 Critérios -->
      <g transform="translate(15, 136)">
        <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#475569">4 Critérios:</text>
        <rect x="85" y="2" width="220" height="16" rx="3" fill="#dc2626"/>
        <text x="315" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">&gt; 99% (Drenagem Cirúrgica!)</text>
      </g>

      <rect x="15" y="158" width="355" height="20" rx="4" fill="#fef2f2"/>
      <text x="192" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#991b1b" text-anchor="middle">Principal diagnóstico diferencial: Sinovite Transitória do Quadril (benigna, autolimitada)</text>
    </g>
  </g>
</svg>