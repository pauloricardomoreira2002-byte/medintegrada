<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="gonoCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="naoGonoCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad4)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Cabeçalho -->
  <rect x="25" y="18" width="850" height="55" rx="10" fill="#1e3a8a" filter="url(#shadow4)"/>
  <text x="450" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">
    ARTRITE GONOCÓCICA vs. ARTRITE NÃO-GONOCÓCICA
  </text>
  <text x="450" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#bfdbfe" text-anchor="middle">
    Quadro clínico comparativo, perfil etiológico, rendimento laboratorial e estratégias terapêuticas
  </text>

  <!-- Lado Esquerdo: Artrite Gonocócica -->
  <g transform="translate(30, 92)" filter="url(#shadow4)">
    <rect width="405" height="365" rx="12" fill="url(#gonoCard)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="405" height="42" rx="12" fill="#2563eb"/>
    <text x="202" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ARTRITE GONOCÓCICA (N. gonorrhoeae)
    </text>

    <!-- Perfil -->
    <g transform="translate(15, 52)">
      <rect width="375" height="48" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Perfil Epidemiológico Típico</text>
      <text x="12" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">• Adulto jovem sexualmente ativo (18 a 35 anos) | Mulheres 3–4x mais</text>
      <text x="12" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">• Risco na 1ª semana pós-menstruação, gravidez e pós-parto</text>
    </g>

    <!-- Apresentação Clínica: Tríade -->
    <g transform="translate(15, 108)">
      <rect width="375" height="92" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Quadro Clínico Bimodal</text>
      <text x="12" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">A) Síndrome Artrite-Dermatite (Tríade Clássica):</text>
      <text x="20" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">1. <tspan font-weight="bold">Tenossinovite</tspan> exuberante de punhos, tornozelos e dedos</text>
      <text x="20" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">2. <tspan font-weight="bold">Poliartralgia migratória</tspan> assimétrica (múltiplas articulações)</text>
      <text x="20" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">3. <tspan font-weight="bold">Lesões cutâneas:</tspan> pústulas com halo eritematoso em extremidades</text>
      <text x="12" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569"><tspan font-weight="bold">B) Monoartrite Purulenta:</tspan> joelho ou punho (menos lesões de pele)</text>
    </g>

    <!-- Diagnóstico Microbiológico -->
    <g transform="translate(15, 208)">
      <rect width="375" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Pegadinha Laboratorial (Sensibilidade)</text>
      <text x="12" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e3a8a">• <tspan font-weight="bold">Cultura do Líquido Sinovial:</tspan> frequentemente <tspan font-weight="bold" fill="#dc2626">NEGATIVA (25–50%)</tspan></text>
      <text x="12" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#1e3a8a">• <tspan font-weight="bold">Bacterioscopia (Gram do LS):</tspan> positiva em apenas 25%</text>
      <text x="12" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#047857">• Diagnóstico de Escolha: NAAT / PCR e cultura em mucosas (cérvice/uretra/faringe)</text>
    </g>

    <!-- Tratamento e Prognóstico -->
    <g transform="translate(15, 286)">
      <rect width="375" height="65" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Tratamento &amp; Desfecho</text>
      <text x="12" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• <tspan font-weight="bold">Ceftriaxona 1g EV a cada 24h</tspan> (duração: 7 a 14 dias)</text>
      <text x="12" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#047857">• Resposta clínica rápida (24–48h) | Rastrear outras ISTs e parceiros</text>
      <text x="12" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#065f46">• Prognóstico: EXCELENTE (raro causar destruição permanente)</text>
    </g>
  </g>

  <!-- Lado Direito: Artrite Não-Gonocócica -->
  <g transform="translate(465, 92)" filter="url(#shadow4)">
    <rect width="405" height="365" rx="12" fill="url(#naoGonoCard)" stroke="#e11d48" stroke-width="2"/>
    <rect x="0" y="0" width="405" height="42" rx="12" fill="#be123c"/>
    <text x="202" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ARTRITE NÃO-GONOCÓCICA (S. aureus e outros)
    </text>

    <!-- Perfil -->
    <g transform="translate(15, 52)">
      <rect width="375" height="48" rx="8" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#9f1239">Perfil Epidemiológico Típico</text>
      <text x="12" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1e293b">• Idosos (&gt; 65 anos), crianças &lt; 5 anos, imunodeprimidos, diabéticos</text>
      <text x="12" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">• Presença de artropatia prévia (artrite reumatoide, artrose, próteses)</text>
    </g>

    <!-- Apresentação Clínica -->
    <g transform="translate(15, 108)">
      <rect width="375" height="92" rx="8" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#9f1239">Quadro Clínico Clássico</text>
      <text x="12" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#be123c">• Monoartrite Aguda Grave (80% dos casos):</text>
      <text x="20" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• <tspan font-weight="bold">Joelho acometido em &gt; 50%</tspan> &gt; Ombro (18%) &gt; Tornozelo (14%) &gt; Quadril</text>
      <text x="20" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Dor lancinante em repouso e à palpação, calor, rubor, edema maciço</text>
      <text x="20" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Bloqueio articular completo (impotência funcional total)</text>
      <text x="20" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#334155">• Febre alta com calafrios (pode faltar no idoso e imunodeprimido!)</text>
    </g>

    <!-- Diagnóstico Microbiológico -->
    <g transform="translate(15, 208)">
      <rect width="375" height="70" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#9f1239">Rendimento Microbiológico Alto</text>
      <text x="12" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#881337">• <tspan font-weight="bold">Gram do Líquido Sinovial:</tspan> positivo em 50 a 70%</text>
      <text x="12" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#881337">• <tspan font-weight="bold">Cultura do Líquido Sinovial:</tspan> positiva em <tspan font-weight="bold" fill="#059669">70 a 90%</tspan> (padrão-ouro)</text>
      <text x="12" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#881337">• <tspan font-weight="bold">Hemoculturas:</tspan> positivas em 50% (coletar 2 pares antes do ATB!)</text>
    </g>

    <!-- Tratamento e Prognóstico -->
    <g transform="translate(15, 286)">
      <rect width="375" height="65" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Tratamento &amp; Prognóstico Grave</text>
      <text x="12" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• <tspan font-weight="bold">ATB prolongado:</tspan> 3 a 4 semanas (Vancomicina + Ceftriaxona inicial)</text>
      <text x="12" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c">• DRENAGEM CIRÚRGICA MANDATÓRIA (Artroscopia / Artrotomia / Punções)</text>
      <text x="12" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#7f1d1d">• Prognóstico: 50% evoluem com sequela e perda funcional articular!</text>
    </g>
  </g>
</svg>