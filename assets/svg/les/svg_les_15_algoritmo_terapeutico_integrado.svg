<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    ALGORITMO TERAPÊUTICO INTEGRADO DO LES
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    A pedra angular universal (Hidroxicloroquina), estratificação por gravidade e terapia de indução/manutenção
  </text>

  <!-- Pilar 1: Para TODOS os pacientes -->
  <g transform="translate(35, 90)" filter="url(#dropShadow)">
    <rect width="830" height="60" rx="8" fill="#059669"/>
    <text x="415" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      PEDRA ANGULAR OBRIGATÓRIA PARA 100% DOS PACIENTES COM LES
    </text>
    <text x="415" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">
      <tspan font-weight="bold" fill="#facc15">HIDROXICLOROQUINA</tspan> (dose ≤ 5 mg/kg/dia de peso real) + FOTOPROTEÇÃO RIGOROSA DIÁRIA
    </text>
  </g>

  <!-- 3 Níveis de Gravidade -->
  <!-- Nível Leve -->
  <g transform="translate(35, 160)" filter="url(#dropShadow)">
    <rect width="265" height="235" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="35" rx="10" fill="#059669"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      DOENÇA LEVE
    </text>
    <text x="15" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Manifestações:</text>
    <text x="15" y="73" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Fadiga, artralgias leves</text>
    <text x="15" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Lúpus cutâneo limitado</text>
    <text x="15" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Sem dano de órgão nobre</text>

    <rect x="12" y="120" width="241" height="100" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#047857">Conduta Farmacológica:</text>
    <text x="20" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• Hidroxicloroquina plena</text>
    <text x="20" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• AINEs em cursos curtos</text>
    <text x="20" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• Corticoide tópico (pele)</text>
    <text x="20" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#059669">• Prednisona oral ≤ 7,5 mg/dia</text>
  </g>

  <!-- Nível Moderado -->
  <g transform="translate(318, 160)" filter="url(#dropShadow)">
    <rect width="265" height="235" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="35" rx="10" fill="#d97706"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      DOENÇA MODERADA
    </text>
    <text x="15" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">Manifestações:</text>
    <text x="15" y="73" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Artrite inflamatória refratária</text>
    <text x="15" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Lúpus cutâneo extenso</text>
    <text x="15" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Serosites leves (pleurite/peric)</text>

    <rect x="12" y="120" width="241" height="100" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="20" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b45309">Conduta Farmacológica:</text>
    <text x="20" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• Prednisona 0,5 mg/kg/dia</text>
    <text x="20" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• <tspan font-weight="bold">Metotrexato</tspan> ou <tspan font-weight="bold">Azatioprina</tspan></text>
    <text x="20" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• <tspan font-weight="bold">Belimumabe</tspan> (anti-BLyS)</text>
    <text x="20" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#b45309">Desmame precoce do corticoide</text>
  </g>

  <!-- Nível Grave -->
  <g transform="translate(600, 160)" filter="url(#dropShadow)">
    <rect width="265" height="235" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="35" rx="10" fill="#dc2626"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
      DOENÇA GRAVE / RISCO DE VIDA
    </text>
    <text x="15" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Manifestações:</text>
    <text x="15" y="73" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Nefrite Lúpica III/IV</text>
    <text x="15" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• SNC (psicose/convulsão/mielite)</text>
    <text x="15" y="107" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Hemorragia alveolar / AHAI grave</text>

    <rect x="12" y="120" width="241" height="100" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="20" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Indução Agressiva:</text>
    <text x="20" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">• Pulsoterapia Metilprednisolona</text>
    <text x="20" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• <tspan font-weight="bold">MMF</tspan> ou <tspan font-weight="bold">Ciclofosfamida</tspan> EV</text>
    <text x="20" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">• <tspan font-weight="bold">Rituximabe</tspan> / Terapia Alvo</text>
    <text x="20" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#991b1b">Manutenção por 3 a 5 anos</text>
  </g>

  <!-- Banner Inferior de Metas de Tratamento -->
  <g transform="translate(35, 405)">
    <rect width="830" height="60" rx="8" fill="#1e293b"/>
    <text x="415" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      ALVO TERAPÊUTICO (TREAT-TO-TARGET): REMISSÃO OU BAIXA ATIVIDADE DE DOENÇA (LLDAS)
    </text>
    <text x="415" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle">
      Meta: Ausência de novos danos de órgãos + Prednisona ≤ 5 mg/dia + Redução de efeitos colaterais das drogas.
    </text>
  </g>
</svg>