<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    MECANISMOS DE HIPERSENSIBILIDADE TIPO III E TIPO II NO LES
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    Deposição de imunocomplexos nas paredes vasculares e destruição citotóxica direta de células sanguíneas
  </text>

  <!-- Lado Esquerdo: Hipersensibilidade Tipo III (Imunocomplexos) -->
  <g transform="translate(35, 95)" filter="url(#dropShadow)">
    <rect width="400" height="360" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="40" rx="12" fill="#dc2626"/>
    <text x="200" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TIPO III: IMUNOCOMPLEXOS &amp; COMPLEMENTO (80% DAS LESÕES)
    </text>

    <!-- Esquema do Vaso e Depósito -->
    <rect x="20" y="55" width="360" height="110" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <text x="35" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#be123c">
      Vaso Sanguíneo / Parede Glomerular:
    </text>
    
    <!-- Desenho didático: Endotélio -->
    <rect x="35" y="85" width="330" height="10" rx="2" fill="#fda4af"/>
    <text x="370" y="93" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9f1239">Endotélio</text>
    
    <!-- Aglomerados de Imunocomplexos -->
    <circle cx="80" cy="112" r="9" fill="#3b82f6"/>
    <circle cx="95" cy="112" r="9" fill="#ef4444"/>
    <circle cx="87" cy="122" r="9" fill="#3b82f6"/>
    <text x="115" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">
      Imunocomplexo (DNA + IgG)
    </text>

    <text x="35" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">
      Depositam-se em áreas de alta pressão hidrostática (glomérulo, pele, sinóvia).
    </text>

    <!-- Cascata Inflamatória -->
    <rect x="20" y="175" width="360" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="35" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">
      Ativação da Via Clássica do Complemento:
    </text>
    <text x="35" y="213" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      1. C1q liga-se à porção Fc do anticorpo → Consumo de C4 e C3
    </text>
    <text x="35" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      2. Clivagem de anafilatoxinas: <tspan font-weight="bold" fill="#dc2626">C3a e C5a</tspan> aumentam permeabilidade
    </text>
    <text x="35" y="248" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      3. Atração maciça de Neutrófilos com liberação de enzimas e EROs
    </text>

    <!-- Desfecho Clínico -->
    <rect x="20" y="275" width="360" height="70" rx="8" fill="#1e293b"/>
    <text x="200" y="297" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#f87171" text-anchor="middle">
      MANIFESTAÇÕES CLÍNICAS TÍPICAS TIPO III:
    </text>
    <text x="200" y="316" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle">
      Nefrite Lúpica • Vasculite Cutânea • Pleurite • Pericardite
    </text>
    <text x="200" y="333" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#cbd5e1" text-anchor="middle">
      Marcador laboratorial fiel: Consumo sérico de C3 e C4 na crise ativa!
    </text>
  </g>

  <!-- Lado Direito: Hipersensibilidade Tipo II (Citotóxica) -->
  <g transform="translate(465, 95)" filter="url(#dropShadow)">
    <rect width="400" height="360" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="40" rx="12" fill="#2563eb"/>
    <text x="200" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TIPO II: CITOTOXICIDADE POR AUTOANTICORPOS DIRETOS
    </text>

    <rect x="20" y="55" width="360" height="110" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="35" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">
      Ligação Direta à Membrana de Células Sanguíneas:
    </text>
    
    <circle cx="70" cy="115" r="20" fill="#ef4444"/>
    <text x="70" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Hemácia</text>
    
    <text x="105" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">
      Anticorpo Anti-Eritrócito (IgG)
    </text>
    <text x="105" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">
      Fixa-se nos antígenos da membrana celular.
    </text>
    <text x="105" y="139" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e3a8a">
      → Teste de Coombs Direto Positivo!
    </text>

    <!-- Destruição -->
    <rect x="20" y="175" width="360" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="35" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">
      Mecanismos de Lise e Depuração:
    </text>
    <text x="35" y="213" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      1. Opsonização por IgG e C3b → Fagocitose esplênica (extravascular)
    </text>
    <text x="35" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      2. Ativação do Complexo de Ataque à Membrana (MAC C5b-9)
    </text>
    <text x="35" y="248" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      3. Anticorpos antiplaquetários induzem remoção no baço
    </text>

    <!-- Desfecho Clínico -->
    <rect x="20" y="275" width="360" height="70" rx="8" fill="#1e293b"/>
    <text x="200" y="297" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#60a5fa" text-anchor="middle">
      MANIFESTAÇÕES CLÍNICAS TÍPICAS TIPO II:
    </text>
    <text x="200" y="316" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle">
      Anemia Hemolítica Autoimune • Trombocitopenia • Leucopenia
    </text>
    <text x="200" y="333" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#cbd5e1" text-anchor="middle">
      Responde prontamente à imunossupressão e pulsoterapia com corticoide.
    </text>
  </g>
</svg>