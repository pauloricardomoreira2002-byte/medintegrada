<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    EPIDEMIOLOGIA &amp; PERFIL CLÍNICO-DEMOGRÁFICO DO LES
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    Distribuição por sexo, faixa etária, etnia e comparação entre formas pediátrica e senil
  </text>

  <!-- 3 Cartões Centrais -->
  <!-- Coluna 1: Relação Sexual e Hormonal -->
  <g transform="translate(35, 95)" filter="url(#dropShadow)">
    <rect width="265" height="215" rx="10" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="35" rx="10" fill="#2563eb"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PREDOMÍNIO FEMININO</text>
    
    <text x="132" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="bold" fill="#1e3a8a" text-anchor="middle">9 a 10 : 1</text>
    <text x="132" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">Mulheres : Homens</text>
    
    <rect x="15" y="105" width="235" height="95" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="25" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">• Pico: 2ª e 3ª Décadas de Vida</text>
    <text x="25" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Idade fértil (15 aos 45 anos).</text>
    <text x="25" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">• Papel do Estrogênio</text>
    <text x="25" y="178" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Estimula sobrevivência de células B.</text>
    <text x="25" y="193" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#64748b">Na infância/idoso, proporção cai para 3:1.</text>
  </g>

  <!-- Coluna 2: Predisposição Racial -->
  <g transform="translate(318, 95)" filter="url(#dropShadow)">
    <rect width="265" height="215" rx="10" fill="url(#purpleGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="35" rx="10" fill="#7c3aed"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">DISTRIBUIÇÃO ÉTNICA</text>

    <text x="132" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">NEGROS &gt; HISPÂNICOS &gt; BRANCOS</text>

    <rect x="15" y="80" width="235" height="120" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="25" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">• População Negra:</text>
    <text x="25" y="119" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Prevalência 3 a 4x maior.</text>
    <text x="25" y="137" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Início mais precoce e agressivo.</text>
    <text x="25" y="157" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">• Maior Risco de Nefrite Lúpica:</text>
    <text x="25" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Insuficiência renal terminal mais comum.</text>
    <text x="25" y="191" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#64748b">Menor resposta a alguns imunossupressores.</text>
  </g>

  <!-- Coluna 3: Agregação Familiar -->
  <g transform="translate(600, 95)" filter="url(#dropShadow)">
    <rect width="265" height="215" rx="10" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="35" rx="10" fill="#d97706"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">HERDABILIDADE &amp; FAMÍLIA</text>

    <text x="132" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="bold" fill="#b45309" text-anchor="middle">10 a 20%</text>
    <text x="132" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">História Familiar Positiva</text>

    <rect x="15" y="105" width="235" height="95" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="25" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">• Gêmeos Monozigóticos:</text>
    <text x="25" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Concordância elevada (25 a 40%).</text>
    <text x="25" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">• Familiares Assintomáticos:</text>
    <text x="25" y="178" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Maior frequência de FAN e hipergama.</text>
    <text x="25" y="193" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#64748b">Deficiências congênitas de C1q, C2 e C4.</text>
  </g>

  <!-- Banner Inferior: Pediátrico vs Idoso (Pegadinha de Prova) -->
  <g transform="translate(35, 325)" filter="url(#dropShadow)">
    <rect width="830" height="135" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="830" height="32" rx="10" fill="#1e3a8a"/>
    <text x="415" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ⚠️ COMPARATIVO DE EXTREMOS DE IDADE: PEDIÁTRICO vs. IDOSO (FOCO EM PROVA)
    </text>

    <!-- Subdivisão Esquerda: Pediátrico -->
    <rect x="15" y="42" width="390" height="80" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="25" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">LÚPUS PEDIÁTRICO (&lt;16 anos) — "Mais Agressivo":</text>
    <text x="25" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7f1d1d">• Alta frequência de Nefrite Lúpica grave (proliferativa difusa)</text>
    <text x="25" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7f1d1d">• Manifestações hematológicas severas (plaquetopenia, anemia hemolítica)</text>
    <text x="25" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7f1d1d">• Alta taxa de pericardite e lesões cutâneas agudas floridas</text>

    <!-- Subdivisão Direita: Idoso -->
    <rect x="425" y="42" width="390" height="80" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="435" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">LÚPUS DE INÍCIO TARDIO / IDOSO (&gt;50 anos) — "Mais Insidioso":</text>
    <text x="435" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e3a8a">• Predomínio de envolvimento pulmonar (pleurite/fibrose) e serosites</text>
    <text x="435" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e3a8a">• MENOR frequência de Nefrite Lúpica e lesões mucocutâneas clássicas</text>
    <text x="435" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e3a8a">• MENOR acometimento neuropsiquiátrico severo; sintomas constitucionais arrastados</text>
  </g>
</svg>