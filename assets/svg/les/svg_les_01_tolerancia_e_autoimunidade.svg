<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    TOLERÂNCIA IMUNOLÓGICA vs. AUTOIMUNIDADE NO LES
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    Fisiologia do reconhecimento do "próprio" e o colapso imunológico crônico multissistêmico
  </text>

  <!-- Lado Esquerdo: Fisiologia Normal -->
  <g transform="translate(35, 95)" filter="url(#dropShadow)">
    <rect width="395" height="360" rx="12" fill="url(#greenGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="395" height="42" rx="12" fill="#059669"/>
    <text x="197" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TOLERÂNCIA IMUNE NORMAL (Fisiológico)
    </text>

    <!-- Card 1 -->
    <rect x="18" y="55" width="359" height="85" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="45" cy="97" r="14" fill="#10b981"/>
    <text x="45" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="70" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#065f46">Tolerância Central e Periférica</text>
    <text x="70" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#047857">• Timo e Medula Óssea eliminam clones autorreativos</text>
    <text x="70" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#047857">• Anergia e deleção na periferia se houver escape</text>
    <text x="70" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#0f766e">• Linfócitos T Reguladores (Treg) ativos e vigilantes</text>

    <!-- Card 2 -->
    <rect x="18" y="150" width="359" height="95" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="30" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#047857">Clearance Eficaz de Apoptose (O Faxineiro):</text>
    <text x="30" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Macrófagos fagocitam células mortas rapidamente</text>
    <text x="30" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Antígenos nucleares (DNA, histonas) NÃO são expostos</text>
    <text x="30" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#059669">• Ausência de sinal inflamatório persistente</text>

    <!-- Desfecho Verde -->
    <rect x="18" y="260" width="359" height="75" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="197" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">HOMEOSTASE E INTEGRIDADE TECIDUAL</text>
    <text x="197" y="305" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#047857" text-anchor="middle">O sistema imune ataca patógenos externos e protege os tecidos próprios.</text>
    <text x="197" y="322" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-style="italic" fill="#0f766e" text-anchor="middle">Complemento e anticorpos atuam em perfeita harmonia.</text>
  </g>

  <!-- Lado Direito: Patologia LES -->
  <g transform="translate(470, 95)" filter="url(#dropShadow)">
    <rect width="395" height="360" rx="12" fill="url(#redGrad)" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="395" height="42" rx="12" fill="#dc2626"/>
    <text x="197" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      QUEBRA DA TOLERÂNCIA NO LES (Patologia)
    </text>

    <!-- Card 1 -->
    <rect x="18" y="55" width="359" height="85" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="45" cy="97" r="14" fill="#dc2626"/>
    <text x="45" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">✕</text>
    <text x="70" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Falha de Checkpoints &amp; Escape B/T</text>
    <text x="70" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#b91c1c">• Queda qualitativa/quantitativa de Tregs</text>
    <text x="70" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#b91c1c">• Sobrevivência anômala de clones B autorreativos</text>
    <text x="70" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7f1d1d">• Hiperprodução de autoanticorpos antinucleares</text>

    <!-- Card 2 -->
    <rect x="18" y="150" width="359" height="95" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="30" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Apoptose Aumentada + Clearance Deficiente:</text>
    <text x="30" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Radiação UV induz morte de ceratinócitos</text>
    <text x="30" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#1e293b">• Corpos apoptóticos persistem e expõem DNA e nucleossomos</text>
    <text x="30" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#b91c1c">• Estimulação crônica via TLR7/9 e Interferon tipo I</text>

    <!-- Desfecho Vermelho -->
    <rect x="18" y="260" width="359" height="75" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="197" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">FORMAÇÃO DE IMUNOCOMPLEXOS E DANO MULTISSISTÊMICO</text>
    <text x="197" y="305" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle">Deposição em rins, vasos, pele, articulações e cérebro.</text>
    <text x="197" y="322" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-style="italic" fill="#7f1d1d" text-anchor="middle">Ciclo vicioso autoperpetuante de inflamação e destruição celular.</text>
  </g>
</svg>