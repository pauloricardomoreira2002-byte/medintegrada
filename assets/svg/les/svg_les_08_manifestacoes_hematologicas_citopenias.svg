<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    HEMATOLOGIA DO LES: ESPECTRO E MECANISMOS DAS CITOPENIAS
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    Diferenciação entre Anemia de Doença Crônica vs. Anemia Hemolítica, Leucopenia, Linfopenia e Plaquetopenia
  </text>

  <!-- 3 Cartões Centrais -->
  <!-- Coluna 1: Anemias (Pegadinha Prova) -->
  <g transform="translate(35, 95)" filter="url(#dropShadow)">
    <rect width="265" height="255" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="40" rx="10" fill="#dc2626"/>
    <text x="132" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ANEMIA NO LES (≈50%)</text>

    <rect x="12" y="50" width="241" height="90" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">1. Anemia de Doença Crônica:</text>
    <text x="20" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">• É a mais comum (~90% das anemias!)</text>
    <text x="20" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Normocítica e Normocrônica</text>
    <text x="20" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Hepcidina alta → ferro retido no macrófago</text>
    <text x="20" y="133" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-style="italic" fill="#7f1d1d">NÃO pontua nos critérios diagnósticos EULAR!</text>

    <rect x="12" y="148" width="241" height="95" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="166" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e40af">2. Anemia Hemolítica Autoimune:</text>
    <text x="20" y="183" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#2563eb">• Ocorre em apenas ~10% dos pacientes</text>
    <text x="20" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• <tspan font-weight="bold">Coombs Direto Positivo</tspan> (IgG/C3b)</text>
    <text x="20" y="217" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Reticulocitose, ↑ DHL, ↑ BI, ↓ Haptoglobina</text>
    <text x="20" y="233" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#059669">PONTUA 4 PONTOS NO EULAR 2019!</text>
  </g>

  <!-- Coluna 2: Leucopenia & Linfopenia -->
  <g transform="translate(318, 95)" filter="url(#dropShadow)">
    <rect width="265" height="255" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="40" rx="10" fill="#2563eb"/>
    <text x="132" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">SÉRIE BRANCA: LEUCO &amp; LINFO</text>

    <rect x="12" y="50" width="241" height="90" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e40af">Leucopenia (&lt; 4.000 / mm³):</text>
    <text x="20" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Muito comum na atividade da doença</text>
    <text x="20" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Destruição mediada por anticorpos</text>
    <text x="20" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#2563eb">• Pontua 3 pontos no EULAR 2019</text>
    <text x="20" y="133" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">(Descartar infecções ou toxicidade medicamentosa)</text>

    <rect x="12" y="148" width="241" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="166" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#334155">Linfopenia (&lt; 1.000 / mm³):</text>
    <text x="20" y="183" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Marcador fiel de ATIVIDADE do LES</text>
    <text x="20" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Anticorpos antilinfócito circulantes</text>
    <text x="20" y="217" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Aumenta risco de infecções oportunistas</text>
    <text x="20" y="233" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#475569">Recupera com controle da atividade inflamatória</text>
  </g>

  <!-- Coluna 3: Plaquetopenia -->
  <g transform="translate(600, 95)" filter="url(#dropShadow)">
    <rect width="265" height="255" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="40" rx="10" fill="#7c3aed"/>
    <text x="132" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PLAQUETAS (≈33% DOS CASOS)</text>

    <rect x="12" y="50" width="241" height="90" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#6d28d9">Trombocitopenia Autoimune:</text>
    <text x="20" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Anticorpos anti-glicoproteína IIb/IIIa</text>
    <text x="20" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Depuração acelerada no baço (PTI-símile)</text>
    <text x="20" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#7c3aed">• Plaquetas &lt; 100.000 / mm³: 4 PONTOS</text>
    <text x="20" y="133" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">(Critério EULAR 2019)</text>

    <rect x="12" y="148" width="241" height="95" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="20" y="166" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">Abordagem Terapêutica:</text>
    <text x="20" y="183" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Plaquetas &gt; 50.000 assintomático: vigiar</text>
    <text x="20" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Plaquetas &lt; 30.000 ou sangramento:</text>
    <text x="20" y="217" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">Corticoide em dose alta ± Imunoglobulina</text>
    <text x="20" y="233" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#6d28d9">Casos refratários: RITUXIMABE (anti-CD20)</text>
  </g>

  <!-- Banner Inferior de Alerta -->
  <g transform="translate(35, 365)" filter="url(#dropShadow)">
    <rect width="830" height="95" rx="8" fill="#1e293b"/>
    <text x="415" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#f87171" text-anchor="middle">
      🚨 ATENÇÃO ALUNO: PROVAS INFLAMATÓRIAS NO LES (VHS vs. PCR)
    </text>
    <text x="30" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#60a5fa">Atividade do Lúpus:</tspan> Caracteriza-se por <tspan font-weight="bold" fill="#34d399">VHS MUITO ELEVADA</tspan> com <tspan font-weight="bold" fill="#f87171">PCR NORMAL OU DISCRETAMENTE ELEVADA</tspan> (o IFN-α inibe a síntese hepática de PCR!).
    </text>
    <text x="30" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#fbbf24">PEGADINHA DE OURO:</tspan> Se paciente lúpico apresentar <tspan font-weight="bold" fill="#f87171">PCR MUITO ALTA (&gt;50 mg/L)</tspan>, a principal hipótese NÃO é flare lúpico isolado,
    </text>
    <text x="30" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      mas sim <tspan font-weight="bold" fill="#ef4444">INFECÇÃO BACTERIANA INTERCORRENTE</tspan> (ou serosite grave associada)!
    </text>
  </g>
</svg>