<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    CRITÉRIOS CLASSIFICATÓRIOS OFICIAIS EULAR / ACR 2019
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    Passo a passo: Critério de Entrada Obrigatório + Sistema de Pontuação Ponderada (Escore ≥ 10 pontos)
  </text>

  <!-- Etapa 1: Critério de Entrada -->
  <g transform="translate(35, 90)" filter="url(#dropShadow)">
    <rect width="830" height="50" rx="8" fill="#1e3a8a"/>
    <text x="415" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#facc15" text-anchor="middle">
      PASSO 1: CRITÉRIO DE ENTRADA OBRIGATÓRIO (ENTRY CRITERION)
    </text>
    <text x="415" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
      FAN em células HEp-2 positivo em título ≥ 1:80. Se NÃO presente, NÃO classificar como LES! Se presente, prossiga para pontuação.
    </text>
  </g>

  <!-- Coluna da Esquerda: Domínios Clínicos (7 domínios) -->
  <g transform="translate(35, 150)" filter="url(#dropShadow)">
    <rect width="405" height="250" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="405" height="28" rx="8" fill="#2563eb"/>
    <text x="202" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      DOMÍNIOS CLÍNICOS (Considerar o maior ponto de cada domínio)
    </text>

    <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">1. Constitucional:</text>
    <text x="15" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Febre (&gt; 38,3°C sem infecção): <tspan font-weight="bold" fill="#2563eb">2 pts</tspan></text>

    <text x="15" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">2. Hematológico:</text>
    <text x="15" y="93" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Leucopenia (&lt;4.000): <tspan font-weight="bold">3 pts</tspan> | Plaquetopenia (&lt;100k): <tspan font-weight="bold">4 pts</tspan> | Hemólise: <tspan font-weight="bold" fill="#dc2626">4 pts</tspan></text>

    <text x="15" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">3. Neuropsiquiátrico:</text>
    <text x="15" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Delirium: <tspan font-weight="bold">2 pts</tspan> | Psicose: <tspan font-weight="bold">3 pts</tspan> | Convulsão: <tspan font-weight="bold" fill="#dc2626">5 pts</tspan></text>

    <text x="15" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">4. Mucocutâneo:</text>
    <text x="15" y="157" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Alopecia/Úlcera oral: <tspan font-weight="bold">2 pts</tspan> | Subagudo/Discoide: <tspan font-weight="bold">4 pts</tspan> | Lúpus Agudo: <tspan font-weight="bold" fill="#dc2626">6 pts</tspan></text>

    <text x="15" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">5. Serosas:</text>
    <text x="15" y="189" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Derrame pleural/pericárdico: <tspan font-weight="bold">5 pts</tspan> | Pericardite aguda: <tspan font-weight="bold" fill="#dc2626">6 pts</tspan></text>

    <text x="15" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">6. Musculoesquelético &amp; 7. Renal:</text>
    <text x="15" y="221" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Sinovite / dor com rigidez matinal ≥ 30 min em ≥ 2 articulações: <tspan font-weight="bold" fill="#dc2626">6 pts</tspan></text>
    <text x="15" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Proteinúria &gt;0,5g: <tspan font-weight="bold">4 pts</tspan> | Nefrite II/VI: <tspan font-weight="bold">8 pts</tspan> | Nefrite III/IV: <tspan font-weight="bold" fill="#dc2626">10 pts</tspan></text>
  </g>

  <!-- Coluna da Direita: Domínios Imunológicos (3 domínios) + Regra -->
  <g transform="translate(460, 150)" filter="url(#dropShadow)">
    <rect width="405" height="250" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="405" height="28" rx="8" fill="#059669"/>
    <text x="202" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      DOMÍNIOS IMUNOLÓGICOS &amp; REGRA DE CLASSIFICAÇÃO
    </text>

    <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">8. Anticorpos Antifosfolípides:</text>
    <text x="15" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Anticoagulante lúpico, aCL IgG/M ou Anti-β2GP1: <tspan font-weight="bold" fill="#059669">2 pts</tspan></text>

    <text x="15" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">9. Proteínas do Complemento:</text>
    <text x="15" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• C3 baixo <tspan font-weight="bold">OU</tspan> C4 baixo: <tspan font-weight="bold">3 pts</tspan></text>
    <text x="15" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• C3 baixo <tspan font-weight="bold">E</tspan> C4 baixo simultâneos: <tspan font-weight="bold" fill="#059669">4 pts</tspan></text>

    <text x="15" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">10. Anticorpos Altamente Específicos:</text>
    <text x="15" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Anti-dsDNA <tspan font-weight="bold">OU</tspan> Anti-Sm positivo: <tspan font-weight="bold" fill="#dc2626">6 pts</tspan></text>

    <!-- Caixa de Desfecho Final -->
    <rect x="15" y="165" width="375" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="202" y="187" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">
      ★ PONTUAÇÃO TOTAL NECESSÁRIA:
    </text>
    <text x="202" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">
      ESCORE ≥ 10 PONTOS = CLASSIFICADO COMO LES!
    </text>
    <text x="202" y="224" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#7f1d1d" text-anchor="middle">
      (Obrigatório ter pelo menos 1 critério de domínio clínico).
    </text>
  </g>

  <!-- Banner Inferior de Regras Especiais -->
  <g transform="translate(35, 410)">
    <rect width="830" height="55" rx="8" fill="#1e293b"/>
    <text x="415" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      REGRAS CRÍTICAS DE VALIDAÇÃO DO EULAR 2019
    </text>
    <text x="415" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ffffff" text-anchor="middle">
      1. Descartar infecção em todos os critérios | 2. Conta-se apenas o critério de maior pontuação por domínio | 3. Critérios cumulativos no tempo
    </text>
  </g>
</svg>