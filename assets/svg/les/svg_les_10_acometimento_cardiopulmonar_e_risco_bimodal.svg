<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    MANIFESTAÇÕES CARDIOPULMONARES &amp; ATEROSCLEROSE ACELERADA
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    Espectro de serosites, endocardite não-infecciosa de Libman-Sacks e o padrão bimodal de mortalidade
  </text>

  <!-- Lado Esquerdo: Pulmonar -->
  <g transform="translate(35, 95)" filter="url(#dropShadow)">
    <rect width="265" height="235" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="36" rx="10" fill="#2563eb"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">SISTEMA PULMONAR (≈50%)</text>

    <text x="15" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">1. Pleurite / Derrame Pleural:</text>
    <text x="15" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Manifestação pulmonar mais comum</text>
    <text x="15" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Dor ventilatório-dependente bilateral</text>
    <text x="15" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Exsudato com complemento baixo</text>

    <text x="15" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">2. Emergências Graves:</text>
    <text x="15" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#dc2626">• <tspan font-weight="bold">Hemorragia Alveolar Difusa:</tspan></text>
    <text x="15" y="167" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Hemoptise súbita, dispneia e queda de Hb</text>
    <text x="15" y="184" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">• Pneumonite Lúpica Aguda</text>
    <text x="15" y="201" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">• Síndrome do Pulmão Encolhido</text>
    <text x="15" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">• TEP (associado a antifosfolípides)</text>
  </g>

  <!-- Centro: Cardíaco -->
  <g transform="translate(318, 95)" filter="url(#dropShadow)">
    <rect width="265" height="235" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="36" rx="10" fill="#dc2626"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">SISTEMA CARDÍACO</text>

    <text x="15" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">1. Pericardite (Mais Comum):</text>
    <text x="15" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Presente em 20 a 40% dos casos</text>
    <text x="15" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Dor retroesternal aliviada ao inclinar</text>
    <text x="15" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Risco de tamponamento cardíaco</text>

    <text x="15" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">2. Libman-Sacks &amp; Miocardite:</text>
    <text x="15" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">• Endocardite de Libman-Sacks:</text>
    <text x="15" y="167" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Vegetações <tspan font-weight="bold">VERRUCOSAS ASSÉPTICAS</tspan></text>
    <text x="15" y="184" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">em valvas mitral e aórtica (emboligênica!)</text>
    <text x="15" y="201" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">• Miocardite: taquicardia desproporcional</text>
    <text x="15" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Pode evoluir com IC e arritmias graves</text>
  </g>

  <!-- Lado Direito: Mortalidade Bimodal -->
  <g transform="translate(600, 95)" filter="url(#dropShadow)">
    <rect width="265" height="235" rx="10" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="36" rx="10" fill="#d97706"/>
    <text x="132" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CURVA BIMODAL DE MORTE</text>

    <rect x="12" y="48" width="241" height="80" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">PICO PRECOCE (&lt; 5 anos):</text>
    <text x="20" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">• 1. Atividade Lúpica Grave</text>
    <text x="20" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">• 2. Infecções Oportunistas</text>
    <text x="20" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#475569">(Devido a pulsoterapia e imunossupressão)</text>

    <rect x="12" y="138" width="241" height="85" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="20" y="156" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#b45309">PICO TARDIO (&gt; 10 anos):</text>
    <text x="20" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">• 1. Doença Cardiovascular (IAM/AVC)</text>
    <text x="20" y="191" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Aterosclerose precoce acelerada!</text>
    <text x="20" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">• 2. Neoplasias e DRC terminal</text>
  </g>

  <!-- Banner Inferior explicativo do Infarto em Mulher Jovem -->
  <g transform="translate(35, 345)" filter="url(#dropShadow)">
    <rect width="830" height="115" rx="10" fill="#1e293b"/>
    <text x="415" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f87171" text-anchor="middle">
      ★ POR QUE MULHERES JOVENS COM LES INFARTAM ATÉ 50 VEZES MAIS?
    </text>
    <text x="25" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#fca5a5">Inflamação Endotelial Crônica:</tspan> O interferon-α e citocinas oxidam LDL precocemente e formam placas de ateroma instáveis.
    </text>
    <text x="25" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#fde68a">Toxicidade Cumulativa de Corticoides:</tspan> Induzem dislipidemia mista, hipertensão arterial, resistência à insulina e obesidade central.
    </text>
    <text x="25" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#86efac">Efeito Protetor da Hidroxicloroquina:</tspan> Reduz o perfil aterogênico e diminui eventos trombóticos em mais de 50%!
    </text>
  </g>
</svg>