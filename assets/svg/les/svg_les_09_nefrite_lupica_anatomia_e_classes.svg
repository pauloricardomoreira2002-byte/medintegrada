<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    NEFRITE LÚPICA: ANATOMIA GLOMERULAR &amp; AS 6 CLASSES (ISN/RPS)
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    A correlação estrita entre a localização dos imunocomplexos no filtro glomerular, histologia e gravidade clínica
  </text>

  <!-- 6 Caixas das Classes (2 linhas x 3 colunas) -->
  <!-- Classe I -->
  <g transform="translate(35, 95)" filter="url(#dropShadow)">
    <rect width="265" height="110" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#059669"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">CLASSE I: MESANGIAL MÍNIMA</text>
    <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#065f46">• Óptica: Glomérulos Normais</text>
    <text x="15" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• IF: Depósitos no mesângio</text>
    <text x="15" y="79" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Clínica: Assintomático ou microhematúria</text>
    <text x="15" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#059669">Excelente prognóstico; sem terapia agressiva.</text>
  </g>

  <!-- Classe II -->
  <g transform="translate(318, 95)" filter="url(#dropShadow)">
    <rect width="265" height="110" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#2563eb"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">CLASSE II: MESANGIAL PROLIFERATIVA</text>
    <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">• Óptica: Proliferação celular mesangial</text>
    <text x="15" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• IF: Depósitos mesangiais imunes</text>
    <text x="15" y="79" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Clínica: Hematúria microscópica ± proteinúria leve</text>
    <text x="15" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">Tratamento: Bloqueio do SRAA (iECA/BRA).</text>
  </g>

  <!-- Classe III -->
  <g transform="translate(600, 95)" filter="url(#dropShadow)">
    <rect width="265" height="110" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#d97706"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">CLASSE III: PROLIFERATIVA FOCAL</text>
    <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309">• Óptica: Envolve &lt; 50% dos glomérulos</text>
    <text x="15" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Depósitos <tspan font-weight="bold">SUBENDOTELIAIS</tspan> e mesangiais</text>
    <text x="15" y="79" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Síndrome Nefrítica, hematúria franca, HAS</text>
    <text x="15" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#b45309">Forma GRAVE: requer indução imunossupressora.</text>
  </g>

  <!-- Linha 2 -->
  <!-- Classe IV (A MAIS GRAVE) -->
  <g transform="translate(35, 218)" filter="url(#dropShadow)">
    <rect width="265" height="125" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#dc2626"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">CLASSE IV: PROLIFERATIVA DIFUSA</text>
    <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">★ A MAIS COMUM E MAIS GRAVE (≥50%)</text>
    <text x="15" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Depósitos subendoteliais maciços ("wire-loop")</text>
    <text x="15" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Semiluas celulares, necrose, cilindros hemáticos</text>
    <text x="15" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Risco eminente de perda renal aguda / DRC</text>
    <text x="15" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">Terapia Tripla: Corticoide + MMF/Ciclo + Belim.</text>
  </g>

  <!-- Classe V -->
  <g transform="translate(318, 218)" filter="url(#dropShadow)">
    <rect width="265" height="125" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#7c3aed"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">CLASSE V: MEMBRANOSA</text>
    <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#6d28d9">★ PADRÃO NEFRÓTICO PURO</text>
    <text x="15" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Depósitos <tspan font-weight="bold">SUBEPITELIAIS</tspan> ("espículas")</text>
    <text x="15" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Proteinúria maciça (&gt;3,5 g/24h), anasarca, dislipidemia</text>
    <text x="15" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Alto risco de trombose venosa (anti-trombina III perdida)</text>
    <text x="15" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#6d28d9">Tratamento: Corticoide + MMF + Inib. Calcineurina.</text>
  </g>

  <!-- Classe VI -->
  <g transform="translate(600, 218)" filter="url(#dropShadow)">
    <rect width="265" height="125" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#4b5563"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">CLASSE VI: ESCLEROSANTE AVANÇADA</text>
    <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#374151">• ≥ 90% dos glomérulos esclerosados</text>
    <text x="15" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Cicatrização e fibrose intersticial difusa</text>
    <text x="15" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• Sem inflamação ativa; IF quase sem depósitos</text>
    <text x="15" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">• DRC terminal / uremia estabelecida</text>
    <text x="15" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#374151">NÃO responde a imunossupressão; diálise/Tx.</text>
  </g>

  <!-- Painel Didático Inferior: O "Filtro de Café" Glomerular -->
  <g transform="translate(35, 355)" filter="url(#dropShadow)">
    <rect width="830" height="105" rx="8" fill="#1e293b"/>
    <text x="415" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      DIDÁTICA DO FILTRO: ONDE ESTÁ O IMUNOCOMPLEXO NO GLOMÉRULO?
    </text>
    <text x="25" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#60a5fa">Subendotelial (Classes III e IV):</tspan> O depósito fica em contato direto com o sangue capilar → atrai neutrófilos e consome complemento maciçamente → <tspan fill="#f87171" font-weight="bold">Inflamação destrutiva e Síndrome Nefrítica</tspan>.
    </text>
    <text x="25" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#c084fc">Subepitelial (Classe V):</tspan> O depósito fica do lado de fora da membrana basal, sob os podócitos → não tem contato com neutrófilos circulantes → lesiona o diafragma de fenda podocitário sem inflamação celular exuberante → <tspan fill="#34d399" font-weight="bold">Proteinúria maciça Nefrótica</tspan>.
    </text>
    <text x="25" y="87" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-style="italic" fill="#cbd5e1">
      ★ BIÓPSIA RENAL É MANDATÓRIA: Não é possível prever com certeza a classe histológica apenas pelo exame clínico ou EAS!
    </text>
  </g>
</svg>