<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    LÚPUS ERITEMATOSO SISTÊMICO NA GESTAÇÃO
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    Planejamento gestacional, passagem transplacentária de anticorpos e o temido Bloqueio Cardíaco Congênito
  </text>

  <!-- Lado Esquerdo: Riscos Materno-Fetais -->
  <g transform="translate(35, 95)" filter="url(#dropShadow)">
    <rect width="400" height="240" rx="10" fill="#ffffff" stroke="#ec4899" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="38" rx="10" fill="#db2777"/>
    <text x="200" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      RISCOS OBSTÉTRICOS &amp; PLANEJAMENTO
    </text>

    <text x="20" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#9d174d">
      Regra de Ouro do Planejamento:
    </text>
    <text x="20" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#059669">
      ✓ Gestação liberada apenas com DOENÇA EM REMISSÃO HÁ ≥ 6 MESES!
    </text>
    <text x="20" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">
      Nefrite lúpica ativa e hipertensão descontrolada contraindicam engravidar.
    </text>

    <rect x="18" y="110" width="364" height="115" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
    <text x="28" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#9d174d">
      Complicações Maternas e Fetais Frequentes:
    </text>
    <text x="28" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      • Exacerbação (flare) de nefrite e serosite na gestação e puerpério
    </text>
    <text x="28" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      • Alto risco de <tspan font-weight="bold" fill="#be185d">Pré-Eclâmpsia</tspan>, restrição de crescimento e prematuridade
    </text>
    <text x="28" y="186" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      • Se anticorpos antifosfolípides (SAF): risco elevado de perdas fetais
    </text>
    <text x="28" y="204" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      • Aspirina em dose baixa (AAS) + Enoxaparina indicados profilaticamente
    </text>
  </g>

  <!-- Lado Direito: Lúpus Neonatal e BAVT -->
  <g transform="translate(465, 95)" filter="url(#dropShadow)">
    <rect width="400" height="240" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="38" rx="10" fill="#dc2626"/>
    <text x="200" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      LÚPUS NEONATAL &amp; BLOQUEIO CARDÍACO (BAVT)
    </text>

    <text x="20" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">
      Passagem Transplacentária de IgG Materna:
    </text>
    <text x="20" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">
      ★ Anticorpos Anti-Ro (SSA) e Anti-La (SSB) cruzam a placenta!
    </text>
    <text x="20" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">
      Ocorrem a partir da 16ª semana de gestação.
    </text>

    <rect x="18" y="110" width="364" height="115" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="28" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">
      As Duas Faces do Lúpus Neonatal:
    </text>
    <text x="28" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1e293b">
      1. <tspan font-weight="bold">Lesões Cutâneas Anulares Transitórias:</tspan> somem aos 6 meses de vida
    </text>
    <text x="28" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b">
      (Quando os anticorpos maternos são metabolizados pelo bebê).
    </text>
    <text x="28" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">
      2. BAVT CONGÊNITO: FIBROSE DO NÓDULO AV IRREVERSÍVEL!
    </text>
    <text x="28" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" fill="#7f1d1d">
      Requer marcapasso definitivo intraútero ou logo ao nascer!
    </text>
  </g>

  <!-- Banner Farmacológico na Gestação (Crucial para Provas) -->
  <g transform="translate(35, 350)" filter="url(#dropShadow)">
    <rect width="830" height="110" rx="10" fill="#1e293b"/>
    <text x="415" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      SEGURANÇA MEDICAMENTOSA NO LES GESTACIONAL (TABELA DE PROVA)
    </text>

    <!-- Permitidos -->
    <rect x="20" y="38" width="385" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">✓ SEGUROS / LIBERADOS NA GESTAÇÃO:</text>
    <text x="30" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">• Hidroxicloroquina (NUNCA SUSPENDER! Reduz BAVT)</text>
    <text x="30" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#065f46">• Prednisona (dose baixa), Azatioprina e Ciclosporina.</text>

    <!-- Proibidos -->
    <rect x="425" y="38" width="385" height="60" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="435" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">✕ CONTRAINDICADOS / TERATOGÊNICOS:</text>
    <text x="435" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">• Micofenolato Mofetil (MMF) e Metotrexato (MTX)</text>
    <text x="435" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#7f1d1d">• Ciclofosfamida, Leflunomida e Bloqueadores de SRAA.</text>
  </g>
</svg>