<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#475569" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  
  <rect x="25" y="20" width="850" height="58" rx="10" fill="url(#headerGrad)" filter="url(#dropShadow)"/>
  <text x="450" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    O UNIVERSO DO FAN (FATOR ANTINUCLEAR) POR IFI EM HEp-2
  </text>
  <text x="450" y="67" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">
    Critério de Entrada EULAR/ACR 2019 (≥ 1:80), correlação morfológica e autoanticorpos específicos
  </text>

  <!-- 6 Padrões Principais de IFI -->
  <!-- 1. Nuclear Homogêneo -->
  <g transform="translate(35, 95)" filter="url(#dropShadow)">
    <rect width="265" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#1d4ed8"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">A. NUCLEAR HOMOGÊNEO</text>
    <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">• Autoanticorpos Associados:</text>
    <text x="15" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#2563eb">Anti-dsDNA, Anti-Histona</text>
    <text x="15" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Complexo DNA-histona (nucleossomo).</text>
    <text x="15" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#059669">Típico de LES ativo e Lúpus por Drogas.</text>
  </g>

  <!-- 2. Nuclear Pontilhado Grosso -->
  <g transform="translate(318, 95)" filter="url(#dropShadow)">
    <rect width="265" height="110" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#6d28d9"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">B. PONTILHADO GROSSO</text>
    <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">• Autoanticorpos Associados:</text>
    <text x="15" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#7c3aed">Anti-Sm e Anti-U1-RNP</text>
    <text x="15" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Ribonucleoproteínas nucleares pequenas.</text>
    <text x="15" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5b21b6">Anti-Sm é específico do LES; RNP em DMTC.</text>
  </g>

  <!-- 3. Nuclear Pontilhado Fino -->
  <g transform="translate(600, 95)" filter="url(#dropShadow)">
    <rect width="265" height="110" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#047857"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">C. PONTILHADO FINO</text>
    <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#065f46">• Autoanticorpos Associados:</text>
    <text x="15" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#059669">Anti-Ro (SSA) e Anti-La (SSB)</text>
    <text x="15" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Proteínas citoplasmáticas/nucleares.</text>
    <text x="15" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#065f46">Cutâneo subagudo, Sjögren, BAVT neonatal.</text>
  </g>

  <!-- 4. Nucleolar Aglomerado -->
  <g transform="translate(35, 218)" filter="url(#dropShadow)">
    <rect width="265" height="110" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#b45309"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">D. NUCLEOLAR AGLOMERADO</text>
    <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#92400e">• Autoanticorpos Associados:</text>
    <text x="15" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#d97706">Anti-Fibrilarina, Anti-U3-snoRNP</text>
    <text x="15" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Subunidades de montagem do nucléolo.</text>
    <text x="15" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#92400e">Comum na Esclerose Sistêmica e LES.</text>
  </g>

  <!-- 5. Nuclear Centromérico -->
  <g transform="translate(318, 218)" filter="url(#dropShadow)">
    <rect width="265" height="110" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#be185d"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">E. CENTROMÉRICO</text>
    <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#9d174d">• Autoanticorpos Associados:</text>
    <text x="15" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#db2777">Anti-Centrômero (CENP-B)</text>
    <text x="15" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Cineteócoros cromossômicos.</text>
    <text x="15" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9d174d">Esclerose Sistêmica Limitada (CREST).</text>
  </g>

  <!-- 6. Citoplasmático / P Ribossômico -->
  <g transform="translate(600, 218)" filter="url(#dropShadow)">
    <rect width="265" height="110" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#b91c1c"/>
    <text x="132" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">F. CITOPLASMÁTICO / MISTO</text>
    <text x="15" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">• Autoanticorpos Associados:</text>
    <text x="15" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">Anti-Proteína P Ribossômica</text>
    <text x="15" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Proteínas das subunidades ribossômicas.</text>
    <text x="15" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">Altamente associado a PSICOSE LÚPICA!</text>
  </g>

  <!-- Banner Inferior: Conceito de Entrada EULAR -->
  <g transform="translate(35, 345)" filter="url(#dropShadow)">
    <rect width="830" height="115" rx="10" fill="#1e293b"/>
    <text x="415" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#facc15" text-anchor="middle">
      ⚠️ CONCEITO CRÍTICO DE PROVA: FAN POSITIVO ≠ DIAGNÓSTICO DE LES!
    </text>
    <text x="25" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#38bdf8">Sensibilidade de 99%:</tspan> O FAN em células HEp-2 é o <tspan font-weight="bold" fill="#34d399">CRITÉRIO DE ENTRADA OBRIGATÓRIO (título ≥ 1:80)</tspan>. Se negativo, o paciente NÃO é classificado como LES pelo EULAR 2019.
    </text>
    <text x="25" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#f87171">Baixa Especificidade Isolada:</tspan> O FAN positivo ocorre em até 10-15% das pessoas saudáveis, em infecções crônicas (HCV, HIV, TB), hepatopatias e tireoidite.
    </text>
    <text x="25" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
      • <tspan font-weight="bold" fill="#fde68a">Regra Prática:</tspan> O valor preditivo depende do TÍTULO (quanto mais alto, maior o risco) e da presença dos autoanticorpos específicos!
    </text>
  </g>
</svg>