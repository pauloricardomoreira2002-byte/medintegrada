        <!-- AXIS 1 TITLE BAR -->
        <g transform="translate(40, 240)">
          <rect width="1840" height="30" rx="6" fill="#1e293b"/>

          <text x="16" y="20" class="font-sans bold" font-size="12" fill="#a855f7" letter-spacing="0.5">
            EIXO 1: NATUREZA BIOLÓGICA, CLONALIDADE &amp; FISIOPATOLOGIA CENTRAL
          </text>
          <text x="1824" y="20" class="font-sans regular" font-size="11" fill="#94a3b8" text-anchor="end">
            Origem celular, mecanismo patogênico central e cascata de lesão tecidual
          </text>
        </g>
        

            <!-- Axis 1 Card Col 1 -->
            <g transform="translate(40, 274)">
              <!-- Card Background -->
              <rect width="908" height="220" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.45" filter="url(#cardShadow)"/>
              <!-- Colored Left Accent Border -->

              <!-- Content Lines -->
            
<text x="18" y="22" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Natureza: </tspan>
<tspan fill="#334155">Neoplasia hematológica maligna por proliferação CLONAL de plasmócitos anormais na medula óssea.</tspan></text>
<text x="18" y="40" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Produção: </tspan>
<tspan fill="#334155">Secreção autônoma de imunoglobulina monoclonal homogênea (Proteína M) ou cadeias leves livres (Bence</tspan></text>
<text x="26" y="56" class="font-sans" font-size="11.5"><tspan fill="#334155">Jones).</tspan></text>
<text x="18" y="74" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Mecanismo Medular: </tspan>
<tspan fill="#334155">Plasmócitos aderem ao estroma (VLA-4/VCAM-1) induzindo secreção massiva de Interleucina-6</tspan></text>
<text x="26" y="90" class="font-sans" font-size="11.5"><tspan fill="#334155">(IL-6 - potente fator proliferativo e de sobrevida).</tspan></text>
<text x="18" y="108" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Desbalanço Ósseo: </tspan>
<tspan fill="#334155">Superestimulação de osteoclastos via RANKL + MIP-1α e SUPRESSÃO TOTAL de osteoblastos via</tspan></text>
<text x="26" y="124" class="font-sans" font-size="11.5"><tspan fill="#334155">DKK-1 e esclerostina -&gt; Lise puramente destrutiva sem reparo osteogênico!</tspan></text>

              <rect x="14" y="192" width="880" height="22" rx="6" fill="#f3e8ff"/>
              <text x="454.0" y="207" class="font-sans bold" font-size="10.5" fill="#6b21a8" text-anchor="middle">
                ★ Proliferação Clonal Plasmocitária • IL-6 autocrina • Reabsorção óssea RANKL com supressão de osteoblastos (DKK-1)
              </text>
            </g>
            

            <!-- Axis 1 Card Col 2 -->
            <g transform="translate(972, 274)">
              <!-- Card Background -->
              <rect width="908" height="220" rx="10" fill="#ffffff" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.45" filter="url(#cardShadow)"/>
              <!-- Colored Left Accent Border -->
              <rect x="0" y="0" width="5" height="220" rx="2.5" fill="#be185d"/>
              
              <!-- Content Lines -->
            
<text x="18" y="22" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Natureza: </tspan>
<tspan fill="#334155">Doença inflamatória crônica AUTOIMUNE, multissistêmica e heterogênea, com quebra profunda da</tspan></text>
<text x="26" y="38" class="font-sans" font-size="11.5"><tspan fill="#334155">tolerância imunológica.</tspan></text>
<text x="18" y="56" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Produção: </tspan>
<tspan fill="#334155">Ativação policlonal desregulada de células B gerando autoanticorpos dirigidos contra antígenos</tspan></text>
<text x="26" y="72" class="font-sans" font-size="11.5"><tspan fill="#334155">nucleares e citoplasmáticos próprios.</tspan></text>
<text x="18" y="90" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Imunidade Inata: </tspan>
<tspan fill="#334155">Eliminação ineficaz de células apoptóticas e restos nucleares -&gt; ativação de TLR-7 e TLR-9 -&gt;</tspan></text>
<text x="26" y="106" class="font-sans" font-size="11.5"><tspan fill="#334155">hiperprodução de Interferon tipo I (IFN-α) e NETs de neutrófilos.</tspan></text>
<text x="18" y="124" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Lesão Tecidual: </tspan>
<tspan fill="#334155">Hipersensibilidade Tipo III: deposição tecidual de imunocomplexos circulantes -&gt; ativação da via</tspan></text>
<text x="26" y="140" class="font-sans" font-size="11.5"><tspan fill="#334155">clássica do complemento (C3/C4) -&gt; vasculite e glomerulonefrite difusa.</tspan></text>

              <rect x="14" y="192" width="880" height="22" rx="6" fill="#ffe4e6"/>
              <text x="454.0" y="207" class="font-sans bold" font-size="10.5" fill="#9f1239" text-anchor="middle">
                ★ Doença Autoimune Policlonal • Assinatura de Interferon tipo I • Imunocomplexos teciduais com consumo de C3 e C4
              </text>
            </g>

          <text x="16" y="20" class="font-sans bold" font-size="12" fill="#a855f7" letter-spacing="0.5">
            EIXO 2: PERFIL EPIDEMIOLÓGICO, FAIXA ETÁRIA &amp; FATORES DESENCADEANTES
          </text>
          <text x="1824" y="20" class="font-sans regular" font-size="11" fill="#94a3b8" text-anchor="end">
            Demografia, faixa etária típica, prevalência por sexo e fatores de risco
          </text>
        </g>
        

            <!-- Axis 2 Card Col 1 -->
            <g transform="translate(40, 546)">
              <!-- Card Background -->
              <rect width="908" height="200" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.45" filter="url(#cardShadow)"/>
              <!-- Colored Left Accent Border -->
              <rect x="0" y="0" width="5" height="200" rx="2.5" fill="#7c3aed"/>
              
              <!-- Content Lines -->
            
<text x="18" y="22" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Faixa Etária: </tspan>
<tspan fill="#334155">Doença típica de IDOSOS. Mediana de idade ao diagnóstico de ~65 a 70 anos (Brasil: 60-65 anos).</tspan></text>
<text x="26" y="38" class="font-sans" font-size="11.5"><tspan fill="#334155">Rara antes dos 40 anos (&lt; 2%).</tspan></text>
<text x="18" y="56" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Sexo e Etnia: </tspan>
<tspan fill="#334155">Predomínio discreto no sexo masculino (1,4 : 1). Incidência 2 vezes maior em</tspan></text>
<text x="26" y="72" class="font-sans" font-size="11.5"><tspan fill="#334155">negros/afrodescendentes em comparação a caucasianos.</tspan></text>
<text x="18" y="90" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Prevalência: </tspan>
<tspan fill="#334155">~1% de todas as neoplasias malignas e ~10-13% das neoplasias hematológicas (segunda neoplasia</tspan></text>
<text x="26" y="106" class="font-sans" font-size="11.5"><tspan fill="#334155">hematológica mais comum).</tspan></text>
<text x="18" y="124" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Fatores de Risco: </tspan>
<tspan fill="#334155">Radiação ionizante, pesticidas, benzeno, história familiar em parentes de 1º grau (risco 4x</tspan></text>
<text x="26" y="140" class="font-sans" font-size="11.5"><tspan fill="#334155">maior) e evolução a partir de MGUS prévio.</tspan></text>

              <rect x="14" y="172" width="880" height="22" rx="6" fill="#f3e8ff"/>
              <text x="454.0" y="187" class="font-sans bold" font-size="10.5" fill="#6b21a8" text-anchor="middle">
                ★ Idosos (65-70 anos) • Predomínio Masculino (1,4:1) • Afrodescendentes (2x) • Evolução clonal de MGUS (1% ao ano)
              </text>
            </g>
            

            <!-- Axis 2 Card Col 2 -->
            <g transform="translate(972, 546)">
              <!-- Card Background -->
              <rect width="908" height="200" rx="10" fill="#ffffff" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.45" filter="url(#cardShadow)"/>
              <!-- Colored Left Accent Border -->
              <rect x="0" y="0" width="5" height="200" rx="2.5" fill="#be185d"/>
              
              <!-- Content Lines -->
            
<text x="18" y="22" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Faixa Etária: </tspan>
<tspan fill="#334155">Doença marcante de MULHERES JOVENS EM IDADE FÉRTIL (pico de início entre a 2ª e 3ª décadas de</tspan></text>
<text x="26" y="38" class="font-sans" font-size="11.5"><tspan fill="#334155">vida; 15 a 45 anos).</tspan></text>
<text x="18" y="56" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Sexo e Etnia: </tspan>
<tspan fill="#334155">PREDOMÍNIO FEMININO MASSIVO (razão de 9 a 10 mulheres : 1 homem). Maior frequência, gravidade e</tspan></text>
<text x="26" y="72" class="font-sans" font-size="11.5"><tspan fill="#334155">início precoce em populações negras e hispânicas.</tspan></text>
<text x="18" y="90" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Influência Hormonal: </tspan>
<tspan fill="#334155">O estrogênio desempenha papel catalisador decisivo na hiper-reatividade de células B</tspan></text>
<text x="26" y="106" class="font-sans" font-size="11.5"><tspan fill="#334155">(doença piora no puerpério/gestação).</tspan></text>
<text x="18" y="124" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Fatores Desencadeantes: </tspan>
<tspan fill="#334155">RADIAÇÃO ULTRAVIOLETA (UVB induz apoptose de queratinócitos e expõe antígenos</tspan></text>
<text x="26" y="140" class="font-sans" font-size="11.5"><tspan fill="#334155">nucleares), tabagismo, infecções virais (EBV) e drogas (LES farmacoinduzido).</tspan></text>

              <rect x="14" y="172" width="880" height="22" rx="6" fill="#ffe4e6"/>
              <text x="454.0" y="187" class="font-sans bold" font-size="10.5" fill="#9f1239" text-anchor="middle">
                ★ Mulheres Jovens (9-10:1) • Idade Fértil (15-45a) • Populações Negras (mais grave) • Fotossensibilidade (UVB gatilho)
              </text>
            </g>
            

        <!-- AXIS 3 TITLE BAR -->
        <g transform="translate(40, 764)">
          <rect width="1840" height="30" rx="6" fill="#1e293b"/>
          <rect x="0" y="0" width="6" height="30" rx="3" fill="#a855f7"/>
          
          <text x="16" y="20" class="font-sans bold" font-size="12" fill="#a855f7" letter-spacing="0.5">
            EIXO 3: COMPROMETIMENTO ÓSSEO &amp; MUSCULOESQUELÉTICO (DIFERENCIAÇÃO CRUCIAL)
          </text>
          <text x="1824" y="20" class="font-sans regular" font-size="11" fill="#94a3b8" text-anchor="end">
            Topografia óssea/articular, dor mecânica vs inflamatória e padrão radiológico
          </text>
        </g>
        

            <!-- Axis 3 Card Col 1 -->
            <g transform="translate(40, 798)">
              <!-- Card Background -->
              <rect width="908" height="235" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.45" filter="url(#cardShadow)"/>
              <!-- Colored Left Accent Border -->
              <rect x="0" y="0" width="5" height="235" rx="2.5" fill="#7c3aed"/>
              
              <!-- Content Lines -->
            
<text x="18" y="22" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Sítio Anatômico: </tspan>
<tspan fill="#334155">Tecido ÓSSEO cortical e esponjoso do esqueleto axial (coluna vertebral, costelas, crânio, pelve</tspan></text>
<text x="26" y="38" class="font-sans" font-size="11.5"><tspan fill="#334155">e fêmur proximal).</tspan></text>
<text x="18" y="56" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Padrão da Dor: </tspan>
<tspan fill="#334155">DOR ÓSSEA MECÂNICA GRAVE em ~70% dos pacientes; piora com movimentação e carga; frequentemente</tspan></text>
<text x="26" y="72" class="font-sans" font-size="11.5"><tspan fill="#334155">acordando o paciente.</tspan></text>
<text x="18" y="90" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Lesão Histopatológica: </tspan>
<tspan fill="#334155">LESÕES OSTEOLÍTICAS PURAS em &apos;saca-bocado&apos; (punched-out) sem reação osteoblástica</tspan></text>
<text x="26" y="106" class="font-sans" font-size="11.5"><tspan fill="#334155">esclerótica ao redor -&gt; alto risco de fraturas patológicas e compressão medular.</tspan></text>
<text x="18" y="124" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Cálcio Sérico: </tspan>
<tspan fill="#334155">HIPERCALCEMIA FREQUENTE (&gt; 11 mg/dL em 25%) por reabsorção óssea maciça (poliúria, constipação,</tspan></text>
<text x="26" y="140" class="font-sans" font-size="11.5"><tspan fill="#334155">náusea e torpor).</tspan></text>
<text x="18" y="158" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#5b21b6">• Cintilografia Óssea: </tspan>
<tspan fill="#334155">FALSA-NEGATIVA em 30-50% dos casos! (Pois a cintilografia depende de osteoblastos ativos,</tspan></text>
<text x="26" y="174" class="font-sans" font-size="11.5"><tspan fill="#334155">ausentes no mieloma).</tspan></text>

              <rect x="14" y="207" width="880" height="22" rx="6" fill="#f3e8ff"/>
              <text x="454.0" y="222" class="font-sans bold" font-size="10.5" fill="#6b21a8" text-anchor="middle">
                ★ Lesões Líticas Puras (&apos;saca-bocado&apos;) • Dor óssea mecânica axial • Hipercalcemia • Cintilografia FALSA-NEGATIVA
              </text>
            </g>
            

            <!-- Axis 3 Card Col 2 -->
            <g transform="translate(972, 798)">
              <!-- Card Background -->
              <rect width="908" height="235" rx="10" fill="#ffffff" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.45" filter="url(#cardShadow)"/>
              <!-- Colored Left Accent Border -->
              <rect x="0" y="0" width="5" height="235" rx="2.5" fill="#be185d"/>
              
              <!-- Content Lines -->
            
<text x="18" y="22" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Sítio Anatômico: </tspan>
<tspan fill="#334155">Articulações SINOVIAIS periféricas (80-90% dos pacientes). Predileção por pequenas articulações</tspan></text>
<text x="26" y="38" class="font-sans" font-size="11.5"><tspan fill="#334155">das mãos, punhos e joelhos.</tspan></text>
<text x="18" y="56" class="font-sans" font-size="11.5">
<tspan class="bold" fill="#831843">• Padrão da Dor: </tspan>
